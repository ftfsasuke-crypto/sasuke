<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a1a; color: #eee; text-align: center; padding: 20px; min-height: 100vh; direction: rtl; }
        #app { max-width: 600px; margin: 0 auto; background: rgba(0,0,0,0.5); border-radius: 20px; padding: 20px; }
        h1 .title-spy { background: linear-gradient(135deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 38px; }
        button { background: #e94560; color: white; border: none; padding: 12px 24px; margin: 8px; border-radius: 30px; font-size: 16px; cursor: pointer; }
        button:hover { background: #c23152; }
        input { padding: 12px; border-radius: 20px; border: none; margin: 8px; font-size: 16px; width: 70%; text-align: center; background: rgba(255,255,255,0.1); color: #fff; }
        .game-select-btn { display: block; width: 90%; margin: 12px auto; font-size: 20px; padding: 18px; }
        .host-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid #e94560; margin-bottom: 15px; }
        .host-name-display { background: linear-gradient(135deg, #f093fb, #f5576c, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app">
        <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ S A S U K E ⚔️</span></p></div>
        <button class="game-select-btn" onclick="alert('لعبة ١ - شغال!')">🎮 لعبة الجاسوس ١ (عادية)</button>
        <button class="game-select-btn" style="background: linear-gradient(135deg, #f39c12, #e67e22);" onclick="alert('لعبة ٢ - شغال!')">🎯 لعبة الجاسوس ٢ (اختباء)</button>
    </div>
</body>
</html>
