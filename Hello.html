<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #1f1c2c, #928dab);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin:0;
}
button {cursor:pointer;border:none;border-radius:12px;padding:12px 24px;margin:6px;font-size:16px;}
.overlay {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;}
.overlay-box {background:#2c2c44;padding:30px;border-radius:20px;max-width:400px;width:90%;text-align:center;}
input {width:80%;padding:12px;border-radius:12px;border:none;margin:10px auto;display:block;text-align:center;font-size:16px;}
h2,h3{margin-bottom:16px;}
.room-btn{background:linear-gradient(90deg,#6a5acd,#8a2be2);color:#fff;width:80%;margin:auto;display:block;}
</style>
</head>
<body>

<!-- هوست -->
<div id="hostOverlay" class="overlay" style="display:none;">
  <div class="overlay-box">
    <h2>👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑</h2>
    <button id="createRoomBtn" class="room-btn">🎮 لعبة الجاسوس 1</button>
    <div id="roomLinkDiv" style="margin-top:20px;display:none;">
      <button id="copyLinkBtn" class="room-btn">نسخ الرابط 📋</button>
    </div>
    <button id="startGameBtn" class="room-btn" style="display:none;margin-top:20px;">🚀 بدء اللعبة</button>
  </div>
</div>

<!-- لاعبين -->
<div id="joinOverlay" class="overlay" style="display:none;">
  <div class="overlay-box">
    <h2>✍️ اكتب اسمك</h2>
    <input id="playerNameInput" placeholder="اسمك">
    <button id="joinBtn" class="room-btn">🚪 انضم</button>
  </div>
</div>

<!-- اللعبة -->
<div id="gameOverlay" class="overlay" style="display:none;">
  <div class="overlay-box">
    <h3 id="wordDisplay">🔍 الكلمة: </h3>
    <ul id="playersList"></ul>
    <button id="startVoteBtn" style="display:none;" class="room-btn">🗳️ بدء التصويت</button>
    <button id="leaveBtn" class="room-btn" style="margin-top:20px;background:#e74c3c;">🚪 مغادرة</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  authDomain: "spy-game-1d774.firebaseapp.com",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com/",
  projectId: "spy-game-1d774"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let roomId, playerId, playerName, isHost=false, gameStarted=false;

// تصنيفات وكلمات لكل تصنيف (200 كلمة كمثال)
const categories = {
  'اكلات': Array.from({length:200},(_,i)=>`طعام${i+1}`),
  'فواكه': Array.from({length:200},(_,i)=>`فاكهة${i+1}`),
  'خضروات': Array.from({length:200},(_,i)=>`خضار${i+1}`),
  'حيوانات': Array.from({length:200},(_,i)=>`حيوان${i+1}`),
  'أجهزة': Array.from({length:200},(_,i)=>`جهاز${i+1}`),
  'مواصلات': Array.from({length:200},(_,i)=>`مواصلات${i+1}`),
  'رياضة': Array.from({length:200},(_,i)=>`رياضة${i+1}`),
  'منزل': Array.from({length:200},(_,i)=>`منزل${i+1}`),
  'دول': Array.from({length:200},(_,i)=>`دولة${i+1}`),
  'كرتون وانمي': Array.from({length:200},(_,i)=>`شخصية${i+1}`)
};

// واجهة البداية
const params = new URLSearchParams(location.search);
const roomParam = params.get('room');

if(!roomParam){
  // الهوست
  isHost=true;
  document.getElementById('hostOverlay').style.display='flex';
}else{
  roomId = roomParam;
  document.getElementById('joinOverlay').style.display='flex';
}

// إنشاء الغرفة
document.getElementById('createRoomBtn').onclick = async ()=>{
  roomId='r'+Date.now();
  playerId='host';
  isHost=true;
  await set(ref(db,'rooms/'+roomId),{host:playerId,players:{[playerId]:{name:'𝐒𝐀𝐒𝐔𝐊𝐄',left:false}},phase:'waiting'});
  document.getElementById('roomLinkDiv').style.display='block';
  document.getElementById('copyLinkBtn').onclick=()=>{
    navigator.clipboard.writeText(`${location.origin}${location.pathname}?room=${roomId}`);
    document.getElementById('copyLinkBtn').style.display='none';
  };
};

// انضمام لاعب
document.getElementById('joinBtn').onclick = async ()=>{
  const nameInput = document.getElementById('playerNameInput').value.trim();
  if(!nameInput) return alert("ادخل اسمك");
  playerName=nameInput;
  playerId='p'+Date.now();
  await set(ref(db,'rooms/'+roomId+'/players/'+playerId),{name:playerName,left:false});
  document.getElementById('joinOverlay').style.display='none';
  document.getElementById('gameOverlay').style.display='flex';
  listenPlayers();
};

// الاستماع لتحديثات اللاعبين
function listenPlayers(){
  onValue(ref(db,'rooms/'+roomId+'/players'),snap=>{
    const players=snap.val()||{};
    const list=document.getElementById('playersList');
    list.innerHTML='';
    Object.values(players).forEach(p=>{
      const li=document.createElement('li');
      li.textContent=p.name;
      list.appendChild(li);
    });
  });
}

// مغادرة
document.getElementById('leaveBtn').onclick=async()=>{
  if(playerId) await update(ref(db,'rooms/'+roomId+'/players/'+playerId),{left:true});
  alert('لقد غادرت المباراة');
  location.reload();
};

// حماية الانضمام بعد بدء اللعبة
onValue(ref(db,'rooms/'+roomId),snap=>{
  const data=snap.val();
  if(data?.phase==='playing' && !isHost && !playerId){
    alert("اللعبة قد بدأت بالفعل لا يمكنك الدخول");
    location.href=location.origin+location.pathname;
  }
});
</script>
</body>
</html>
