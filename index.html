<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Link | MX_SASUKE</title>
    <style>
        :root { --primary: #ff0000; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; display: none; border: 1px solid #333; }
        .thumb { width: 100%; border-radius: 15px; margin-bottom: 20px; display: none; }
        .progress-container { background: #333; height: 8px; border-radius: 10px; margin: 20px 0; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: 0.5s; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-gen { background: var(--primary); color: white; }
        .btn-task { background: var(--primary); color: white; }
        .btn-task.done { background: #333; color: #777; pointer-events: none; }
        .btn-unlock { background: #444; color: #888; cursor: not-allowed; margin-top: 20px; }
        .btn-unlock.enabled { background: #2ecc71; color: white; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #2ecc71; border-radius: 10px; display: none; color: #000; font-weight: bold; cursor: pointer; word-break: break-all; }
        .active { display: block !important; }
    </style>
</head>
<body>

<!-- لوحة التحكم بتاعتك -->
<div id="generator" class="box">
    <h3 style="color:var(--primary)">MX_SASUKE Panel</h3>
    <input type="text" id="videoUrlGen" placeholder="YouTube Video Link (To get Thumbnail)">
    <input type="text" id="fileName" placeholder="File Title">
    <input type="text" id="channelUrl" placeholder="Sub Link (Channel)">
    <input type="text" id="targetUrl" placeholder="Final Download Link">
    <button class="btn-gen" onclick="generateLink()">Create Small Link</button>
    <div id="finalLink" class="result" onclick="copyText()">Click to copy small link</div>
</div>

<!-- واجهة المشاهد -->
<div id="viewer" class="box">
    <img id="displayThumb" class="thumb" src="">
    <h3 id="displayFileName">Complete Actions</h3>
    <div id="stepText" style="color:var(--primary); font-size: 14px;">Steps: 0/2</div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <button class="btn-task" id="subBtn" onclick="doTask('sub')">🔴 Subscribe to channel</button>
    <button class="btn-task" id="likeBtn" onclick="doTask('like')">👍 Like a video</button>
    <button id="unlockBtn" class="btn-unlock" disabled>Unlock link</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const vID = urlParams.get('v'); // Video ID for thumb
    const n = urlParams.get('n'); const s = urlParams.get('s'); const t = urlParams.get('t');

    if (s && t) {
        document.getElementById('viewer').classList.add('active');
        if(vID) { 
            const thumb = document.getElementById('displayThumb');
            thumb.src = `https://img.youtube.com/vi/${vID}/mqdefault.jpg`;
            thumb.style.display = 'block';
        }
        if(n) document.getElementById('displayFileName').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('generator').classList.add('active');
    }

    function generateLink() {
        const vUrl = document.getElementById('videoUrlGen').value;
        const name = document.getElementById('fileName').value;
        const sub = document.getElementById('channelUrl').value;
        const target = document.getElementById('targetUrl').value;
        
        let videoID = "";
        try { videoID = vUrl.split('v=')[1].split('&')[0]; } catch(e) { 
            try { videoID = vUrl.split('be/')[1].split('?')[0]; } catch(e) { alert("Invalid YouTube Link!"); return; }
        }

        const base = window.location.href.split('?')[0];
        const final = `${base}?v=${videoID}&n=${btoa(encodeURIComponent(name))}&s=${btoa(sub)}&t=${btoa(target)}`;
        
        document.getElementById('finalLink').innerText = final;
        document.getElementById('finalLink').style.display = 'block';
        window.tempLink = final;
    }

    function copyText() {
        navigator.clipboard.writeText(window.tempLink);
        alert("Link Copied!");
    }

    let completed = 0;
    function doTask(type) {
        window.open(type === 'sub' ? atob(s) : `https://www.youtube.com/watch?v=${vID}`, '_blank');
        setTimeout(() => {
            document.getElementById(type === 'sub' ? 'subBtn' : 'likeBtn').classList.add('done');
            completed++;
            document.getElementById('progressBar').style.width = (completed/2)*100 + '%';
            document.getElementById('stepText').innerText = `Steps: ${completed}/2`;
            if(completed >= 2) {
                const ub = document.getElementById('unlockBtn');
                ub.disabled = false; ub.classList.add('enabled');
                ub.onclick = () => window.location.href = atob(t);
            }
        }, 4000);
    }
</script>
</body>
</html>
