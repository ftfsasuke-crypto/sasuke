<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<style>
body{
    margin:0;
    font-family:Tajawal, sans-serif;
    background:linear-gradient(135deg,#1e2a78,#3c4fa3);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:rgba(0,0,0,0.35);
    padding:25px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:400px;
}

h1,h2{margin-bottom:15px;}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    margin-top:10px;
    font-size:16px;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:20px;
    font-size:18px;
    color:white;
    cursor:pointer;
    margin-top:12px;
}

.main-btn{
    background:linear-gradient(to right,#8e2de2,#4a00e0);
}

.copy-btn{
    background:linear-gradient(to right,#00c6ff,#0072ff);
}

.join-btn{
    background:linear-gradient(to right,#ff7e5f,#feb47b);
}

.player{
    background:rgba(255,255,255,0.1);
    padding:10px;
    border-radius:12px;
    margin-top:6px;
}
.hidden{display:none;}
</style>
</head>

<body>

<!-- الرئيسية -->
<div class="box" id="home">
<h1>👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑</h1>
<button class="main-btn" onclick="startGame()">🎮 لعبة الجاسوس</button>
</div>

<!-- غرفة الهوست -->
<div class="box hidden" id="room">
<h2>🔥 تم إنشاء الغرفة</h2>

<button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>

<h3>اللاعبين:</h3>
<div id="players"></div>
</div>

<!-- الانضمام -->
<div class="box hidden" id="join">
<h2>✍️ اكتب اسمك</h2>
<input id="nameInput" placeholder="اسمك">
<button class="join-btn" onclick="joinGame()">🚪 انضمام</button>
</div>

<!-- الانتظار -->
<div class="box hidden" id="waiting">
<h2>⏳ في انتظار بدء اللعبة</h2>
<p id="yourName"></p>

<h3>اللاعبين:</h3>
<div id="players2"></div>
</div>
