<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🕵️ لعبة الجاسوس</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(-45deg, #1d2671, #c33764, #6a11cb, #2575fc);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

@keyframes bg {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  border-radius: 30px;
  padding: 25px;
  width: 340px;
  text-align:center;
}

.sasuke {
  color: gold;
  text-shadow:0 0 10px gold;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  background: linear-gradient(90deg,#667eea,#764ba2);
  color:white;
}

/* 🔥 أزرار فوق */
.top-btn {
  position:fixed;
  top:15px;
  padding:8px 14px;
  border-radius:20px;
  background:#222;
  cursor:pointer;
}

#settingsBtn { left:10px; }
#rematchBtn { left:80px; display:none; }

.overlay {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.popup {
  background:#111;
  padding:20px;
  border-radius:20px;
  max-height:80%;
  overflow:auto;
}

.player-item {
  display:flex;
  justify-content:space-between;
  margin:5px 0;
}

.kick {
  background:red;
  padding:5px 10px;
  border-radius:10px;
  cursor:pointer;
}

.category-btn {
  display:block;
  margin:5px;
  padding:10px;
  border-radius:15px;
  background:#3498db;
}
</style>
</head>

<body>

<div id="settingsBtn" class="top-btn" onclick="openSettings()">⚙️</div>
<div id="rematchBtn" class="top-btn" onclick="rematch()">🔄</div>

<div class="card">

<div id="home">
<h1>🕵️ لعبة الجاسوس</h1>
<div class="sasuke">⚔️ SASUKE ⚔️ 👑</div>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<div id="linkBox">
<span id="link"></span>
<button onclick="copyLink()">📋</button>
</div>
<ul id="players"></ul>
</div>

<div id="game" style="display:none;">
<h2 id="role"></h2>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", playersData={};

const categories = {
  "🍔 أكلات": ["بيتزا","برجر","كشري","مكرونة"],
  "🍎 فواكه": ["تفاح","موز","عنب","برتقال"],
  "🐶 حيوانات": ["أسد","نمر","كلب","قطة"],
  "💻 أجهزة": ["موبايل","كمبيوتر","لابتوب"],
  "🚗 مواصلات": ["عربية","طيارة","قطار"],
  "⚽ رياضة": ["كرة قدم","سباحة","تنس"],
  "🏠 منزل": ["سرير","كرسي","تلفزيون"],
  "🌍 دول": ["مصر","فرنسا","اليابان"]
};

function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();

db.ref("rooms/"+room).set({
players:{[playerId]:{name:"⚔️ SASUKE ⚔️"}},
phase:"waiting"
});

openRoom();
showCategories();
}

function showCategories(){
let html="";
for(let c in categories){
html+=`<button class="category-btn" onclick="startGame('${c}')">${c}</button>`;
}

let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`<div class="popup"><h2>🎯 اختر تصنيف</h2>${html}</div>`;
document.body.appendChild(div);
}

function startGame(cat){
document.querySelector(".overlay")?.remove();

db.ref("rooms/"+room+"/players").once("value").then(snap=>{
let players=Object.keys(snap.val());
let spy=players[Math.floor(Math.random()*players.length)];
let words=categories[cat];
let word=words[Math.floor(Math.random()*words.length)];

db.ref("rooms/"+room).update({
spy:spy,
word:word,
phase:"playing"
});
});

document.getElementById("rematchBtn").style.display="block";
}

function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

document.getElementById("link").innerText=location.href;

db.ref("rooms/"+room+"/players").on("value",snap=>{
playersData=snap.val()||{};
let html="";
for(let id in playersData){
html+=`<li>${playersData[id].name}</li>`;
}
document.getElementById("players").innerHTML=html;
});

db.ref("rooms/"+room).on("value",snap=>{
let d=snap.val();
if(d.phase==="playing") showRole(d);
});
}

function showRole(d){
document.getElementById("room").style.display="none";
document.getElementById("game").style.display="block";

if(playerId===d.spy){
document.getElementById("role").innerText="🕵️ أنت الجاسوس!";
}else{
document.getElementById("role").innerText="🔍 "+d.word;
}
}

function copyLink(){
navigator.clipboard.writeText(location.href);
document.getElementById("linkBox").style.display="none";
}

/* ⚙️ الإعدادات */
function openSettings(){
let html=`<h3>👥 عدد اللاعبين: ${Object.keys(playersData).length}</h3>`;

for(let id in playersData){
html+=`
<div class="player-item">
<span>${playersData[id].name}</span>
<div class="kick" onclick="kick('${id}')">طرد</div>
</div>`;
}

let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`<div class="popup">${html}<button onclick="this.closest('.overlay').remove()">❌</button></div>`;
document.body.appendChild(div);
}

function kick(id){
db.ref("rooms/"+room+"/players/"+id).remove();
document.querySelector(".overlay")?.remove();
}

/* 🔄 إعادة اللعب */
function rematch(){
showCategories();
}

</script>

</body>
</html>
