<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🕵️ لعبة الجاسوس</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(-45deg, #1d2671, #c33764, #6a11cb, #2575fc);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  border-radius: 30px;
  padding: 25px;
  width: 340px;
  text-align:center;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  background: linear-gradient(90deg,#667eea,#764ba2);
  color:white;
}

.overlay {
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
}

.popup {
  background:#111;
  padding:20px;
  border-radius:20px;
}

.category-btn {
  display:block;
  margin:5px;
  padding:10px;
  border-radius:15px;
  background:#3498db;
}
</style>
</head>

<body>

<div class="card">

<div id="home">
<h1>🕵️ لعبة الجاسوس</h1>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<div id="linkBox">
<p id="link"></p>
<button onclick="copyLink()">📋 نسخ الرابط</button>
</div>

<ul id="players"></ul>

<button id="startBtn" onclick="showCategories()" style="display:none">🚀 ابدأ اللعبة</button>
</div>

<div id="game" style="display:none;">
<h2 id="role"></h2>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", playersData={};

const categories = {
  "🍔 أكلات": ["بيتزا","برجر","كشري","مكرونة"],
  "🍎 فواكه": ["تفاح","موز","عنب","برتقال"],
  "🐶 حيوانات": ["أسد","نمر","كلب","قطة"],
  "💻 أجهزة": ["موبايل","كمبيوتر","لابتوب"]
};

// 🔥 دخول من الرابط
const params=new URLSearchParams(location.search);
const roomFromLink=params.get("room");

if(roomFromLink){
document.getElementById("home").style.display="none";
room=roomFromLink;
playerId="p"+Date.now();

let name=prompt("اكتب اسمك");
db.ref("rooms/"+room+"/players/"+playerId).set({name:name});

openRoom();
}

// 🔥 إنشاء غرفة
function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();

db.ref("rooms/"+room).set({
players:{[playerId]:{name:"⚔️ SASUKE ⚔️"}},
phase:"waiting"
});

openRoom();

// 🔗 حط الرابط
let fullLink=location.origin+location.pathname+"?room="+room;
document.getElementById("link").innerText=fullLink;
}

// عرض الغرفة
function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

db.ref("rooms/"+room+"/players").on("value",snap=>{
playersData=snap.val()||{};
let html="";

for(let id in playersData){
html+="<li>"+playersData[id].name+"</li>";
}

document.getElementById("players").innerHTML=html;

// ✅ يظهر زرار ابدأ لو في 2 لاعبين
if(Object.keys(playersData).length >= 2){
document.getElementById("startBtn").style.display="block";
}
});

db.ref("rooms/"+room).on("value",snap=>{
let d=snap.val();
if(d.phase==="playing") showRole(d);
});
}

// نسخ الرابط
function copyLink(){
navigator.clipboard.writeText(document.getElementById("link").innerText);
document.getElementById("linkBox").style.display="none";
}

// اختيار التصنيف
function showCategories(){
let html="";
for(let c in categories){
html+=`<button class="category-btn" onclick="startGame('${c}')">${c}</button>`;
}

let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`<div class="popup"><h2>🎯 اختر تصنيف</h2>${html}</div>`;
document.body.appendChild(div);
}

// بدء اللعبة
function startGame(cat){
document.querySelector(".overlay")?.remove();

let ids=Object.keys(playersData);
let spy=ids[Math.floor(Math.random()*ids.length)];
let word=categories[cat][Math.floor(Math.random()*categories[cat].length)];

db.ref("rooms/"+room).update({
spy:spy,
word:word,
phase:"playing"
});
}

// عرض الدور
function showRole(d){
document.getElementById("room").style.display="none";
document.getElementById("game").style.display="block";

if(playerId===d.spy){
document.getElementById("role").innerText="🕵️ أنت الجاسوس!";
}else{
document.getElementById("role").innerText="🔍 "+d.word;
}
}

</script>

</body>
</html>
