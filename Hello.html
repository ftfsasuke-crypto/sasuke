<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 50%, #0d0d2b 100%); color: #eee; text-align: center; padding: 20px; min-height: 100vh; direction: rtl; }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10vh); opacity: 1; } 100% { transform: translateY(110vh); opacity: 0; } }
        #app { max-width: 600px; margin: 0 auto; background: rgba(0,0,0,0.5); border-radius: 20px; padding: 20px; position: relative; z-index: 1; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        h1 .title-spy { background: linear-gradient(135deg, #e94560, #ff6b6b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 38px; }
        h2 { color: #e94560; } button { background: #e94560; color: white; border: none; padding: 12px 24px; margin: 8px; border-radius: 30px; font-size: 16px; cursor: pointer; }
        button:hover { background: #c23152; } .btn-gold { background: linear-gradient(135deg, #f39c12, #e67e22); } .btn-blue { background: linear-gradient(135deg, #3498db, #2980b9); }
        .word-option { display: inline-block; background: #2c3e50; color: #fff; padding: 12px 20px; margin: 6px; border-radius: 25px; font-size: 18px; cursor: pointer; border: 2px solid #f39c12; transition: 0.3s; }
        .word-option:hover { background: #f39c12; transform: scale(1.05); }
        input { padding: 12px; border-radius: 20px; border: none; margin: 8px; font-size: 16px; width: 70%; text-align: center; background: rgba(255,255,255,0.1); color: #fff; }
        #timer-display { font-size: 48px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; color: #2ecc71; direction: ltr; }
        li { background: rgba(255,255,255,0.05); margin: 5px 0; padding: 12px; border-radius: 15px; font-size: 18px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .overlay-box { background: #1a1a3e; border: 2px solid #e94560; padding: 30px; border-radius: 20px; text-align: center; max-width: 500px; max-height: 85vh; overflow-y: auto; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.2); border-top: 5px solid #e94560; border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e94560; color: white; padding: 12px 24px; border-radius: 30px; z-index: 1000; }
        .eliminated { opacity: 0.4; text-decoration: line-through; }
        .game-select-btn { display: block; width: 90%; margin: 12px auto; font-size: 20px; padding: 18px; }
        .host-name-display { background: linear-gradient(135deg, #f093fb, #f5576c, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; font-weight: bold; }
        .host-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; border: 1px solid #e94560; }
    </style>
</head>
<body>
    <div class="stars-container" id="starsContainer"></div>
    <div id="app">
        <div id="start-screen">
            <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
            <div id="create-section"><div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ S A S U K E ⚔️</span></p></div><button onclick="createRoom('normal')" class="game-select-btn">🎮 لعبة الجاسوس ١</button><button onclick="createRoom('multi')" class="game-select-btn btn-gold">🎯 لعبة الجاسوس ٢</button></div>
            <div id="join-section" style="display:none;"><p>ادخل غرفة صديقك:</p><input type="text" id="player-name" placeholder="اكتب اسمك"><br><button onclick="joinRoom()">🚪 انضمام للغرفة</button></div>
        </div>
        <div id="game-screen" style="display:none;">
            <h2>🕵️ لعبة الجاسوس <span id="game-mode-display"></span></h2>
            <div id="room-link-box" style="display:none; background:rgba(0,0,0,0.3); padding:10px; border-radius:10px; margin:10px 0;"><p>🔗 رابط الغرفة:</p><span id="room-link-text" style="direction:ltr; font-size:12px;"></span><br><button onclick="copyLink()" style="padding:6px 15px; font-size:14px;">📋 نسخ الرابط</button></div>
            <div id="word-display" style="display:none; padding:20px; border-radius:15px; margin:10px 0; font-size:28px; font-weight:bold;"></div>
            <div id="timer-display">10:00</div>
            <div id="host-controls" style="display:none;"><button id="btn-start" onclick="startGame()">🚀 ابدأ اللعبة</button><button id="btn-skip" onclick="skipTime()" style="display:none;">⏩ اسكب الوقت</button></div>
            <h3>👥 اللاعبون:</h3><ul id="player-list"></ul>
            <div id="kick-section"></div>
            <div id="spectator-section" style="display:none;"><h3>👁️ المشاهدون:</h3><ul id="spectator-list"></ul></div>
            <div id="vote-log-section" style="display:none;"><h3>📋 التصويتات:</h3><div id="vote-log"></div></div>
            <div id="vote-section" style="display:none;"><h3>🗳️ صوت على الجاسوس:</h3><div id="vote-buttons"></div></div>
            <div id="waiting-votes" style="display:none;">⏳ في انتظار باقي اللاعبين...</div>
            <button onclick="leaveRoom()" style="background:#555; margin-top:15px;">🚪 مغادرة</button>
        </div>
    </div>
    <script>for(let i=0;i<50;i++){let s=document.createElement('div');s.className='star';let z=Math.random()*3+1;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.animationDuration=(Math.random()*4+3)+'s';s.style.animationDelay=Math.random()*5+'s';document.getElementById('starsContainer').appendChild(s);}</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue, onDisconnect, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
        const fc={apiKey:"AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",authDomain:"spy-game-1d774.firebaseapp.com",projectId:"spy-game-1d774",storageBucket:"spy-game-1d774.firebasestorage.app",messagingSenderId:"261865713515",appId:"1:261865713515:web:8868e0998ccd0d00aba62e"};
        const app=initializeApp(fc),db=getDatabase(app);
        let myPlayerId,myPlayerName,roomId,isHost,gamePhase='waiting',gameMode='normal',spyPlayerId,secretWord,timerInterval,localTimer=600,allPlayersData={},gameFinished=false,isEliminated=false;
        const allWords=['تفاحة','سيارة','قمر','شمس','بحر','جبل','كتاب','قلم','نجمة','وردة','أسد','فيل','طائرة','سفينة','مفتاح','كاميرا','شجرة','نهر','ساعة','كرة','بيانو','تلفون','كنز','قناع','مظلة','خاتم','قوس','سهم','بوصلة'];
        const params=new URLSearchParams(location.search),ridFromUrl=params.get('room');
        if(ridFromUrl){roomId=ridFromUrl;checkRoom(ridFromUrl);document.getElementById('create-section').style.display='none';}else{document.getElementById('create-section').style.display='block';document.getElementById('join-section').style.display='none';}
        function checkRoom(rid){get(ref(db,'rooms/'+rid)).then(s=>{if(s.exists()&&s.val().active&&s.val().phase!=='finished'){document.getElementById('join-section').style.display='block'}else{showExpired()}})}
        function showExpired(){document.getElementById('join-section').style.display='none';showOverlay('⚠️ انتهت صلاحية الرابط!',4000);setTimeout(()=>{location.href=location.origin+location.pathname},4000);}
        function showHostLeft(){removeAll();document.getElementById('game-screen').style.display='none';document.getElementById('start-screen').style.display='block';document.getElementById('create-section').style.display='none';document.getElementById('join-section').style.display='none';showOverlay('<h2 style="color:#e94560;">👑 لقد غادر الهوست SASUKE</h2><p style="font-size:20px;">لذا تعطلت اللعبة</p>',4000);stopTimer();setTimeout(()=>{location.href=location.origin+location.pathname},4000);}
        function showOverlay(html,autoRemove){removeOverlay();let ov=document.createElement('div');ov.className='overlay';ov.id='overlay';let box=document.createElement('div');box.className='overlay-box';box.innerHTML=html;ov.appendChild(box);document.body.appendChild(ov);if(autoRemove)setTimeout(removeOverlay,autoRemove);}
        function removeOverlay(){let ov=document.getElementById('overlay');if(ov)ov.remove();}
        function removeAll(){removeOverlay();}
        function generateWordOptions(correctWord){let options=[correctWord];let shuffled=[...allWords].sort(()=>Math.random()-0.5);for(let w of shuffled){if(options.length>=10)break;if(!options.includes(w))options.push(w);}return options.sort(()=>Math.random()-0.5);}
        window.createRoom=function(mode){gameMode=mode;myPlayerName='⚔️ SASUKE ⚔️';roomId='r'+Date.now().toString(36);myPlayerId='h'+Date.now().toString(36);isHost=true;gameFinished=false;isEliminated=false;set(ref(db,'rooms/'+roomId),{hostId:myPlayerId,hostName:myPlayerName,gameMode,phase:'waiting',active:true,timer:600,spyPlayerId:null,secretWord:null,voteResults:{},voteLogs:{},eliminatedPlayers:{},overlayMessage:null,wordOptions:null}).then(()=>{addMe();showGame();document.getElementById('game-mode-display').textContent=gameMode==='multi'?'٢':'١';document.getElementById('host-controls').style.display='block';document.getElementById('btn-start').style.display='inline-block';document.getElementById('btn-skip').style.display='none';document.getElementById('room-link-box').style.display='block';document.getElementById('room-link-text').textContent=location.origin+location.pathname+'?room='+roomId;listenAll();setupHostDisconnect();notify('✅ تم');});};
        window.joinRoom=function(){let n=document.getElementById('player-name').value.trim();if(!n)return notify('⚠️ اكتب اسمك!');myPlayerName=n;myPlayerId='p'+Date.now().toString(36);isHost=false;get(ref(db,'rooms/'+roomId)).then(s=>{if(s.exists()&&s.val().active){addMe();showGame();document.getElementById('host-controls').style.display='none';document.getElementById('room-link-box').style.display='none';listenAll();notify('👋 '+n+'!');}else{showExpired()}});};
        function addMe(){let r=ref(db,'rooms/'+roomId+'/players/'+myPlayerId);set(r,{id:myPlayerId,name:myPlayerName,isHost,eliminated:false});onDisconnect(r).remove();}
        function setupHostDisconnect(){onDisconnect(ref(db,'rooms/'+roomId)).remove();}
        function listenAll(){listenPlayers();listenGame();listenVotes();listenLogs();listenOverlay();listenWordOptions();}
        function listenPlayers(){onValue(ref(db,'rooms/'+roomId+'/players'),s=>{let p=s.val()||{};allPlayersData=p;let h='',sh='',ids=Object.keys(p);ids.forEach(i=>{let e=p[i].eliminated;h+=`<li class="${e?'eliminated':''}">${p[i].name} ${p[i].isHost?'👑':''} ${e?'👁️':''}</li>`;if(e)sh+=`<li>${p[i].name}</li>`});document.getElementById('player-list').innerHTML=h;document.getElementById('spectator-list').innerHTML=sh;document.getElementById('spectator-section').style.display=sh?'block':'none';if(isHost&&gamePhase==='waiting'){let k='';ids.forEach(i=>{if(i!==myPlayerId)k+=`<button onclick="kickPlayer('${i}')" style="background:#ff6b6b;font-size:12px;">❌ ${p[i].name}</button>`});document.getElementById('kick-section').innerHTML=k;}});}
        window.kickPlayer=function(id){remove(ref(db,'rooms/'+roomId+'/players/'+id));};
        window.copyLink=function(){navigator.clipboard.writeText(document.getElementById('room-link-text').textContent);notify('📋 تم النسخ!');};
        function listenGame(){onValue(ref(db,'rooms/'+roomId),s=>{if(!s.exists()){if(!isHost)showHostLeft();return}let d=s.val();if(!d.active){showHostLeft();return}if(d.phase!==gamePhase){gamePhase=d.phase;handlePhase(d)}spyPlayerId=d.spyPlayerId;secretWord=d.secretWord;if(d.timerRunning)startTimer(d.timerEndAt);});}
        function listenOverlay(){onValue(ref(db,'rooms/'+roomId+'/overlayMessage'),s=>{let msg=s.val();if(!msg)return;if(msg.target==='all'){showOverlay(msg.html,msg.autoRemove||false);}else if(msg.target===myPlayerId){showOverlay(msg.html,false);}});}
        function listenWordOptions(){onValue(ref(db,'rooms/'+roomId+'/wordOptions'),s=>{let options=s.val();if(!options)return;if(myPlayerId===spyPlayerId){showOverlay('<h3>🤔 اختر الكلمة الصحيحة:</h3><div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;">'+options.map(w=>`<div class="word-option" onclick="spySelectWord('${w}')">${w}</div>`).join('')+'</div>',false);}});}
        function listenLogs(){onValue(ref(db,'rooms/'+roomId+'/voteLogs'),s=>{let l=s.val()||{},h='';Object.values(l).forEach(x=>{h+=`<div style="background:rgba(255,255,255,0.05);padding:8px;margin:4px;border-radius:10px;">🗳️ ${x.voterName} ➡️ ${x.targetName}</div>`});document.getElementById('vote-log').innerHTML=h||'لا تصويتات';});}
        function listenVotes(){onValue(ref(db,'rooms/'+roomId+'/voteResults'),s=>{if(gamePhase!=='voting'||isEliminated)return;let v=s.val()||{},c=Object.keys(v).length,active=Object.values(allPlayersData).filter(x=>!x.eliminated).length;if(c>0&&c<active){document.getElementById('waiting-votes').style.display='block';document.getElementById('waiting-votes').textContent='⏳ انتظار... ('+c+' من '+active+')'}if(c>=active&&active>0&&!gameFinished){gameFinished=true;document.getElementById('waiting-votes').style.display='none';finalize(v)}});}
        function handlePhase(d){document.getElementById('vote-section').style.display='none';document.getElementById('vote-log-section').style.display='none';removeAll();if(d.phase==='playing'){showWord(d);if(isHost){document.getElementById('btn-start').style.display='none';document.getElementById('btn-skip').style.display='inline-block';}}if(d.phase==='voting'){document.getElementById('word-display').style.display='none';document.getElementById('vote-log-section').style.display='block';showVoteUI();if(isHost){document.getElementById('btn-start').style.display='none';document.getElementById('btn-skip').style.display='none';}}}
        function showWord(d){let w=document.getElementById('word-display');w.style.display='block';if(myPlayerId===d.spyPlayerId){w.style.background='rgba(200,0,0,0.3)';w.innerHTML='🕵️ أنت الجاسوس!'}else{w.style.background='rgba(0,150,0,0.3)';w.innerHTML='🔑 '+d.secretWord}}
        window.startGame=function(){get(ref(db,'rooms/'+roomId+'/players')).then(s=>{let p=s.val(),ids=Object.keys(p);if(ids.length<2)return notify('⚠️ لاعبين على الأقل!');let spy=ids[Math.floor(Math.random()*ids.length)],sw=allWords[Math.floor(Math.random()*allWords.length)];ids.forEach(i=>update(ref(db,'rooms/'+roomId+'/players/'+i),{eliminated:false}));update(ref(db,'rooms/'+roomId),{phase:'playing',spyPlayerId:spy,secretWord:sw,timer:600,timerRunning:true,timerEndAt:Date.now()+600000,voteResults:{},voteLogs:{},eliminatedPlayers:{},overlayMessage:null,wordOptions:null});document.getElementById('btn-start').style.display='none';document.getElementById('btn-skip').style.display='inline-block';});};
        window.skipTime=function(){gameFinished=false;update(ref(db,'rooms/'+roomId),{timerRunning:false,phase:'voting'});document.getElementById('btn-skip').style.display='none';};
        function showVoteUI(){document.getElementById('vote-section').style.display='block';let h='';Object.entries(allPlayersData).forEach(([id,p])=>{if(id!==myPlayerId&&!p.eliminated)h+=`<button onclick="voteFor('${id}')">${p.name}</button>`});document.getElementById('vote-buttons').innerHTML=h;}
        window.voteFor=function(id){set(ref(db,'rooms/'+roomId+'/voteResults/'+myPlayerId),id);set(ref(db,'rooms/'+roomId+'/voteLogs/'+myPlayerId),{voterName:myPlayerName,targetName:allPlayersData[id]?.name});document.getElementById('vote-section').style.display='none';document.getElementById('waiting-votes').style.display='block';};
        function finalize(v){let vc={};Object.values(v).forEach(x=>{vc[x]=(vc[x]||0)+1});let mv=Object.entries(vc).sort((a,b)=>b[1]-a[1])[0][0];let ok=(mv===spyPlayerId);if(gameMode==='multi'){if(ok){update(ref(db,'rooms/'+roomId),{phase:'finished',spyWon:false});update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'✅ الجاسوس هو: '+allPlayersData[spyPlayerId]?.name,target:'all',autoRemove:5000});}else{let name=allPlayersData[mv]?.name||'???';update(ref(db,'rooms/'+roomId+'/players/'+mv),{eliminated:true});update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'<div class="spinner"></div>⏳ جاري الكشف...',target:'all'});setTimeout(()=>{update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'🛡️ طلع <strong>'+name+'</strong> مدني وليس جاسوس!<br><br><div class="spinner"></div>⏳ في انتظار قرار الجاسوس...',target:'all'});setTimeout(()=>{let active=Object.values(allPlayersData).filter(x=>!x.eliminated&&x.id!==mv);if(active.length<=2&&active.find(x=>x.id===spyPlayerId)){let spyName=allPlayersData[spyPlayerId]?.name||'???';update(ref(db,'rooms/'+roomId),{phase:'finished',spyWon:true});update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'🏆 الجاسوس كسب!<br><strong>'+spyName+'</strong>',target:'all',autoRemove:5000});return}update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'🕵️ أنت الجاسوس! ماذا تريد؟<br><br><button onclick="spyChooseGuess()" style="font-size:18px;padding:12px 25px;">🤔 أخمن الكلمة</button><br><button onclick="spyChooseContinue()" style="font-size:18px;background:#3498db;padding:12px 25px;">🎮 أستمر في اللعب</button>',target:spyPlayerId});gameFinished=false;update(ref(db,'rooms/'+roomId),{phase:'playing',voteResults:{},voteLogs:{}});if(myPlayerId===mv){isEliminated=true;document.getElementById('vote-section').style.display='none';}},5000);},5000);}}else{if(ok)update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'✅ صحيح! الجاسوس هو '+allPlayersData[spyPlayerId]?.name,target:'all',autoRemove:5000});if(myPlayerId===spyPlayerId)document.getElementById('spy-guess-section').style.display='block';update(ref(db,'rooms/'+roomId),{phase:'spyGuess'});}}
        window.spyChooseGuess=function(){removeOverlay();let options=generateWordOptions(secretWord);update(ref(db,'rooms/'+roomId+'/wordOptions'),options);update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'🤔 لقد قرر الجاسوس التخمين...<br><br><div class="spinner"></div>⏳ في انتظار تخمين الجاسوس',target:'all'});};
        window.spySelectWord=function(word){let spyName=myPlayerName;let correct=(word===secretWord);removeOverlay();update(ref(db,'rooms/'+roomId+'/wordOptions'),null);if(correct){update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'✅ الجاسوس اختار كلمة صحيحة!<br><br>🕵️ الجاسوس: <strong>'+spyName+'</strong><br>✍️ اختار: <strong>'+word+'</strong><br>🔑 الكلمة الصحيحة: <strong>'+secretWord+'</strong><br><br>🏆 الجاسوس كسب!',target:'all',autoRemove:5000});update(ref(db,'rooms/'+roomId),{phase:'finished',spyWon:true});}else{update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'❌ الجاسوس اختار كلمة خاطئة!<br><br>🕵️ الجاسوس: <strong>'+spyName+'</strong><br>✍️ اختار: <strong>'+word+'</strong><br>🔑 الكلمة الصحيحة: <strong>'+secretWord+'</strong><br><br>🎉 اللاعبين كسبوا!',target:'all',autoRemove:5000});update(ref(db,'rooms/'+roomId),{phase:'finished',spyWon:false});}};
        window.spyChooseContinue=function(){removeOverlay();update(ref(db,'rooms/'+roomId+'/overlayMessage'),{html:'🎮 لقد قرر الجاسوس الاستمرار!',target:'all',autoRemove:5000});update(ref(db,'rooms/'+roomId),{phase:'playing',voteResults:{},voteLogs:{}});};
        function startTimer(end){stopTimer();timerInterval=setInterval(()=>{let r=Math.max(0,Math.floor((end-Date.now())/1000));localTimer=r;let m=Math.floor(r/60),s=r%60;document.getElementById('timer-display').textContent=m.toString().padStart(2,'0')+':'+s.toString().padStart(2,'0');if(r<=0)stopTimer();},200);}
        function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}}
        function showGame(){document.getElementById('start-screen').style.display='none';document.getElementById('game-screen').style.display='block'}
        window.leaveRoom=function(){if(myPlayerId&&roomId){if(isHost)remove(ref(db,'rooms/'+roomId));else remove(ref(db,'rooms/'+roomId+'/players/'+myPlayerId))}stopTimer();location.href=location.origin+location.pathname}
        function notify(msg){let n=document.createElement('div');n.className='notification';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}
    </script>
</body>
</html>
