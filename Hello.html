<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub | Space Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --main: #ff0000; 
            --bg: #0a0a0f; 
            --card: rgba(21, 21, 23, 0.7); 
            --accent: #22c55e; 
            --fail: #ef4444; 
            --liar: #f59e0b; 
            --glow: rgba(255, 0, 0, 0.3);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, transparent 60%),
                              radial-gradient(ellipse at 80% 20%, #0a1a2e 0%, transparent 60%);
            color: white; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            touch-action: manipulation; 
            overflow: hidden; 
        }
        
        .box-container { 
            width: 92%; 
            max-width: 400px; 
            background: var(--card); 
            padding: 25px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative; 
            z-index: 10; 
        }
        
        h1 { 
            color: white; 
            margin-bottom: 25px; 
            font-size: 24px; 
            text-align: center; 
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        
        .game-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            padding: 18px; 
            border-radius: 15px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 15px; 
            display: block; 
            text-align: center; 
            text-decoration: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .game-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }
        .game-btn.liar-btn { border-color: var(--liar); box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.1); }
        .game-btn.liar-btn:hover { box-shadow: 0 0 20px rgba(245, 158, 11, 0.2); }

        .input-field { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(0, 0, 0, 0.3); 
            color: var(--accent); 
            font-size: 16px; 
            text-align: center; 
            margin-bottom: 20px; 
            font-weight: bold; 
            display: block;
            font-family: 'Cairo';
        }

        .action-btn { 
            background: var(--main); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 10px; 
            display: block;
            box-shadow: 0 4px 15px var(--glow);
        }
        
        .action-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.5; box-shadow: none; }

        .leave-btn { 
            background: transparent; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            color: #888; 
            padding: 12px; 
            border-radius: 12px; 
            width: 100%; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px; 
        }

        .panel { display: none; }
        .panel.active { display: block !important; }

        .players-list { 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 12px; 
            padding: 10px; 
            margin-bottom: 20px; 
            max-height: 150px; 
            overflow-y: auto; 
        }
        
        .player-item { 
            padding: 12px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-size: 14px; 
        }
        
        .player-item:last-child { border-bottom: none; }
        
        #anim-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(10, 10, 15, 0.95); 
            z-index: 1000; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
        }
        
        .loader-ring { 
            width: 70px; height: 70px; 
            border: 3px solid rgba(255, 255, 255, 0.1); 
            border-top: 3px solid var(--liar); 
            border-radius: 50%; 
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; 
            margin-bottom: 20px; 
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .fire-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0000; opacity: 0; z-index: 1001; pointer-events: none; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0% {transform:translate(0,0)} 20% {transform:translate(10px,0)} 40% {transform:translate(-10px,0)} 60% {transform:translate(10px,0)} 100% {transform:translate(0,0)} }

        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .liar-card-btn { 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: white; 
            padding: 15px 5px; 
            border-radius: 12px; 
            font-size: 13px; 
            cursor: pointer; 
        }
        .liar-card-btn:active { background: var(--liar); border-color: white; }
        
        .choice-container { display: flex; gap: 10px; margin-top: 20px; }
        .stat-badge { background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--liar); }
    </style>
</head>
<body id="main-body">

<div class="box-container">
    <div id="p-main" class="panel active">
        <h1>🎮 الألعاب</h1>
        <input type="text" id="host-input" class="input-field" placeholder="اكتب اسمك..." value="Sasuke">
        <button class="game-btn liar-btn" onclick="startHost('liar', 'لعبة الكذابين', 'liar')">🃏 لعبة الكذابين ☠️</button>
        <button class="game-btn" onclick="startHost('naruto', 'تخمين الأنمي', 'guess')">🍥 من أنا؟ (ناروتو)</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1>🛰️ غرفة الانتظار</h1>
        <div id="invite-link" style="display:none"></div>
        <button class="action-btn" onclick="copyLink()" style="background: rgba(255,255,255,0.1); font-size: 14px; box-shadow:none; border: 1px solid rgba(255,255,255,0.2)">📋 نسخ رابط الدعوة</button>
        <div class="players-list" id="h-list"></div>
        <button class="action-btn" id="start-btn" onclick="gameLaunch()" disabled>🚀 إطلاق اللعبة</button>
        <button class="leave-btn" onclick="location.reload()">إلغاء ❌</button>
    </div>

    <div id="p-join" class="panel">
        <h1>👋 أهلاً بك</h1>
        <input type="text" id="guest-input" class="input-field" placeholder="اكتب اسمك للمتابعة...">
        <button class="action-btn" onclick="joinRoomAction()">دخول الغرفة 🚪</button>
    </div>

    <div id="p-wait" class="panel">
        <h1>⏳ انتظار الهوست...</h1>
        <div class="players-list" id="g-list"></div>
    </div>

    <div id="p-liar" class="panel">
        <h2 id="turn-display" style="color: var(--liar); text-align: center; font-size: 18px;">اللاعب الحالي: ...</h2>
        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; border: 1px dashed var(--liar);">
            الورقة المطلوبة: <span id="liar-req" style="color: white; font-weight: bold; font-size: 20px;">...</span>
        </div>
        <div class="players-list" id="liar-list"></div>
        
        <div id="my-turn-controls" style="display: none;">
            <p style="text-align: center; font-size: 14px; opacity: 0.8;">اختر بطاقة للمراوغة:</p>
            <div class="card-grid" id="my-hand"></div>
        </div>

        <div id="decision-controls" style="display: none;">
            <p style="text-align: center; font-size: 14px;">اللاعب لعب بطاقة.. هل تثق به؟</p>
            <div class="choice-container">
                <button class="action-btn" style="background: var(--fail);" onclick="liarMove('call')">كاذب! 🤬</button>
                <button class="action-btn" style="background: var(--accent);" onclick="liarMove('continue')">أكمل! ✅</button>
            </div>
        </div>
    </div>
</div>

<div id="anim-overlay">
    <div id="loader-part">
        <div class="loader-ring"></div>
        <h2 id="anim-msg" style="font-size: 18px; font-weight: normal;">جاري التحقق...</h2>
        <h1 id="anim-timer" style="font-size: 48px; color: var(--liar); margin: 10px 0;">3</h1>
    </div>
    <div id="gun-part" style="display: none;">
        <div style="font-size: 80px; margin-bottom: 20px;">🔫</div>
        <h2 id="gun-msg" style="color: var(--fail); font-size: 24px;">تم كشف الهوية!</h2>
        <h1 id="gun-timer" style="font-size: 60px;">3</h1>
    </div>
</div>
<div class="fire-flash" id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
    let client, myName, roomId, isHost = false, players = [], mode = '', currentLiarState = {};

    function changeUI(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) { roomId = urlParams.get('room'); changeUI('p-join'); }

    function updateLists() {
        let html = "";
        players.forEach(p => html += `<div class="player-item"><span>${decodeURIComponent(p.name)}</span><span style="color:var(--accent); font-size:10px;">● متصل</span></div>`);
        ["h-list", "g-list"].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = html; });
        if(isHost) document.getElementById('start-btn').disabled = (players.length < 3);
    }

    function startHost(cat, name, m) {
        isHost = true; mode = m;
        myName = encodeURIComponent((document.getElementById('host-input').value || "Sasuke") + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('invite-link').innerText = window.location.origin + window.location.pathname + "?room=" + roomId;
        players = [{name: myName}]; updateLists(); changeUI('p-lobby');
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => client.subscribe('sasuke_' + roomId));
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(isHost && d.type === 'join' && players.length < 5) {
                if(!players.find(p => p.name === d.name)) {
                    players.push({name: d.name}); updateLists();
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: mode}));
                }
            }
            if(d.type === 'liar_act') handleLiarLogic(d);
        });
    }

    function joinRoomAction() {
        let n = document.getElementById('guest-input').value; if(!n) return alert("اكتب اسمك");
        myName = encodeURIComponent(n);
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('sasuke_' + roomId);
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
            changeUI('p-wait');
        });
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(d.type === 'sync') { players = d.players; updateLists(); }
            if(d.type === 'liar_start' || d.type === 'liar_sync') { updateLiarUI(d.state); }
            if(d.type === 'anim') { startAnim(d.msg, d.sec); }
            if(d.type === 'gun') { startGunAnim(d.target, d.hits); }
        });
    }

    function gameLaunch() {
        if(!isHost) return;
        let deck = [];
        let counts = players.length === 5 ? [7,7,7,3] : (players.length === 4 ? [6,6,6,3] : [4,4,4,2]);
        ['King','Ace','Queen'].forEach((v, i) => { for(let j=0; j<counts[i]; j++) deck.push(v); });
        for(let j=0; j<counts[3]; j++) deck.push('Joker');
        deck.sort(() => 0.5 - Math.random());

        let s = { turn: 0, req: ['King','Ace','Queen'][Math.floor(Math.random()*3)], last: null, phase: 'play', hands: {}, stats: {} };
        players.forEach(p => { s.hands[p.name] = []; s.stats[p.name] = {h:0, d:false}; });
        let i = 0; while(deck.length) { s.hands[players[i%players.length].name].push(deck.pop()); i++; }
        
        currentLiarState = s;
        client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_start', state: s}));
        updateLiarUI(s); 
    }

    function updateLiarUI(s) {
        currentLiarState = s; changeUI('p-liar');
        document.getElementById('turn-display').innerText = "اللاعب الحالي: " + decodeURIComponent(players[s.turn].name);
        document.getElementById('liar-req').innerText = s.req;
        let h = ""; players.forEach((p, i) => {
            let st = s.stats[p.name];
            h += `<div class="player-item ${st.d?'dead':''}"><span><span class="stat-badge">${st.h}/6</span> ${decodeURIComponent(p.name)}</span><span>${i===s.turn?'🎲':''}</span></div>`;
        });
        document.getElementById('liar-list').innerHTML = h;
        
        let isMyTurn = (players[s.turn].name === myName && !s.stats[myName].d);
        document.getElementById('my-turn-controls').style.display = (isMyTurn && s.phase === 'play') ? 'block' : 'none';
        document.getElementById('decision-controls').style.display = (isMyTurn && s.phase === 'decision') ? 'block' : 'none';
        
        let cards = ""; (s.hands[myName] || []).forEach(c => { 
            cards += `<button class="liar-card-btn" onclick="liarMove('play','${c}')">${c}</button>`; 
        });
        document.getElementById('my-hand').innerHTML = cards || "المخزون فارغ!";
    }

    function handleLiarLogic(d) {
        if(!isHost) return;
        let s = currentLiarState;
        if(d.act === 'play') {
            let h = s.hands[d.n]; h.splice(h.indexOf(d.c), 1);
            s.last = {n: d.n, c: d.c}; s.phase = 'wait';
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: "جاري تحليل البيانات...", sec: 3}));
            setTimeout(() => {
                s.phase = 'decision';
                s.turn = (s.turn + 1) % players.length;
                while(s.stats[players[s.turn].name].d) s.turn = (s.turn + 1) % players.length;
                client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
                updateLiarUI(s);
            }, 3000);
        } else if(d.act === 'continue') {
            s.phase = 'play';
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
            updateLiarUI(s);
        } else if(d.act === 'call') {
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: "جاري فحص المصداقية...", sec: 4}));
            setTimeout(() => {
                let wasLying = (s.last.c !== s.req && s.last.c !== 'Joker');
                let victim = wasLying ? s.last.n : d.n;
                let m = wasLying ? "تم كشف الكذبة! 😂" : "المعلومات صحيحة للأسف 😱";
                client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: m, sec: 4}));
                setTimeout(() => {
                    s.stats[victim].h++;
                    if (s.stats[victim].h >= 6 || Math.random() < 0.1) s.stats[victim].d = true;
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'gun', target: victim, hits: s.stats[victim].h}));
                    setTimeout(() => {
                        s.phase = 'play'; s.last = null;
                        s.req = ['King','Ace','Queen'][Math.floor(Math.random()*3)];
                        client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
                        updateLiarUI(s);
                    }, 8000);
                }, 4000);
            }, 4000);
        }
    }

    function startAnim(msg, sec) {
        const overlay = document.getElementById('anim-overlay');
        document.getElementById('anim-msg').innerText = msg;
        document.getElementById('loader-part').style.display = 'block';
        document.getElementById('gun-part').style.display = 'none';
        overlay.style.display = 'flex';
        let count = sec; document.getElementById('anim-timer').innerText = count;
        let int = setInterval(() => { count--; document.getElementById('anim-timer').innerText = count; if(count <= 0) { clearInterval(int); overlay.style.display = 'none'; } }, 1000);
    }

    function startGunAnim(target, hits) {
        if(myName !== target) return;
        const overlay = document.getElementById('anim-overlay');
        document.getElementById('loader-part').style.display = 'none';
        document.getElementById('gun-part').style.display = 'block';
        overlay.style.display = 'flex';
        let count = 3; document.getElementById('gun-timer').innerText = count;
        let int = setInterval(() => {
            count--; document.getElementById('gun-timer').innerText = count;
            if(count <= 0) {
                clearInterval(int);
                document.getElementById('main-body').classList.add('shake');
                document.getElementById('flash').style.opacity = '1';
                setTimeout(() => {
                    document.getElementById('flash').style.opacity = '0';
                    document.getElementById('main-body').classList.remove('shake');
                    document.getElementById('gun-part').innerHTML = `<h2 style='font-size:18px;'>نجوت من الاصطدام!<br>الدروع المتبقية: ${6-hits}</h2>`;
                    setTimeout(() => overlay.style.display = 'none', 3000);
                }, 150);
            }
        }, 1000);
    }

    function liarMove(a, c) { client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_act', act: a, c: c, n: myName})); }
    function copyLink() { navigator.clipboard.writeText(document.getElementById('invite-link').innerText); alert("تم النسخ!"); }
</script>
</body>
</html>
