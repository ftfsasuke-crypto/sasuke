<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);color:#eee;text-align:center;padding:20px;min-height:100vh;direction:rtl}
        #app{max-width:600px;margin:0 auto;background:rgba(0,0,0,.5);border-radius:20px;padding:20px;backdrop-filter:blur(10px)}
        h1 .title-spy{background:linear-gradient(135deg,#e94560,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:38px}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:8px;border-radius:30px;font-size:16px;cursor:pointer}
        button:hover{background:#c23152}
        .btn-gold{background:linear-gradient(135deg,#f39c12,#e67e22)}
        .btn-blue{background:linear-gradient(135deg,#3498db,#2980b9)}
        input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        #timer-display{font-size:48px;background:rgba(0,0,0,.5);padding:15px;border-radius:15px;color:#2ecc71;direction:ltr}
        li{background:rgba(255,255,255,.05);margin:5px 0;padding:12px;border-radius:15px;font-size:18px}
        .game-select-btn{display:block;width:90%;margin:12px auto;font-size:20px;padding:18px;border-radius:20px}
        .host-name-display{background:linear-gradient(135deg,#f093fb,#f5576c,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px;font-weight:bold}
        .host-box{background:rgba(255,255,255,.05);padding:15px;border-radius:15px;border:1px solid #e94560;margin-bottom:15px}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:30px;border-radius:20px;text-align:center;max-width:500px}
        .notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e94560;color:white;padding:12px 24px;border-radius:30px;z-index:1000}
        .eliminated{opacity:.4;text-decoration:line-through}
    </style>
</head>
<body>
<div id="app">
    <!-- شاشة الهوست (تظهر فقط بدون ?room= في الرابط) -->
    <div id="host-screen" style="display:none">
        <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ S A S U K E ⚔️</span></p></div>
        <button class="game-select-btn" id="btn-normal">🎮 لعبة الجاسوس ١ (عادية)</button>
        <button class="game-select-btn btn-gold" id="btn-multi">🎯 لعبة الجاسوس ٢ (اختباء)</button>
    </div>

    <!-- شاشة اللاعب (تظهر لما يدخل بالرابط) -->
    <div id="join-screen" style="display:none">
        <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
        <p style="color:#aaa;margin:20px 0">ادخل غرفة صديقك:</p>
        <input type="text" id="player-name" placeholder="اكتب اسمك"><br>
        <button onclick="joinRoom()">🚪 انضمام للغرفة</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen" style="display:none">
        <h2>🕵️ لعبة الجاسوس <span id="mode-display"></span></h2>
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;margin:10px 0">
            <p>🔗 رابط الغرفة:</p><span id="link-text" style="direction:ltr;font-size:12px"></span><br>
            <button onclick="copyLink()" style="padding:6px 15px;font-size:14px">📋 نسخ</button>
        </div>
        <div id="word-display" style="display:none;padding:20px;border-radius:15px;margin:10px 0;font-size:28px;font-weight:bold"></div>
        <div id="timer-display">10:00</div>
        <div id="host-btns" style="display:none"><button id="btn-start">🚀 ابدأ اللعبة</button><button id="btn-skip" style="display:none">⏩ اسكب الوقت</button></div>
        <h3>👥 اللاعبون:</h3><ul id="player-list"></ul>
        <div id="spec-section" style="display:none"><h3>👁️ المشاهدون:</h3><ul id="spec-list"></ul></div>
        <div id="vote-section" style="display:none"><h3>🗳️ صوت على الجاسوس:</h3><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار باقي اللاعبين...</div>
        <button onclick="leaveRoom()" style="background:#555;margin-top:15px">🚪 مغادرة</button>
    </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const fc={apiKey:"AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",authDomain:"spy-game-1d774.firebaseapp.com",projectId:"spy-game-1d774",storageBucket:"spy-game-1d774.firebasestorage.app",messagingSenderId:"261865713515",appId:"1:261865713515:web:8868e0998ccd0d00aba62e"};
const app=initializeApp(fc),db=getDatabase(app);

let mid,mname,rid,isHost,gmode='normal',spyId,sword,timer,localTimer=600,allPlayers={},finished=false,eliminated=false;
const words=['تفاحة','سيارة','قمر','شمس','بحر','جبل','كتاب','قلم','نجمة','وردة','أسد','فيل','طائرة','سفينة','مفتاح','كاميرا','شجرة','نهر','ساعة','كرة','بيانو','تلفون','كنز','قناع','ملك','حصان','سيف','ذهب','فضة','ماء','نار','هاتف','كمبيوتر','تنس','ملاكمة','غناء','عزف','وردة','ياسمين','ليمون','برتقال','عنب','مانجو','فراولة','رمان','عسل','سكر','شوكولاتة','قصر','حديقة','قطار','طائرة','صاروخ','قمر','نجم','بحر','جبل','صحراء','غابة','كهف','بركان','مطر','ثلج','ربيع','شتاء','نهار','ليل','ذهب','ألماس','حرير','حديد','زجاج','صوت','ضوء','كبير','صغير','سريع','بطيء','قوي','خفيف','جديد','قديم'];

const params=new URLSearchParams(location.search),ridFromUrl=params.get('room');

// ====== تحديد أي شاشة تظهر ======
if(ridFromUrl){
    // فيه room في الرابط → شاشة اللاعب
    rid=ridFromUrl;
    document.getElementById('join-screen').style.display='block';
    document.getElementById('host-screen').style.display='none';
    checkRoom();
}else{
    // مفيش room → شاشة الهوست
    document.getElementById('host-screen').style.display='block';
    document.getElementById('join-screen').style.display='none';
    document.getElementById('btn-normal').addEventListener('click',()=>createRoom('normal'));
    document.getElementById('btn-multi').addEventListener('click',()=>createRoom('multi'));
}

function checkRoom(){get(ref(db,'rooms/'+rid)).then(s=>{if(!s.exists()||!s.val().active){showExpired()}})}

function createRoom(mode){
    gmode=mode;mname='⚔️ SASUKE ⚔️';rid='r'+Date.now().toString(36);mid='h'+Date.now().toString(36);isHost=true;finished=false;eliminated=false;
    set(ref(db,'rooms/'+rid),{hostId:mid,gmode,phase:'waiting',active:true,timerEndAt:null,timerRunning:false,spyId:null,sword:null,voteResults:{},overlay:null}).then(()=>{
        addMe();showGame();document.getElementById('mode-display').textContent=gmode==='multi'?'٢':'١';
        document.getElementById('host-btns').style.display='block';document.getElementById('btn-start').style.display='inline-block';
        document.getElementById('btn-skip').style.display='none';document.getElementById('room-link').style.display='block';
        document.getElementById('link-text').textContent=location.origin+location.pathname+'?room='+rid;
        listenAll();setupHostDC();notify('✅ تم!');
    });
}

window.joinRoom=function(){
    let n=document.getElementById('player-name').value.trim();
    if(!n)return notify('⚠️ اكتب اسمك!');
    mname=n;mid='p'+Date.now().toString(36);isHost=false;
    get(ref(db,'rooms/'+rid)).then(s=>{if(s.exists()&&s.val().active){addMe();showGame();listenAll();notify('👋 '+n+'!')}else{showExpired()}});
};

function addMe(){let r=ref(db,'rooms/'+rid+'/players/'+mid);set(r,{id:mid,name:mname,isHost,eliminated:false});onDisconnect(r).remove();}
function setupHostDC(){onDisconnect(ref(db,'rooms/'+rid)).remove();}
function listenAll(){listenPlayers();listenGame();listenOverlay();}
function showGame(){
    document.getElementById('host-screen').style.display='none';
    document.getElementById('join-screen').style.display='none';
    document.getElementById('game-screen').style.display='block';
}

function listenPlayers(){onValue(ref(db,'rooms/'+rid+'/players'),s=>{let p=s.val()||{};allPlayers=p;let h='',sh='';Object.keys(p).forEach(i=>{let e=p[i].eliminated;h+=`<li class="${e?'eliminated':''}">${p[i].name}${p[i].isHost?' 👑':''}${e?' 👁️':''}</li>`;if(e)sh+=`<li>${p[i].name}</li>`});document.getElementById('player-list').innerHTML=h;document.getElementById('spec-list').innerHTML=sh;document.getElementById('spec-section').style.display=sh?'block':'none';if(isHost&&document.getElementById('btn-start').style.display!=='none'){let k='';Object.keys(p).forEach(i=>{if(i!==mid)k+=`<button onclick="kick('${i}')" style="background:#ff6b6b;font-size:12px">❌ ${p[i].name}</button>`});document.getElementById('vote-section').insertAdjacentHTML('afterend',k);}});}

window.kick=function(id){remove(ref(db,'rooms/'+rid+'/players/'+id));};
window.copyLink=function(){navigator.clipboard.writeText(document.getElementById('link-text').textContent);notify('📋 تم!');};

function listenGame(){onValue(ref(db,'rooms/'+rid),s=>{if(!s.exists()){if(!isHost)showHostLeft();return}let d=s.val();if(!d.active){showHostLeft();return}spyId=d.spyId;sword=d.sword;if(d.timerRunning&&d.timerEndAt)startTimer(d.timerEndAt);if(!d.timerRunning)stopTimer();if(d.phase!=d._lastPhase){d._lastPhase=d.phase;handlePhase(d)}});}

function listenOverlay(){onValue(ref(db,'rooms/'+rid+'/overlay'),s=>{let msg=s.val();if(!msg)return;if(msg.target==='all'||msg.target===mid)showOV(msg.html,msg.auto||false);});}

function handlePhase(d){
    document.getElementById('vote-section').style.display='none';
    document.getElementById('waiting-votes').style.display='none';
    if(d.phase==='playing'){showWord(d);if(isHost){document.getElementById('btn-start').style.display='none';document.getElementById('btn-skip').style.display='inline-block'}}
    if(d.phase==='voting'){showVoteUI();if(isHost){document.getElementById('btn-skip').style.display='none'}}
}

function showWord(d){let w=document.getElementById('word-display');w.style.display='block';w.style.background=mid===d.spyId?'rgba(200,0,0,.3)':'rgba(0,150,0,.3)';w.innerHTML=mid===d.spyId?'🕵️ أنت الجاسوس!':'🔑 '+d.sword;}

window.startGame=function(){
    get(ref(db,'rooms/'+rid+'/players')).then(s=>{let p=s.val(),ids=Object.keys(p);if(ids.length<2)return notify('⚠️ لاعبين!');
        let spy=ids[Math.floor(Math.random()*ids.length)],sw=words[Math.floor(Math.random()*words.length)];
        ids.forEach(i=>update(ref(db,'rooms/'+rid+'/players/'+i),{eliminated:false}));
        update(ref(db,'rooms/'+rid),{phase:'playing',spyId:spy,sword:sw,timerRunning:true,timerEndAt:Date.now()+600000,voteResults:{}});
        document.getElementById('btn-start').style.display='none';document.getElementById('btn-skip').style.display='inline-block';
    });
};

window.skipTime=function(){finished=false;update(ref(db,'rooms/'+rid),{timerRunning:false,phase:'voting'});};

function showVoteUI(){
    document.getElementById('vote-section').style.display='block';
    let h='';Object.entries(allPlayers).forEach(([id,p])=>{if(id!==mid&&!p.eliminated)h+=`<button onclick="vote('${id}')">${p.name}</button>`});
    document.getElementById('vote-btns').innerHTML=h;
}

window.vote=function(id){
    set(ref(db,'rooms/'+rid+'/voteResults/'+mid),id);
    document.getElementById('vote-section').style.display='none';
    document.getElementById('waiting-votes').style.display='block';
    get(ref(db,'rooms/'+rid+'/voteResults')).then(s=>{
        let v=s.val()||{},active=Object.values(allPlayers).filter(x=>!x.eliminated).length;
        if(Object.keys(v).length>=active){finalize(v)}
    });
};

function finalize(v){
    let vc={};Object.values(v).forEach(x=>{vc[x]=(vc[x]||0)+1});
    let mv=Object.entries(vc).sort((a,b)=>b[1]-a[1])[0][0],ok=(mv===spyId);
    if(gmode==='normal'){
        let sn=allPlayers[spyId]?.name||'???';
        update(ref(db,'rooms/'+rid+'/overlay'),{html:ok?`✅ الجاسوس: <strong>${sn}</strong><br>خمن الكلمة:`:`❌ مش هو!<br>🕵️ الجاسوس: <strong>${sn}</strong><br>خمن الكلمة:`,target:'all'});
        if(mid===spyId)showGuessInput();
        update(ref(db,'rooms/'+rid),{phase:'spyGuess'});
    }
}

function showGuessInput(){
    showOV('<h3>🤔 خمن الكلمة:</h3><input id="guess-input" placeholder="اكتب الكلمة"><br><button onclick="submitGuess()">📨 إرسال</button>',false);
}

window.submitGuess=function(){
    let g=document.getElementById('guess-input')?.value.trim();if(!g)return;
    let ok=(g===sword);removeOV();
    update(ref(db,'rooms/'+rid+'/overlay'),{html:ok?`✅ صح! 🏆 الجاسوس كسب!`:`❌ غلط! 🎉 اللاعبين كسبوا!<br>الكلمة: <strong>${sword}</strong>`,target:'all',auto:5000});
    update(ref(db,'rooms/'+rid),{phase:'finished',timerRunning:false});
};

function startTimer(end){stopTimer();timer=setInterval(()=>{let r=Math.max(0,Math.floor((end-Date.now())/1000));localTimer=r;let m=Math.floor(r/60),s=r%60;document.getElementById('timer-display').textContent=m.toString().padStart(2,'0')+':'+s.toString().padStart(2,'0');if(r<=0)stopTimer();},500);}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function showOV(html,auto){removeOV();let ov=document.createElement('div');ov.className='overlay';ov.id='overlay';let box=document.createElement('div');box.className='overlay-box';box.innerHTML=html;ov.appendChild(box);document.body.appendChild(ov);if(auto)setTimeout(removeOV,auto);}
function removeOV(){let ov=document.getElementById('overlay');if(ov)ov.remove();}
function showHostLeft(){showOV('<h2>👑 غادر الهوست</h2><p>تعطلت اللعبة</p>',4000);stopTimer();setTimeout(()=>{location.href=location.origin+location.pathname},4000);}
function showExpired(){showOV('⚠️ الرابط منتهي',4000);setTimeout(()=>{location.href=location.origin+location.pathname},4000);}
function notify(msg){let n=document.createElement('div');n.className='notification';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}
window.leaveRoom=function(){if(mid&&rid){if(isHost)remove(ref(db,'rooms/'+rid));else remove(ref(db,'rooms/'+rid+'/players/'+mid))}stopTimer();location.href=location.origin+location.pathname};
</script>
</body>
</html>
