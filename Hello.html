<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🕵️ لعبة الجاسوس</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}
.box {
  background: #222;
  padding: 20px;
  margin: 20px auto;
  width: 300px;
  border-radius: 10px;
}
button {
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
.green { background: green; color: white; }
.red { background: red; }
</style>

</head>
<body>

<h1>🕵️ لعبة الجاسوس</h1>

<div id="home" class="box">
  <input id="name" placeholder="اسمك"><br><br>
  <button onclick="createRoom()">👑 إنشاء غرفة</button>
  <button onclick="joinRoom()">🚪 انضمام</button>
</div>

<div id="room" class="box" style="display:none;">
  <h3 id="roomCode"></h3>
  <p id="link"></p>
  <ul id="players"></ul>
  <button class="green" onclick="startGame()">🚀 ابدأ</button>
</div>

<div id="game" class="box" style="display:none;">
  <h2 id="role"></h2>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  authDomain: "spy-game-1d774.firebaseapp.com",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com",
  projectId: "spy-game-1d774"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room = "";
let playerId = "";

// إنشاء غرفة
function createRoom() {
  const name = document.getElementById("name").value;
  room = "r" + Date.now();
  playerId = "p" + Date.now();

  db.ref("rooms/" + room).set({
    players: {
      [playerId]: { name: name }
    },
    phase: "waiting"
  });

  openRoom();
}

// دخول غرفة
function joinRoom() {
  const name = document.getElementById("name").value;
  room = prompt("اكتب كود الغرفة");
  playerId = "p" + Date.now();

  db.ref("rooms/" + room + "/players/" + playerId).set({
    name: name
  });

  openRoom();
}

// فتح الغرفة
function openRoom() {
  document.getElementById("home").style.display = "none";
  document.getElementById("room").style.display = "block";

  document.getElementById("roomCode").innerText = "كود الغرفة: " + room;
  document.getElementById("link").innerText =
    location.href + "?room=" + room;

  // تحديث اللاعبين
  db.ref("rooms/" + room + "/players").on("value", snap => {
    const data = snap.val();
    let html = "";

    for (let id in data) {
      html += "<li>" + data[id].name + "</li>";
    }

    document.getElementById("players").innerHTML = html;
  });

  // بدء اللعبة
  db.ref("rooms/" + room + "/phase").on("value", snap => {
    if (snap.val() === "playing") showRole();
  });
}

// بدء اللعبة
function startGame() {
  db.ref("rooms/" + room + "/players").once("value").then(snap => {
    const players = Object.keys(snap.val());
    const spy = players[Math.floor(Math.random() * players.length)];

    const words = ["تفاحة", "موز", "عنب", "برتقال"];
    const word = words[Math.floor(Math.random() * words.length)];

    db.ref("rooms/" + room).update({
      spy: spy,
      word: word,
      phase: "playing"
    });
  });
}

// عرض الدور
function showRole() {
  document.getElementById("room").style.display = "none";
  document.getElementById("game").style.display = "block";

  db.ref("rooms/" + room).once("value").then(snap => {
    const data = snap.val();

    if (playerId === data.spy) {
      document.getElementById("role").innerHTML = "🕵️ أنت الجاسوس!";
    } else {
      document.getElementById("role").innerHTML =
        "🔍 الكلمة: " + data.word;
    }
  });
}
</script>

</body>
</html>
