<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Link | MX_SASUKE</title>
    <style>
        :root { --red: #ff0000; --dark: #0f0f0f; }
        body { font-family: sans-serif; background: var(--dark); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1a1a1a; padding: 25px; border-radius: 15px; width: 100%; max-width: 380px; text-align: center; border: 1px solid #333; display: none; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-red { background: var(--red); color: white; }
        .btn-green { background: #2ecc71; color: white; }
        .active { display: block !important; }
        .res { margin-top: 15px; word-break: break-all; font-size: 10px; background: #000; padding: 10px; display: none; }
    </style>
</head>
<body>

<div id="gen" class="card">
    <h2 style="color:var(--red)">MX_SASUKE Panel</h2>
    <input type="text" id="v" placeholder="YouTube Video ID (Only the code)">
    <input type="text" id="s" placeholder="Channel Link">
    <input type="text" id="t" placeholder="Download Link">
    <button class="btn-red" onclick="make()">Generate Link</button>
    <div id="out" class="res" onclick="copy()"></div>
</div>

<div id="view" class="card">
    <img id="tm" style="width:100%; border-radius:10px; display:none;">
    <h3>Unlock Your Link</h3>
    <p id="st">Steps: 0/2</p>
    <button class="btn-red" id="b1" onclick="go('s')">🔴 Subscribe</button>
    <button class="btn-red" id="b2" onclick="go('l')">👍 Like Video</button>
    <button id="un" style="background:#444; color:#888" disabled>Unlock Now</button>
</div>

<script>
    const p = new URLSearchParams(location.search);
    const v = p.get('v'), s = p.get('s'), t = p.get('t');

    if (s && t) {
        document.getElementById('view').className += ' active';
        if(v) { const i = document.getElementById('tm'); i.src = `https://img.youtube.com/vi/${v}/0.jpg`; i.style.display = 'block'; }
    } else {
        document.getElementById('gen').className += ' active';
    }

    function make() {
        const v_id = document.getElementById('v').value, sub = document.getElementById('s').value, tg = document.getElementById('t').value;
        const link = `${location.href.split('?')[0]}?v=${v_id}&s=${btoa(sub)}&t=${btoa(tg)}`;
        document.getElementById('out').innerText = link;
        document.getElementById('out').style.display = 'block';
    }

    function copy() { navigator.clipboard.writeText(document.getElementById('out').innerText); alert("Copied!"); }

    let count = 0;
    function go(type) {
        window.open(type === 's' ? atob(s) : `https://youtube.com/watch?v=${v}`, '_blank');
        setTimeout(() => {
            count++; document.getElementById('st').innerText = `Steps: ${count}/2`;
            if(count >= 2) { 
                const u = document.getElementById('un'); u.disabled = false; u.className = 'btn-green';
                u.onclick = () => location.href = atob(t);
            }
        }, 3000);
    }
</script>
</body>
</html>
