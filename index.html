<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Your Link | MX_SASUKE</title>
    <style>
        :root { --primary: #ff0000; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); text-align: center; display: none; border: 1px solid #333; }
        .thumb { width: 100%; border-radius: 15px; margin-bottom: 20px; object-fit: cover; display: none; }
        h3 { margin: 10px 0; font-size: 22px; }
        p { color: #888; font-size: 14px; margin-bottom: 20px; }
        
        /* Step Counter & Progress */
        .progress-container { background: #333; height: 8px; border-radius: 10px; margin: 20px 0; position: relative; overflow: hidden; }
        .progress-bar { background: var(--primary); height: 100%; width: 0%; transition: 0.5s ease; }
        .counter { font-size: 14px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }

        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; }
        
        .btn-gen { background: var(--primary); color: white; }
        .btn-task { background: var(--primary); color: white; }
        .btn-task.done { background: #333; color: #777; pointer-events: none; }
        .btn-unlock { background: #444; color: #888; cursor: not-allowed; margin-top: 25px; }
        .btn-unlock.enabled { background: #2ecc71; color: white; cursor: pointer; transform: scale(1.05); }

        /* Loading Spinner */
        .loader { width: 18px; height: 18px; border: 2px solid #ffffff33; border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading .loader { display: block; }
        .loading .btn-text { display: none; }

        .result { margin-top: 20px; padding: 15px; background: #2ecc71; border-radius: 10px; display: none; word-break: break-all; color: #000; font-weight: bold; cursor: pointer; }
        .active { display: block !important; }
    </style>
</head>
<body>

<!-- GENERATOR INTERFACE (For You) -->
<div id="generator" class="box">
    <h3 style="color:var(--primary)">MX_SASUKE Panel</h3>
    <input type="text" id="thumbUrl" placeholder="Thumbnail URL (Image link)">
    <input type="text" id="fileName" placeholder="File Title (e.g., Delta Executor)">
    <input type="text" id="channelUrl" placeholder="YouTube Channel Link">
    <input type="text" id="videoUrl" placeholder="Video Link (for Like)">
    <input type="text" id="targetUrl" placeholder="Final Download Link">
    <button class="btn-gen" onclick="generateLink()">Create Pro Link</button>
    <div id="finalLink" class="result" onclick="copyText()"></div>
</div>

<!-- VIEWER INTERFACE (For Audience) -->
<div id="viewer" class="box">
    <img id="displayThumb" class="thumb" src="" alt="thumbnail">
    <h3 id="displayFileName">Complete Actions</h3>
    <p>Follow steps below to unlock your link</p>
    
    <div class="counter" id="stepText">Steps Completed: 0/2</div>
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>

    <button class="btn-task" id="subBtn" onclick="doTask('sub')">
        <div class="loader"></div>
        <span class="btn-text">🔴 Subscribe to channel</span>
    </button>

    <button class="btn-task" id="likeBtn" onclick="doTask('like')">
        <div class="loader"></div>
        <span class="btn-text">👍 Like a video</span>
    </button>

    <button id="unlockBtn" class="btn-unlock" disabled>Unlock link</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const img = urlParams.get('img'); const n = urlParams.get('n'); 
    const s = urlParams.get('s'); const l = urlParams.get('l'); const t = urlParams.get('t');

    if (s && t) {
        document.getElementById('viewer').classList.add('active');
        if(img) { const thumb = document.getElementById('displayThumb'); thumb.src = atob(img); thumb.style.display = 'block'; }
        if(n) document.getElementById('displayFileName').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('generator').classList.add('active');
    }

    function generateLink() {
        const thumb = document.getElementById('thumbUrl').value;
        const name = document.getElementById('fileName').value;
        const sub = document.getElementById('channelUrl').value;
        const like = document.getElementById('videoUrl').value;
        const target = document.getElementById('targetUrl').value;
        if(!sub || !target) return alert("Links missing!");
        
        const base = window.location.href.split('?')[0];
        const final = `${base}?img=${btoa(thumb)}&n=${btoa(encodeURIComponent(name))}&s=${btoa(sub)}&l=${btoa(like)}&t=${btoa(target)}`;
        
        const resDiv = document.getElementById('finalLink');
        resDiv.innerText = final; resDiv.style.display = 'block';
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('finalLink').innerText);
        alert("Link Copied!");
    }

    let completed = 0;
    let tasks = { sub: false, like: false };

    function doTask(type) {
        if(tasks[type]) return;
        const btn = document.getElementById(type === 'sub' ? 'subBtn' : 'likeBtn');
        const url = type === 'sub' ? atob(s) : atob(l);
        
        window.open(url, '_blank');
        btn.classList.add('loading');
        
        setTimeout(() => {
            btn.classList.remove('loading');
            btn.classList.add('done');
            btn.innerHTML = `✅ ${type === 'sub' ? 'Subscribed' : 'Liked'}`;
            tasks[type] = true;
            completed++;
            updateProgress();
        }, 5000); // 5 seconds verification simulation
    }

    function updateProgress() {
        const total = l ? 2 : 1;
        const percent = (completed / total) * 100;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('stepText').innerText = `Steps Completed: ${completed}/${total}`;
        
        if (completed === total) {
            const ub = document.getElementById('unlockBtn');
            ub.disabled = false;
            ub.classList.add('enabled');
            ub.onclick = () => window.location.href = atob(t);
        }
    }
</script>
</body>
</html>
