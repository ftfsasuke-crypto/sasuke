<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لعبة الجاسوس 1 و 2</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#eee;text-align:center;padding:15px;min-height:100vh;direction:rtl}
    button{background:#e94560;color:white;border:none;padding:12px 24px;margin:6px;border-radius:30px;cursor:pointer}
    .btn-gold{background:#f39c12}
    input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
    li{background:rgba(255,255,255,.05);margin:5px 0;padding:10px;border-radius:12px}
    .host-box{background:rgba(255,255,255,.05);padding:16px;border-radius:24px;border:1px solid #e94560;margin-bottom:20px}
    .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.96);z-index:1000;display:flex;align-items:center;justify-content:center}
    .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:25px;border-radius:28px;max-width:500px;width:90%}
    .vote-counter{background:rgba(0,0,0,.5);padding:10px;border-radius:30px;margin:10px 0}
    .guess-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0}
    .guess-btn{background:#2ecc71;padding:8px 16px;margin:5px}
    .close-btn{background:#555;margin-top:15px;padding:8px 20px}
    .settings-btn{position:fixed;top:15px;left:15px;background:#2c3e50;padding:10px 15px;border-radius:50px;font-size:16px;z-index:100;cursor:pointer}
    .settings-btn:hover{background:#1a252f}
    .rematch-btn{position:fixed;top:15px;left:80px;background:#27ae60;padding:10px 15px;border-radius:50px;font-size:16px;z-index:100;cursor:pointer}
    .rematch-btn:hover{background:#219a52}
    .player-list-settings{max-height:300px;overflow-y:auto;margin:15px 0}
    .player-item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;padding:8px;background:rgba(255,255,255,.1);border-radius:10px}
    .kick-btn{background:#e74c3c;padding:5px 12px;margin:0;font-size:12px}
    .kick-btn:hover{background:#c0392b}
    .category-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0;max-height:300px;overflow-y:auto}
    .category-btn{background:#3498db;padding:10px 15px;font-size:14px}
    .category-btn:hover{background:#2980b9}
  </style>
</head>
<body>

<div id="settingsButton" class="settings-btn" style="display:none" onclick="window.showSettingsPopup()">⚙️ الإعدادات</div>
<div id="rematchButton" class="rematch-btn" style="display:none" onclick="window.rematchGame()">🔄 Rematch</div>

<div id="app" style="max-width:550px;margin:auto;background:rgba(0,0,0,.5);border-radius:24px;padding:20px">
  <div id="host-screen">
    <h1>🕵️ لعبة الجاسوس</h1>
    <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: ⚔️ SASUKE ⚔️</p></div>
    <button class="btn-gold" onclick="window.createRoom('normal')">🎮 لعبة الجاسوس ١</button>
    <button class="btn-gold" onclick="window.createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
  </div>

  <div id="join-screen" style="display:none">
    <h1>🕵️ الانضمام</h1>
    <input type="text" id="player-name" placeholder="اسمك"><br>
    <button onclick="window.joinRoom()">🚪 انضمام</button>
  </div>

  <div id="game-screen" style="display:none">
    <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;margin:10px 0">
      <span id="link-text"></span> <button onclick="window.copyLink()">📋 نسخ الرابط</button>
    </div>

    <div id="word-display" style="display:none;padding:20px;border-radius:20px;margin:10px 0;font-size:28px"></div>

    <div id="host-btns" style="display:none">
      <button id="btn-start" onclick="window.showCategorySelection()">🚀 ابدأ</button>
      <button id="btn-show-vote" onclick="window.showVoting()" style="display:none">🗳️ تصويت</button>
    </div>

    <div id="vote-counter-container" class="vote-counter" style="display:none">🗳️ <span id="vote-count">0</span>/<span id="total-voters">0</span></div>

    <ul id="player-list"></ul>

    <div id="vote-log-section" style="display:none"><div id="vote-log"></div></div>
    <div id="vote-section" style="display:none"><div id="vote-btns"></div></div>
    <div id="waiting-votes" style="display:none">⏳ في انتظار باقي التصويتات...</div>

    <button onclick="window.leaveRoom()">🚪 مغادرة</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
    authDomain: "spy-game-1d774.firebaseapp.com",
    projectId: "spy-game-1d774",
    databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com/"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let mid, mn, rid, ih, gm, si, sw, ap = {}, ph = 'waiting', selectedCategory = 'فواكه';
  let voteInterval = null;

  // ==================== تصنيفات ====================
  const categories = {
    'فواكه': Array(300).fill().map((_,i) => ['تفاحة','موز','برتقال','فراولة','عنب','مانجو','أناناس','بطيخ','شمام','كرز','خوخ','كمثرى','رمان','كيوي','جوز هند','افوكادو','توت','توت بري','ليمون','جريب فروت','يوسفي','باباي','جاك فروت','ليتشي','تمر','زيتون','تين','عليق','عنب الثعلب','قشطة','برقوق','نكتارين','بوملي','دراق','لوز','فستق','كاجو','جوز','بندق','فول سوداني'][i%40]),
    'حيوانات': Array(300).fill().map((_,i) => ['أسد','نمر','فيل','زرافة','حمار وحشي','وحيد القرن','فرس النهر','تمساح','ثعبان','سلحفاة','قرد','غوريلا','شمبانزي','دب','ذئب','ثعلب','كلب','قطة','حصان','بقرة','خروف','ماعز','دجاجة','بطة','أوزة','حمامة','نسر','بومة','ببغاء','نعامة','كنغر','كوالا','باندا','جمل','غزال','سنجاب','أرنب','فأر','قنفذ','حوت','دلفين','قرش','أخطبوط','نجم البحر','قنديل بحر','سلطعون','روبيان','حبار','اخطبوط','نحلة'][i%50]),
    'أماكن': Array(300).fill().map((_,i) => ['مسجد','كنيسة','مستشفى','مدرسة','جامعة','روضة','مكتبة','متحف','حديقة','مطار','محطة قطار','مركز شرطة','مخبز','صالون حلاقة','عيادة','صيدلية','نادي','مطعم','مقهى','فندق','شاطئ','سينما','مسرح','استاد','سوق','مول تجاري','بقالة','سوبر ماركت','نادي صحي','حمام سباحة','صالة رياضية','ملعب','مدينة ملاهي','حديقة حيوان','أكواريوم','دار أوبرا','قاعة حفلات','مركز مؤتمرات','استراحة','منتجع'][i%40]),
    'مهن': Array(300).fill().map((_,i) => ['طبيب','مهندس','معلم','محامي','قاضي','شرطي','جندي','اطفائي','طيار','بحار','سائق','ميكانيكي','نجار','حداد','سباك','كهربائي','بناء','رسام','موسيقي','مغني','راقص','ممثل','مخرج','كاتب','شاعر','صحفي','مصور','طباخ','خباز','حلواني','صائغ','خياط','حلاق','عطار','بيطري','ممرض','صيدلي','عالم','باحث','محاسب','مدير','تاجر','مزارع','راعي','صياد','غواص'][i%45]),
    'منزل': Array(300).fill().map((_,i) => ['سرير','كرسي','طاولة','خزانة','رف','كنبة','ستارة','سجادة','وسادة','بطانية','مرآة','مصباح','ثلاجة','فرن','ميكروويف','غسالة','مكنسة','ممسحة','خلاط','غلاية','طنجرة','مقلاة','صحن','كأس','ملعقة','شوكة','سكين','مفتاح','هاتف','شاحن','كمبيوتر','تلفاز','ريموت','كتاب','قلم','دفتر','مقص','صمغ','مشط','فرشاة أسنان','شامبو','صابون','منشفة','ساعة حائط','سلة مهملات'][i%45]),
    'طبيعة': Array(300).fill().map((_,i) => ['شمس','قمر','نجوم','سماء','سحاب','مطر','ثلج','برق','رعد','رياح','بحر','نهر','شلال','بحيرة','وادي','جبل','صحراء','رمال','عشب','شجر','زهرة','وردة','ياسمين','نخلة','صنوبر','غابة','كهف','جزيرة','بركان','زلزال','فيضان','عاصفة','اعصار','ضباب','ندى','جليد','برد','صقيع','رذاذ','حجر','صخر','تراب','طين','نبع','واحة'][i%45]),
    'رياضة': Array(300).fill().map((_,i) => ['كرة قدم','كرة سلة','كرة طائرة','كرة يد','تنس','سباحة','ملاكمة','جودو','كاراتيه','يوغا','جمباز','جري','دراجات','فروسية','رماية','شطرنج','داما','بوكر','أونو','الغاز','سودوكو','اسكواش','جولف','بيسبول','هوكي','غطس','تايكوندو','كونغ فو','رفع أثقال','قفز','رمي','تجديف','تزلج','تسلق','غوص','بلياردو','سنوكر','ريشة طائرة','بينغ بونغ','كريكيت'][i%40]),
    'تكنولوجيا': Array(300).fill().map((_,i) => ['هاتف','كمبيوتر','لابتوب','تابلت','ساعة ذكية','سماعات','كاميرا','ميكروفون','شاشة','فأرة','طابعة','راوتر','فلاشة','بطارية','روبوت','انترنت','واي فاي','بلوتوث','تلسكوب','ميكروسكوب','معالج','رام','مذربورد','بطاقة شاشة','مروحة','تبريد','سيرفر','مودم','مسجل','مكبر صوت','لوحة مفاتيح','ماسح ضوئي','قرص صلب','شاحن','كابل','جهاز تحكم','عصا تحكم','طائرة درون','نظارة واقع افتراضي','سلك'][i%40]),
    'ألوان': Array(300).fill().map((_,i) => ['أحمر','أزرق','أخضر','أصفر','برتقالي','بنفسجي','وردي','بني','أسود','أبيض','رمادي','ذهبي','فضي','نحاسي','فيروزي','نيلي','ماروني','زيتوني','كريمي','مرجاني','خوخي','نعناعي','فوشيا','كحلي','عاجي','لازوردي','زبرجدي','ياقوتي','زمردي','مرجاني'][i%30]),
    'شخصيات كرتونية': Array(300).fill().map((_,i) => ['ميكي ماوس','بندق','سبونج بوب','كابتن ماجد','شريك','توم','جيري','علاء الدين','سيمبا','ناروتو','ساسوكي','غوكو','لوفي','زورو','كونان','بي كاش','باباي','سندريلا','بياض الثلج','تارزان','هيركولز','ويني','بورو','ساكورا','مدغشقر','باتريك','سنجوب','بوجي','مستر بين','فيونا'][i%30]),
    'مشروبات': Array(300).fill().map((_,i) => ['عصير','شاي','قهوة','نسكافيه','كابتشينو','لاتيه','موكا','سموذي','كوكتيل','لبن','حليب','ماء','بيبسي','كولا','سفن أب','فانتا','ميراندا','سبرايت','ريد بول','استاز','عصير برتقال','عصير تفاح','عصير مانجو','عصير فراولة','عصير عنب','عصير رمان','عصير ليمون','شاي اخضر','شاي أحمر','قمر الدين'][i%30]),
    'حلويات': Array(300).fill().map((_,i) => ['شوكولاتة','بقلاوة','كنافة','قطايف','بسبوسة','كعك','بسكويت','كيك','مادلين','كرواسون','بان كيك','بوظة','آيس كريم','جلي','مهلبية','أرز بلبن','سحلب','حلقوم','راحة','تمرية','حلاوة','مربى','نوتيلا','عسل','حليب مكثف','كريمة','كاسترد','بودنغ','موس','تشيز كيك'][i%30]),
    'دول': Array(300).fill().map((_,i) => ['مصر','السعودية','الإمارات','قطر','الكويت','عمان','البحرين','الأردن','لبنان','سوريا','فلسطين','العراق','ليبيا','تونس','الجزائر','المغرب','السودان','اليمن','تركيا','إيران','باكستان','الهند','الصين','اليابان','كوريا','أمريكا','كندا','بريطانيا','فرنسا','ألمانيا','إيطاليا','إسبانيا','روسيا','أستراليا','البرازيل','الأرجنتين'][i%36])
  };

  // ==================== Routing ====================
  const params = new URLSearchParams(location.search);
  const roomIdUrl = params.get('room');
  if (roomIdUrl) {
    rid = roomIdUrl;
    document.getElementById('host-screen').style.display = 'none';
    document.getElementById('join-screen').style.display = 'block';
    checkRoom();
  } else {
    document.getElementById('host-screen').style.display = 'block';
  }

  // ==================== UI ====================
  function showMessage(msg, preserveNewLines = false) {
    let old = document.getElementById('msgPopup');
    if (old) old.remove();

    const popup = document.createElement('div');
    popup.className = 'overlay';
    popup.id = 'msgPopup';

    const safe = String(msg ?? '');
    const html = preserveNewLines ? safe.replace(/\n/g, "<br>") : safe;

    popup.innerHTML = `
      <div class="overlay-box">
        <div style="font-size:18px;line-height:1.8">${html}</div>
        <button class="close-btn" onclick="document.getElementById('msgPopup')?.remove()">✖️ إغلاق</button>
      </div>
    `;
    document.body.appendChild(popup);
  }

  window.copyLink = async function () {
    const text = document.getElementById('link-text').innerText;
    try {
      await navigator.clipboard.writeText(text);
      showMessage("📋 تم نسخ الرابط");
    } catch (e) {
      showMessage("❌ لم يتم النسخ (انسخه يدويًا)");
    }
  };

  window.leaveRoom = async function () {
    try {
      if (rid && mid) await remove(ref(db, 'rooms/'+rid+'/players/'+mid));
    } catch(e) {}
    location.href = location.origin + location.pathname;
  };

  // ==================== Categories popup ====================
  window.showCategorySelection = function() {
    let popup = document.createElement('div');
    popup.className = 'overlay';
    popup.id = 'categoryPopup';

    let btns = '';
    for (let cat in categories) {
      btns += `<button class="category-btn" onclick="window.selectCategoryAndStart('${cat}')">${cat}</button>`;
    }

    popup.innerHTML = `
      <div class="overlay-box">
        <h3>🎯 اختر تصنيف الكلمات</h3>
        <div class="category-buttons">${btns}</div>
        <button class="close-btn" onclick="document.getElementById('categoryPopup')?.remove()">✖️ إغلاق</button>
      </div>
    `;
    document.body.appendChild(popup);
  };

  window.selectCategoryAndStart = async function(category) {
    selectedCategory = category;
    document.getElementById('categoryPopup')?.remove();
    await startGameWithCategory();
  };

  // ==================== Room lifecycle ====================
  async function checkRoom() {
    let snap = await get(ref(db, 'rooms/' + rid));
    if (!snap.exists() || !snap.val().active) expireRoom();
  }

  function expireRoom() {
    document.getElementById('join-screen').style.display = 'none';
    showMessage("⚠️ الغرفة منتهية");
    setTimeout(() => location.href = location.origin + location.pathname, 2000);
  }

  window.createRoom = async function(gameMode) {
    gm = gameMode;
    mn = 'SASUKE';
    rid = 'r' + Date.now();
    mid = 'h' + Date.now();
    ih = true;

    await set(ref(db, 'rooms/'+rid), { gm, phase:'waiting', active:true, si:null, sw:null, vr:{}, vl:{}, msg:null });
    await set(ref(db, 'rooms/'+rid+'/players/'+mid), { id:mid, name:mn, ih:true, eliminated:false });

    document.getElementById('host-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('room-link').style.display = 'block';
    document.getElementById('link-text').innerText = location.origin + location.pathname + '?room=' + rid;
    document.getElementById('host-btns').style.display = 'block';
    document.getElementById('settingsButton').style.display = 'block';
    document.getElementById('rematchButton').style.display = 'block';

    listenPlayers();
    listenRoom();
    showMessage("✅ الغرفة جاهزة");
  };

  window.joinRoom = async function() {
    let name = document.getElementById('player-name').value.trim();
    if (!name) return showMessage("ادخل اسمك");

    let roomSnap = await get(ref(db, 'rooms/'+rid));
    if (!roomSnap.exists() || !roomSnap.val().active) return expireRoom();

    if (roomSnap.val().phase !== 'waiting') {
      return showMessage("⚠️ اللعبة بدأت بالفعل، لا يمكنك الدخول الآن");
    }

    mn = name;
    mid = 'p' + Date.now();
    ih = false;

    await set(ref(db, 'rooms/'+rid+'/players/'+mid), { id:mid, name:mn, ih:false, eliminated:false });

    document.getElementById('join-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'block';

    listenPlayers();
    listenRoom();
    showMessage(`👋 مرحبا ${mn}`);
  };

  // ==================== Game start ====================
  async function startGameWithCategory() {
    let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
    let ids = Object.keys(players);

    if ((gm === 'normal' && ids.length < 2) || (gm === 'multi' && ids.length < 3)) {
      showMessage(`⚠️ يحتاج ${gm === 'normal' ? 2 : 3} لاعبين`);
      return;
    }

    let spy = ids[Math.floor(Math.random() * ids.length)];
    let categoryWords = categories[selectedCategory];
    let word = categoryWords[Math.floor(Math.random() * categoryWords.length)];

    await update(ref(db, 'rooms/'+rid), { phase:'playing', si: spy, sw: word, vr:{}, vl:{}, msg:null });

    for (let id of ids) await update(ref(db, 'rooms/'+rid+'/players/'+id), { eliminated:false });

    showMessage(`🎮 بدأت اللعبة! (التصنيف: ${selectedCategory})`);
    document.getElementById('btn-start').style.display = 'none';
    document.getElementById('btn-show-vote').style.display = 'inline-block';
  }

  // ==================== Settings (host) ====================
  window.showSettingsPopup = function() {
    if (!ih) return;

    let playersList = '';
    for (let id in ap) {
      if (id !== mid && !ap[id].eliminated) {
        playersList += `
          <div class="player-item">
            <span>${ap[id].name}</span>
            <button class="kick-btn" onclick="window.kickPlayer('${id}')">🚫 طرد</button>
          </div>`;
      }
    }
    if (playersList === '') playersList = '<div>لا يوجد لاعبين آخرين</div>';

    let popup = document.createElement('div');
    popup.className = 'overlay';
    popup.id = 'settingsPopup';
    popup.innerHTML = `
      <div class="overlay-box">
        <h3>⚙️ إدارة اللاعبين</h3>
        <div class="player-list-settings">${playersList}</div>
        <button class="close-btn" onclick="document.getElementById('settingsPopup')?.remove()">✖️ إغلاق</button>
      </div>`;
    document.body.appendChild(popup);
  };

  window.kickPlayer = async function(playerId) {
    if (!ih) return;
    await remove(ref(db, 'rooms/' + rid + '/players/' + playerId));
    showMessage(`✅ تم طرد اللاعب`);
    document.getElementById('settingsPopup')?.remove();
  };

  window.rematchGame = async function() {
    if (!ih) return;

    let players = await get(ref(db, 'rooms/' + rid + '/players'));
    let playerList = players.val() || {};
    let ids = Object.keys(playerList);

    for (let id of ids) {
      await update(ref(db, 'rooms/' + rid + '/players/' + id), { eliminated:false });
    }

    window.showCategorySelection();
  };

  // ==================== Listeners ====================
  function listenPlayers() {
    onValue(ref(db, 'rooms/'+rid+'/players'), (snap) => {
      ap = snap.val() || {};
      let list = '';
      for (let id in ap) {
        list += `<li>${ap[id].name} ${ap[id].ih ? '👑' : ''} ${ap[id].eliminated ? '👀' : ''}</li>`;
      }
      document.getElementById('player-list').innerHTML = list;

      if (gm === 'multi' && ph === 'playing') {
        let active = Object.values(ap).filter(p => !p.eliminated).length;
        if (active <= 2) endGameLowPlayers(ap[si]?.name, sw);
      }
    });
  }

  function listenRoom() {
    onValue(ref(db, 'rooms/'+rid), (snap) => {
      if (!snap.exists()) {
        showMessage("🔁 تم حذف الغرفة");
        setTimeout(() => location.reload(), 2000);
        return;
      }

      let data = snap.val();

      if (data.phase !== ph) {
        ph = data.phase;
        si = data.si;
        sw = data.sw;

        if (ph === 'playing') showWord();
        else if (ph === 'voting') startVoting();
        else if (ph === 'spyGuess' && mid === si) {
          if (gm === 'normal') showGuessInput();
          else showSpyOptions();
        }
      }
    });

    onValue(ref(db, 'rooms/'+rid+'/msg'), (s) => {
      let m = s.val();
      if (m && m.html) showMessage(m.html, true);
    });

    onValue(ref(db, 'rooms/'+rid+'/vl'), (s) => {
      let log = '';
      for (let v of Object.values(s.val() || {})) log += `<div>🗳️ ${v.v} → ${v.t}</div>`;
      document.getElementById('vote-log').innerHTML = log || 'لا تصويتات';
    });
  }

  // ==================== Gameplay UI ====================
  function showWord() {
    let div = document.getElementById('word-display');
    div.style.display = 'block';

    if (ap[mid]?.eliminated) {
      div.innerHTML = '👀 وضع المشاهدة';
      div.style.background = '#444';
      return;
    }

    if (mid === si) {
      div.innerHTML = '🕵️ أنت الجاسوس!';
      div.style.background = '#8b0000';
    } else {
      div.innerHTML = '🔍 الكلمة: ' + sw;
      div.style.background = '#1e5631';
    }

    if (ih) {
      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-show-vote').style.display = 'inline-block';
    }
  }

  // ==================== Voting ====================
  window.showVoting = async function () {
    if (!ih) return;             // الهوست فقط
    if (ph !== 'playing') return; // يبدأ فقط أثناء اللعب

    await update(ref(db, 'rooms/'+rid), { phase: 'voting', vr: {}, vl: {} });
    await set(ref(db, 'rooms/'+rid+'/msg'), { html: "🗳️ الهوست بدأ التصويت", target: "all" });
  };

  function startVoting() {
    document.getElementById('vote-section').style.display = 'block';

    let btns = '';
    let playerArray = Object.entries(ap).filter(([id, p]) => id !== mid && !p.eliminated);
    for (let [id, p] of playerArray) {
      btns += `<button onclick="window.vote('${id}')">${p.name}</button>`;
    }
    document.getElementById('vote-btns').innerHTML = btns;
    document.getElementById('vote-log-section').style.display = 'block';

    if (voteInterval) clearInterval(voteInterval);
    voteInterval = setInterval(async () => {
      if (ph !== 'voting') {
        document.getElementById('vote-counter-container').style.display = 'none';
        return;
      }

      let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
      let active = Object.values(players).filter(p => !p.eliminated).length;
      let votes = (await get(ref(db, 'rooms/'+rid+'/vr'))).val() || {};

      document.getElementById('vote-count').innerText = Object.keys(votes).length;
      document.getElementById('total-voters').innerText = active;
      document.getElementById('vote-counter-container').style.display = 'block';
    }, 700);
  }

  window.vote = async function(votedId) {
    if (ap[mid]?.eliminated) return showMessage("⚠️ انت في وضع المشاهدة");

    await set(ref(db, 'rooms/'+rid+'/vr/'+mid), votedId);
    await set(ref(db, 'rooms/'+rid+'/vl/'+mid), { v: mn, t: ap[votedId]?.name });

    document.getElementById('vote-section').style.display = 'none';
    document.getElementById('waiting-votes').style.display = 'block';

    let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
    let active = Object.values(players).filter(p => !p.eliminated).length;
    let votes = (await get(ref(db, 'rooms/'+rid+'/vr'))).val() || {};

    if (Object.keys(votes).length >= active) {
      document.getElementById('waiting-votes').style.display = 'none';

      let count = {};
      for (let v of Object.values(votes)) count[v] = (count[v] || 0) + 1;

      let sorted = Object.entries(count).sort((a,b) => b[1] - a[1]);
      let votedOut = sorted[0][0];

      let isSpy = (votedOut === si);
      let votedName = ap[votedOut]?.name || '???';
      let spyName = ap[si]?.name || '???';

      if (isSpy) {
        await update(ref(db, 'rooms/'+rid), { phase: 'spyGuess' });
        await set(ref(db, 'rooms/'+rid+'/msg'), { html: `✅ تم اكتشاف الجاسوس: ${votedName}\n⏳ في انتظار تخمين الجاسوس...`, target: 'all' });
      } else {
        await update(ref(db, 'rooms/'+rid+'/players/'+votedOut), { eliminated: true });

        if (gm === 'normal') {
          await set(ref(db, 'rooms/'+rid+'/msg'), { html: `❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n🕵️ الجاسوس الحقيقي هو: ${spyName}\n⏳ في انتظار تخمين الجاسوس...`, target: 'all' });
          await update(ref(db, 'rooms/'+rid), { phase: 'spyGuess' });
        } else {
          await set(ref(db, 'rooms/'+rid+'/msg'), { html: `❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n⏳ في انتظار قرار الجاسوس...`, target: 'all' });
          if (mid === si) showSpyOptions();
          else await update(ref(db, 'rooms/'+rid), { phase: 'playing' });
        }
      }
    }
  };

  // ==================== Guess ====================
  function showGuessInput() {
    let old = document.getElementById('guessDiv');
    if (old) old.remove();

    let d = document.createElement('div');
    d.id = 'guessDiv';
    d.className = 'overlay';
    d.innerHTML = `
      <div class="overlay-box">
        <h3>🤔 خمن الكلمة</h3>
        <input id="guessText" type="text" placeholder="اكتب الكلمة"><br>
        <button onclick="window.submitTextGuess()">📨 إرسال</button><br>
        <button class="close-btn" onclick="this.closest('.overlay').remove()">✖️</button>
      </div>`;
    document.body.appendChild(d);
    document.getElementById('guessText')?.focus();
  }

  window.submitTextGuess = async function() {
    let guess = document.getElementById('guessText')?.value.trim();
    if (!guess) return;

    document.getElementById('guessDiv')?.remove();

    await update(ref(db, 'rooms/'+rid), { phase: 'finished' });
    await set(ref(db, 'rooms/'+rid+'/msg'), {
      html: (guess === sw)
        ? `🎉 الجاسوس فاز! ✅ خمن الكلمة صح: ${sw}`
        : `✅ المدنيين فازوا! ❌ الجاسوس خمن غلط.\nالكلمة كانت: ${sw}\nتخمينه: ${guess}`,
      target: 'all'
    });
  };

  // ==================== Spy options (multi) ====================
  function showSpyOptions() {
    let old = document.getElementById('spyOpt');
    if (old) old.remove();

    let d = document.createElement('div');
    d.id = 'spyOpt';
    d.className = 'overlay';
    d.innerHTML = `
      <div class="overlay-box">
        <h3>🕵️ دورك يا جاسوس</h3>
        <p style="margin:10px 0">اختار: تكمل لعب ولا تخمن الكلمة؟</p>
        <div class="guess-buttons">
          <button class="guess-btn" onclick="window.spyContinue()">▶️ أكمل لعب</button>
          <button class="guess-btn" onclick="window.spyGuessNow()">🤔 أخمن الكلمة</button>
        </div>
        <button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button>
      </div>`;
    document.body.appendChild(d);
  }

  window.spyContinue = async function () {
    document.getElementById('spyOpt')?.remove();
    await update(ref(db, 'rooms/'+rid), { phase: 'playing', vr: {}, vl: {} });
    await set(ref(db, 'rooms/'+rid+'/msg'), { html: "▶️ الجاسوس قرر يكمل اللعب", target: "all" });
  };

  window.spyGuessNow = function () {
    document.getElementById('spyOpt')?.remove();
    showGuessInput();
  };

  // ==================== End game if players too low (multi) ====================
  async function endGameLowPlayers(spyName, word) {
    await update(ref(db, 'rooms/'+rid), { phase: 'finished' });
    await set(ref(db, 'rooms/'+rid+'/msg'), {
      html: `🏁 انتهت اللعبة (عدد اللاعبين قل)\n🕵️ الجاسوس: ${spyName}\n🔍 الكلمة: ${word}`,
      target: 'all'
    });
  }
</script>
</body>
</html>
