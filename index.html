<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Link | MX_SASUKE</title>
    <style>
        :root { --red: #ff0000; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; display: none; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .thumb { width: 100%; border-radius: 15px; margin-bottom: 20px; display: none; object-fit: cover; border: 1px solid #444; }
        
        /* شريط التحميل */
        .progress-container { background: #333; height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: var(--red); height: 100%; width: 0%; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .counter { font-size: 14px; font-weight: bold; color: var(--red); margin-bottom: 5px; }

        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; text-align: right; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--red); }
        
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 15px; }
        .btn-red { background: var(--red); color: white; }
        .btn-task { background: var(--red); color: white; }
        .btn-task.done { background: #333; color: #777; pointer-events: none; }
        
        .btn-unlock { background: #444; color: #888; cursor: not-allowed; margin-top: 20px; }
        .btn-unlock.enabled { background: #2ecc71; color: white; cursor: pointer; transform: scale(1.05); box-shadow: 0 0 15px rgba(46, 204, 113, 0.4); }

        #resArea { margin-top: 15px; background: #000; font-size: 11px; padding: 12px; border-radius: 10px; word-break: break-all; display: none; border: 1px dashed #555; cursor: pointer; color: #2ecc71; }
        .active { display: block !important; }
    </style>
</head>
<body>

<!-- لوحة التحكم (بالعربية) -->
<div id="gen" class="box" dir="rtl">
    <h3 style="color:var(--red)">لوحة تحكم MX_SASUKE</h3>
    <p style="font-size: 13px; color: #aaa;">أدخل رابط الصورة المباشر والروابط الأخرى</p>
    
    <input type="text" id="imgUrl" placeholder="رابط الصورة المباشر (Direct Image Link)">
    <input type="text" id="fName" placeholder="عنوان المحتوى (Title)">
    <input type="text" id="sUrl" placeholder="رابط قناة اليوتيوب">
    <input type="text" id="vUrl" placeholder="رابط فيديو اليوتيوب (لعمل لايك)">
    <input type="text" id="tUrl" placeholder="رابط التحميل النهائي">
    
    <button class="btn-red" onclick="make()">إنشاء الرابط النهائي</button>
    <div id="resArea" onclick="copy()">اضغط هنا لنسخ الرابط</div>
</div>

<!-- واجهة المشاهد (بالإنجليزية) -->
<div id="view" class="box" dir="ltr">
    <img id="tm" class="thumb" src="">
    <h3 id="nm" style="margin-bottom: 5px;">Unlock Content</h3>
    
    <div class="counter" id="st">Steps: 0/2</div>
    <div class="progress-container"><div class="progress-bar" id="pBar"></div></div>
    
    <button class="btn-task" id="b1" onclick="go('s')">🔴 Subscribe to channel</button>
    <button class="btn-task" id="b2" onclick="go('l')">👍 Like a video</button>
    
    <button id="un" class="btn-unlock" disabled>Unlock Link</button>
</div>

<script>
    const p = new URLSearchParams(location.search);
    const i = p.get('i'), n = p.get('n'), s = p.get('s'), l = p.get('l'), t = p.get('t');

    // تشغيل واجهة المشاهد لو الروابط موجودة
    if (s && t) {
        document.getElementById('view').classList.add('active');
        if(i) { 
            const pic = document.getElementById('tm');
            pic.src = atob(i);
            pic.style.display = 'block';
        }
        if(n) document.getElementById('nm').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('gen').classList.add('active');
    }

    function make() {
        const base = location.href.split('?')[0];
        const final = `${base}?i=${btoa(document.getElementById('imgUrl').value)}&n=${btoa(encodeURIComponent(document.getElementById('fName').value))}&s=${btoa(document.getElementById('sUrl').value)}&l=${btoa(document.getElementById('vUrl').value)}&t=${btoa(document.getElementById('tUrl').value)}`;
        
        const res = document.getElementById('resArea');
        res.innerText = final; res.style.display = 'block';
        window.finalLink = final;
    }

    function copy() {
        navigator.clipboard.writeText(window.finalLink);
        alert("تم نسخ الرابط بنجاح! الآن يمكنك اختصاره بسهولة.");
    }

    let done = 0;
    let tasks = { s: false, l: false };

    function go(type) {
        if(tasks[type]) return;
        window.open(atob(type === 's' ? s : l), '_blank');
        
        setTimeout(() => {
            done++;
            tasks[type] = true;
            document.getElementById(type === 's' ? 'b1' : 'b2').classList.add('done');
            document.getElementById(type === 's' ? 'b1' : 'b2').innerText = "Step Completed ✅";
            
            // تحديث شريط التقدم
            document.getElementById('pBar').style.width = (done/2)*100 + '%';
            document.getElementById('st').innerText = `Steps: ${done}/2`;
            
            if(done >= 2) { 
                const u = document.getElementById('un'); 
                u.disabled = false; 
                u.classList.add('enabled'); 
                u.innerText = "Get Your Link ✅";
                u.onclick = () => location.href = atob(t);
            }
        }, 4000);
    }
</script>
</body>
</html>
