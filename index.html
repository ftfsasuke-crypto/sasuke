<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>صانع روابط القفل</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .box { background: #1e293b; padding: 20px; border-radius: 10px; width: 100%; max-width: 500px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #result { margin-top: 20px; word-break: break-all; background: #334155; padding: 10px; display: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>إعداد صفحة القفل 🛠️</h2>
        <label>رابط القناة (للاشتراك):</label>
        <input type="text" id="ytChannel" placeholder="https://youtube.com/c/...">
        
        <label>رابط الفيديو (للايك):</label>
        <input type="text" id="ytVideo" placeholder="https://youtube.com/watch?v=...">
        
        <label>رابط الملف النهائي (التحميل):</label>
        <input type="text" id="finalUrl" placeholder="https://example.com/file">
        
        <button onclick="generateLink()">إنشاء الرابط النهائي</button>
        
        <div id="result">
            <p>انسخ هذا الرابط وضعه في وصف الفيديو:</p>
            <strong id="linkOutput"></strong>
        </div>
    </div>

    <script>
        function generateLink() {
            const data = {
                c: btoa(document.getElementById('ytChannel').value),
                v: btoa(document.getElementById('ytVideo').value),
                f: btoa(document.getElementById('finalUrl').value)
            };
            // استبدل الرابط التالي برابط موقعك على جيت هوب
            const baseUrl = window.location.href.replace('index.html', 'view.html');
            const finalLink = `${baseUrl}?data=${data.c}|${data.v}|${data.f}`;
            document.getElementById('result').style.display = 'block';
            document.getElementById('linkOutput').innerText = finalLink;
        }
    </script>
</body>
</html>
