<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE | Multiplayer Hub</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; --imposter: #a855f7; --warn: #f59e0b; --liar: #3b82f6; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; touch-action: manipulation; }
        .box-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #333; position: relative; z-index: 10; }
        h1 { color: white; margin-bottom: 20px; font-size: 22px; text-align: center; }
        .game-btn { background: #111; border: 2px solid #333; color: white; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.2s; display: block; position: relative; z-index: 20; }
        .game-btn:active { transform: scale(0.98); background: #222; }
        .input-field { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #000; color: var(--accent); font-size: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; display: block; }
        .action-btn { background: var(--main); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: block; }
        .action-btn:disabled { background: #555; cursor: not-allowed; }
        .leave-btn { background: #333; border: 1px solid #555; color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; display: block; }
        .panel { display: none; visibility: hidden; }
        .active-panel { display: block !important; visibility: visible !important; }
        .players-list { background: #000; border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .player-item { padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .player-dead { text-decoration: line-through; color: #555; }
        .secret-word-box { background: #111; border: 2px dashed var(--accent); border-radius: 15px; padding: 30px 15px; margin: 20px 0; font-size: 30px; font-weight: bold; text-align: center; }
        .card-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .card-item { background: #222; border: 2px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; min-width: 60px; text-align: center; }
        .card-item.selected { border-color: var(--accent); background: #1a3a1a; }
        .health-bar { font-size: 12px; color: var(--warn); }
        #timer-display { font-size: 35px; color: var(--warn); text-align: center; margin: 15px 0; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="box-container" id="app-content">
    
    <div id="p-main" class="panel active-panel">
        <h1>🎮 اختار اللعبة يا هوست</h1>
        <input type="text" id="host-input" class="input-field" placeholder="اسمك كصاحب الغرفة..." value="Sasuke">
        <button class="game-btn" onclick="navTo('p-imposter-cats')">🕵️‍♂️ لعبة الجاسوس</button>
        <button class="game-btn" onclick="hostRoom('liar', 'لعبة الكذابين', 'liar')" style="border-color: var(--liar);">🃏 لعبة الكذابين (جديد!)</button>
    </div>

    <div id="p-imposter-cats" class="panel">
        <h1>🕵️‍♂️ تصنيفات الجاسوس</h1>
        <button class="game-btn" onclick="hostRoom('food', 'جاسوس الأكلات', 'imposter')">🍕 أكلات</button>
        <button class="game-btn" onclick="hostRoom('animals', 'جاسوس الحيوانات', 'imposter')">🦁 حيوانات</button>
        <button class="game-btn" onclick="hostRoom('naruto', 'ناروتو', 'imposter')">🍥 ناروتو</button>
        <button class="leave-btn" onclick="navTo('p-main')">رجوع 🔙</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1>غرفة الانتظار ⏳</h1>
        <div id="invite-link" style="font-size: 10px; color: #888; margin-bottom: 10px; word-break: break-all;"></div>
        <button class="action-btn" onclick="copyUrl()" style="background: #333;">📋 نسخ الرابط</button>
        <h3 style="text-align: right; font-size: 14px; color: var(--accent);">المتصلين: <span id="h-count">1</span></h3>
        <div class="players-list" id="h-list"></div>
        <button class="action-btn" id="start-btn" onclick="launchGame()" disabled>🚀 ابدأ اللعبة</button>
        <button class="leave-btn" onclick="leaveRoom()">🚪 إغلاق</button>
    </div>

    <div id="p-join" class="panel">
        <h1>👋 أهلاً بيك</h1>
        <input type="text" id="guest-input" class="input-field" placeholder="اكتب اسمك...">
        <button class="action-btn" id="join-btn" onclick="joinRoom()">دخول الغرفة 🚪</button>
    </div>

    <div id="p-wait" class="panel">
        <h1>⏳ مستنيين الهوست...</h1>
        <h3 style="text-align: right; font-size: 14px; color: var(--accent);">المتصلين: <span id="g-count">1</span></h3>
        <div class="players-list" id="g-list"></div>
        <button class="leave-btn" onclick="leaveRoom()">🚪 مغادرة</button>
    </div>

    <div id="p-game" class="panel">
        <h2 id="role-title" style="text-align: center;">شخصيتك أو كلمتك:</h2>
        <div class="secret-word-box" id="my-word">???</div>
        <div id="timer-display" style="display: none;">01:00</div>
        <div class="players-list" id="game-list"></div>
        <div id="inline-vote-area" style="display: none;">
            <h3 style="color: var(--warn); text-align: center;">🗳️ وقت التصويت!</h3>
            <div id="inline-vote-list"></div>
        </div>
        <button class="leave-btn" onclick="leaveRoom()">🚪 مغادرة</button>
    </div>

    <div id="p-liar-game" class="panel">
        <h2 style="text-align: center; color: var(--liar);">🃏 لعبة الكذابين</h2>
        <div id="liar-info" style="text-align: center; margin-bottom: 10px; font-weight: bold; color: var(--warn);"></div>
        
        <div id="my-cards-area">
            <p>كروتك:</p>
            <div class="card-container" id="my-cards"></div>
        </div>

        <div id="liar-actions" style="display:none;">
            <button class="action-btn" id="play-card-btn" onclick="liarPlay()">العب الورقة المختارة</button>
            <button class="action-btn" id="call-liar-btn" onclick="liarCallLiar()" style="background: var(--fail); display:none;">كـذاب! 👺</button>
        </div>

        <h3 style="font-size: 14px;">حالة اللاعبين:</h3>
        <div class="players-list" id="liar-players-list"></div>
        <button class="leave-btn" onclick="leaveRoom()">🚪 مغادرة</button>
    </div>

    <div id="p-result" class="panel">
        <h1 id="result-title" style="text-align: center; font-size: 28px;"></h1>
        <div id="result-desc" style="text-align: center; font-size: 18px; margin-bottom: 30px;"></div>
        <button class="action-btn" onclick="leaveRoom()">العودة للرئيسية 🏠</button>
    </div>

    <div id="p-msg" class="panel">
        <h1 id="msg-title" style="color: var(--fail); text-align: center;">🚫 تنبيه</h1>
        <h3 id="msg-text" style="text-align: center;">...</h3>
        <button class="leave-btn" onclick="navTo('p-main')">العودة للرئيسية 🏠</button>
    </div>
</div>

<script>
    let mqttClient, myName, roomId, isHost = false, players = [], gameMode = '', gameCategory = '';
    let liarState = { turn: 0, requiredCard: '', lastPlayedCard: '', lastPlayer: '', health: {}, dead: [] };
    let myCards = [];
    let selectedCardIdx = -1;

    function navTo(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
        document.getElementById(id).classList.add('active-panel');
    }

    if (window.location.search.includes('room=')) navTo('p-join');

    function renderPlayers() {
        let html = '';
        players.forEach(p => {
            let name = decodeURIComponent(p.name);
            html += `<div class="player-item"><span>${name}</span></div>`;
        });
        document.getElementById('h-list').innerHTML = html;
        document.getElementById('g-list').innerHTML = html;
        document.getElementById('h-count').innerText = players.length;
        document.getElementById('g-count').innerText = players.length;
        if(isHost) {
            let min = (gameMode === 'liar') ? 3 : 2;
            document.getElementById('start-btn').disabled = players.length < min;
        }
    }

    function hostRoom(cat, name, mode) {
        isHost = true; gameMode = mode; gameCategory = cat;
        myName = encodeURIComponent(document.getElementById('host-input').value + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('invite-link').innerText = window.location.origin + window.location.pathname + "?room=" + roomId;
        players = [{name: myName}];
        connectMQTT();
        navTo('p-lobby');
        renderPlayers();
    }

    function joinRoom() {
        let n = document.getElementById('guest-input').value;
        if(!n) return alert("اكتب اسمك!");
        myName = encodeURIComponent(n);
        roomId = new URLSearchParams(window.location.search).get('room');
        connectMQTT();
        navTo('p-wait');
    }

    function connectMQTT() {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        mqttClient.on('connect', () => {
            mqttClient.subscribe('mx_sasuke_' + roomId);
            if(!isHost) mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
        });
        mqttClient.on('message', handleMessage);
    }

    function handleMessage(topic, message) {
        let d = JSON.parse(message.toString());
        if(d.type === 'join' && isHost) {
            if(players.length >= 5) return; // الحد الأقصى 5
            if(!players.find(p => p.name === d.name)) {
                players.push({name: d.name}); renderPlayers();
                mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: gameMode}));
            }
        }
        if(d.type === 'sync') { players = d.players; gameMode = d.mode; renderPlayers(); }
        
        if(d.type === 'start_liar') {
            liarState = d.state;
            myCards = d.distribution[myName];
            navTo('p-liar-game');
            updateLiarUI();
        }

        if(d.type === 'liar_update') {
            liarState = d.state;
            updateLiarUI();
        }

        if(d.type === 'liar_alert') {
            alert(d.msg);
        }

        if(d.type === 'game_over') {
            showFinalResult("انتهت اللعبة", d.msg, var(--liar));
        }
    }

    // --- منطق لعبة الكذابين ---

    function launchGame() {
        if(gameMode === 'liar') {
            let pCount = players.length;
            let deck = [];
            let config = { K: 0, A: 0, Q: 0, J: 0 };
            
            if(pCount === 5) config = { K: 7, A: 7, Q: 7, J: 3 };
            else if(pCount === 4) config = { K: 6, A: 6, Q: 6, J: 3 };
            else if(pCount === 3) config = { K: 4, A: 4, Q: 4, J: 2 };

            for(let key in config) for(let i=0; i<config[key]; i++) deck.push(key);
            deck.sort(() => Math.random() - 0.5);

            let distribution = {};
            let health = {};
            players.forEach((p, idx) => {
                distribution[p.name] = deck.splice(0, Math.floor(deck.length / (players.length - idx)));
                health[p.name] = 0;
            });

            let state = {
                turn: 0,
                requiredCard: ['Ace', 'King', 'Queen'][Math.floor(Math.random()*3)],
                lastPlayedCard: '',
                lastPlayer: '',
                health: health,
                dead: []
            };

            mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'start_liar', distribution, state}));
        }
    }

    function updateLiarUI() {
        const currentPlayer = players[liarState.turn];
        const isMyTurn = (currentPlayer.name === myName);
        const amIDead = liarState.dead.includes(myName);

        // تحديث معلومات الدور
        document.getElementById('liar-info').innerHTML = `المطلوب لعب ورقة: <span style="color:white; font-size:20px;">${liarState.requiredCard}</span><br>` +
            (isMyTurn ? "دورك الآن! 🫵" : `دور اللاعب: ${decodeURIComponent(currentPlayer.name)}`);

        // تحديث الكروت
        let cardsHtml = '';
        myCards.forEach((c, idx) => {
            cardsHtml += `<div class="card-item ${selectedCardIdx === idx ? 'selected' : ''}" onclick="selectCard(${idx})">${c}</div>`;
        });
        document.getElementById('my-cards').innerHTML = cardsHtml;
        document.getElementById('my-cards-area').style.display = amIDead ? 'none' : 'block';

        // تحديث الأزرار
        document.getElementById('liar-actions').style.display = (isMyTurn && !amIDead) ? 'block' : 'none';
        document.getElementById('call-liar-btn').style.display = (liarState.lastPlayer && liarState.lastPlayer !== myName) ? 'block' : 'none';

        // تحديث قائمة اللاعبين والدم
        let listHtml = '';
        players.forEach(p => {
            let isDead = liarState.dead.includes(p.name);
            listHtml += `<div class="player-item ${isDead ? 'player-dead' : ''}">
                <span>${decodeURIComponent(p.name)}</span>
                <span class="health-bar">${liarState.health[p.name]}/6 💢</span>
            </div>`;
        });
        document.getElementById('liar-players-list').innerHTML = listHtml;
    }

    function selectCard(idx) {
        selectedCardIdx = idx;
        updateLiarUI();
    }

    function liarPlay() {
        if(selectedCardIdx === -1) return alert("اختار ورقة الأول!");
        let card = myCards.splice(selectedCardIdx, 1)[0];
        selectedCardIdx = -1;

        liarState.lastPlayedCard = card;
        liarState.lastPlayer = myName;
        nextTurn();
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'liar_update', state: liarState}));
    }

    function liarCallLiar() {
        let actual = liarState.lastPlayedCard;
        let req = liarState.requiredCard[0]; // K, A, or Q
        let isLiar = (actual !== req && actual !== 'J');
        
        let victim = isLiar ? liarState.lastPlayer : myName;
        let attacker = isLiar ? myName : liarState.lastPlayer;
        
        applyHit(victim);
        
        let msg = isLiar ? `طلع كذاب! ${decodeURIComponent(liarState.lastPlayer)} بياخد ضربة` : `طلع صادق! أنت اللي بتاخد ضربة`;
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'liar_alert', msg: msg}));
        
        liarState.lastPlayedCard = '';
        liarState.lastPlayer = '';
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'liar_update', state: liarState}));
    }

    function applyHit(player) {
        liarState.health[player]++;
        let currentHealth = liarState.health[player];
        let deathChance = (currentHealth >= 6) ? 1.0 : 0.10;

        if(Math.random() < deathChance) {
            liarState.dead.push(player);
            mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'liar_alert', msg: `💀 للأسف! اللاعب ${decodeURIComponent(player)} مات!`}));
        }

        // فحص انتهاء اللعبة
        let alive = players.filter(p => !liarState.dead.includes(p.name));
        if(alive.length <= 1) {
            let winner = alive.length === 1 ? decodeURIComponent(alive[0].name) : "لا أحد";
            mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'game_over', msg: `الفائز هو: ${winner}`}));
        }
    }

    function nextTurn() {
        do {
            liarState.turn = (liarState.turn + 1) % players.length;
        } while (liarState.dead.includes(players[liarState.turn].name));
    }

    function showFinalResult(title, desc, color) {
        document.getElementById('result-title').innerText = title;
        document.getElementById('result-title').style.color = color;
        document.getElementById('result-desc').innerHTML = desc;
        navTo('p-result');
    }

    function leaveRoom() { location.reload(); }
    function copyUrl() {
        let el = document.createElement('textarea');
        el.value = document.getElementById('invite-link').innerText;
        document.body.appendChild(el); el.select();
        document.execCommand('copy'); document.body.removeChild(el);
        alert("تم نسخ الرابط!");
    }
</script>

</body>
</html>
