<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<title>🕵️ لعبة الجاسوس</title>

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background: linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#app{
width:90%;
max-width:500px;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:25px;
backdrop-filter:blur(20px);
text-align:center;
}

button{
background: linear-gradient(90deg,#667eea,#764ba2);
border:none;
padding:14px;
margin:8px;
border-radius:25px;
color:white;
font-size:16px;
cursor:pointer;
width:90%;
}

input{
padding:14px;
width:85%;
border-radius:25px;
border:none;
margin:10px;
text-align:center;
}

ul{list-style:none;padding:0}
li{
background:rgba(255,255,255,.1);
margin:6px;
padding:12px;
border-radius:12px;
}

.overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.9);
display:flex;
justify-content:center;
align-items:center;
}

.popup{
background:#1a1a3e;
padding:25px;
border-radius:20px;
width:90%;
max-width:350px;
}
</style>
</head>

<body>

<div id="app">

<div id="home">
<h2>🕵️ لعبة الجاسوس</h2>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<div id="linkBox">
<p id="link"></p>
<button onclick="copyLink()">📋 نسخ الرابط</button>
</div>

<ul id="players"></ul>

<button id="startBtn" style="display:none">
🚀 بدء اللعبة
</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", players={}, isHost=false;

// لو داخل من رابط
let params=new URLSearchParams(location.search);
if(params.get("room")){
room=params.get("room");
showJoin();
}

function showJoin(){
let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`
<div class="popup">
<h3>✍️ اكتب اسمك</h3>
<input id="name">
<button onclick="join()">🚪 انضمام</button>
</div>`;
document.body.appendChild(div);
}

function join(){
let name=document.getElementById("name").value.trim();
if(!name) return;

playerId="p"+Date.now();
isHost=false;

db.ref("rooms/"+room+"/players/"+playerId).set({
name:name
});

document.querySelector(".overlay").remove();
openRoom();
}

// إنشاء غرفة
function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();
isHost=true;

db.ref("rooms/"+room).set({
players:{
[playerId]:{name:"👑 SASUKE 👑"}
}
});

openRoom();

document.getElementById("link").innerText=
location.origin+location.pathname+"?room="+room;
}

// فتح الغرفة
function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

// اخفاء الرابط لغير الهوست
if(!isHost){
document.getElementById("linkBox").style.display="none";
}

db.ref("rooms/"+room+"/players").on("value",snap=>{
players=snap.val()||{};

let html="";
for(let id in players){
html+=`<li>${players[id].name}</li>`;
}
document.getElementById("players").innerHTML=html;

// شرط 3 لاعبين
if(Object.keys(players).length>=3){
document.getElementById("startBtn").style.display="block";
}
});
}

// نسخ الرابط
function copyLink(){
navigator.clipboard.writeText(document.getElementById("link").innerText);
document.getElementById("linkBox").style.display="none";
}

</script>

</body>
</html>
