<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<style>
body{
    margin:0;
    font-family:Tajawal;
    background:linear-gradient(135deg,#1e2a78,#3c4fa3);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:rgba(0,0,0,0.35);
    padding:25px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:400px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:15px;
    margin-top:10px;
    text-align:center;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:20px;
    font-size:18px;
    color:white;
    cursor:pointer;
    margin-top:12px;
}

.main-btn{
    background:linear-gradient(to right,#8e2de2,#4a00e0);
}

.copy-btn{
    background:linear-gradient(to right,#00c6ff,#0072ff);
}

.join-btn{
    background:linear-gradient(to right,#ff7e5f,#feb47b);
}

.player{
    background:rgba(255,255,255,0.1);
    padding:10px;
    border-radius:12px;
    margin-top:6px;
}

.host{
    border:2px solid gold;
}

.hidden{display:none;}
</style>
</head>

<body>

<!-- الرئيسية -->
<div class="box" id="home">
<h1>👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑</h1>

<input id="hostName" placeholder="اكتب اسمك كهوست">

<button class="main-btn" onclick="startGame()">🎮 لعبة الجاسوس</button>
</div>

<!-- غرفة -->
<div class="box hidden" id="room">
<h2>🔥 تم إنشاء الغرفة</h2>

<button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>

<h3>اللاعبين:</h3>
<div id="players"></div>
</div>

<!-- انضمام -->
<div class="box hidden" id="join">
<h2>✍️ اكتب اسمك</h2>
<input id="nameInput" placeholder="اسمك">
<button class="join-btn" onclick="joinGame()">🚪 انضمام</button>
</div>

<!-- انتظار -->
<div class="box hidden" id="waiting">
<h2>⏳ في انتظار بدء اللعبة</h2>
<p id="yourName"></p>

<h3>اللاعبين:</h3>
<div id="players2"></div>
</div>

<script>

let roomId = null;

// دخول من رابط
const params = new URLSearchParams(window.location.search);
if(params.get("room")){
    roomId = params.get("room");
    show("join");
}

// إنشاء غرفة
function startGame(){
    let hostName = document.getElementById("hostName").value.trim();
    if(!hostName) return alert("اكتب اسمك الأول");

    roomId = Math.floor(Math.random()*100000);

    let players = [{
        name: hostName,
        host: true
    }];

    localStorage.setItem("room_"+roomId, JSON.stringify(players));

    show("room");
    updatePlayers();
}

// نسخ الرابط
function copyLink(){
    let link = location.href.split("?")[0] + "?room=" + roomId;
    navigator.clipboard.writeText(link);
    alert("تم نسخ الرابط ✅");
}

// انضمام
function joinGame(){
    let name = document.getElementById("nameInput").value.trim();
    if(!name) return alert("اكتب اسمك");

    let players = JSON.parse(localStorage.getItem("room_"+roomId)) || [];

    players.push({
        name: name,
        host: false
    });

    localStorage.setItem("room_"+roomId, JSON.stringify(players));

    document.getElementById("yourName").innerText = "اسمك: " + name;

    show("waiting");
    updatePlayers2();
}

// عرض عند الهوست
function updatePlayers(){
    setInterval(()=>{
        let players = JSON.parse(localStorage.getItem("room_"+roomId)) || [];
        let div = document.getElementById("players");
        div.innerHTML = "";

        players.forEach(p=>{
            if(p.host){
                div.innerHTML += `<div class="player host">👑 ${p.name} (Host)</div>`;
            }else{
                div.innerHTML += `<div class="player">${p.name}</div>`;
            }
        });

    },1000);
}

// عرض عند اللاعب
function updatePlayers2(){
    setInterval(()=>{
        let players = JSON.parse(localStorage.getItem("room_"+roomId)) || [];
        let div = document.getElementById("players2");
        div.innerHTML = "";

        players.forEach(p=>{
            if(p.host){
                div.innerHTML += `<div class="player host">👑 ${p.name} (Host)</div>`;
            }else{
                div.innerHTML += `<div class="player">${p.name}</div>`;
            }
        });

    },1000);
}

// تغيير الشاشة
function show(id){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("room").classList.add("hidden");
    document.getElementById("join").classList.add("hidden");
    document.getElementById("waiting").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");
}

</script>

</body>
</html>
