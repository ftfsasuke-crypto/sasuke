<script>
    // ضفنا متغير جديد اسمه gameCategory عشان يفتكر إنت اخترت أي تصنيف
    let mqttClient, myName, roomId, isHost = false, players = [], gameMode = '', gameCategory = '';

    // دي قايمة الكلمات.. تقدر تزود فيها زي ما إنت عايز بين علامات التنصيص
    const wordsDB = {
        food: ['بيتزا', 'شاورما', 'برجر', 'كشري', 'مكرونة بشاميل', 'محشي', 'سوشي', 'كباب', 'فلافل', 'بطاطس مقلية', 'ستيك', 'بان كيك', 'اندومي', 'حواوشي', 'طاجن بامية'],
        animals: ['أسد', 'فيل', 'زرافة', 'قرد', 'نمر', 'حصان', 'كلب', 'قطة', 'تمساح', 'ثعبان', 'غزال', 'صقر', 'دب', 'كنغر', 'بطريق'],
        objects: ['موبايل', 'لابتوب', 'كرسي', 'تلاجة', 'غسالة', 'تليفزيون', 'ساعة', 'نظارة', 'قلم', 'عجلة', 'طيارة', 'كاميرا', 'شاحن', 'سرير', 'ميكروويف']
    };

    function navTo(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active-panel');
    }

    if (window.location.search.includes('room=')) {
        navTo('p-join');
    } else {
        navTo('p-main');
    }

    function renderPlayers() {
        let html = '';
        players.forEach(p => {
            let name = decodeURIComponent(p.name);
            let kick = (isHost && p.name !== myName) ? `<button class="kick-btn" onclick="kickUser('${p.name}')">طرد</button>` : '';
            html += `<div class="player-item"><span>${name}</span>${kick}</div>`;
        });
        document.getElementById('h-list').innerHTML = html;
        document.getElementById('g-list').innerHTML = html;
        document.getElementById('game-list').innerHTML = html;
        document.getElementById('h-count').innerText = players.length;
        document.getElementById('g-count').innerText = players.length;
        if(isHost) document.getElementById('start-btn').disabled = players.length < 2;
    }

    function hostRoom(cat, name, mode) {
        if(typeof mqtt === 'undefined') return alert("الموقع لسه بيحمل، ثواني وجرب تاني..");
        
        isHost = true; 
        gameMode = mode;
        gameCategory = cat; // هنا بنحفظ التصنيف اللي الهوست اختاره (أكلات، حيوانات، الخ)
        
        let n = document.getElementById('host-input').value || "Sasuke";
        myName = encodeURIComponent(n + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('invite-link').innerText = window.location.origin + window.location.pathname + "?room=" + roomId;
        
        players = [{name: myName}];
        renderPlayers();
        navTo('p-lobby');

        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        mqttClient.on('connect', () => {
            mqttClient.subscribe('mx_sasuke_' + roomId);
        });
        mqttClient.on('message', (t, m) => {
            let d = JSON.parse(m.toString());
            if(d.type === 'join' && isHost) {
                if(!players.find(p => p.name === d.name)) {
                    players.push({name: d.name});
                    renderPlayers();
                    mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'sync', players: players}));
                }
            }
            if(d.type === 'leave' && isHost) {
                players = players.filter(p => p.name !== d.name);
                renderPlayers();
                mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'sync', players: players}));
            }
        });
    }

    function joinRoom() {
        if(typeof mqtt === 'undefined') return alert("الموقع لسه بيحمل..");
        
        let n = document.getElementById('guest-input').value;
        if(!n) return alert("اكتب اسمك!");
        myName = encodeURIComponent(n);
        roomId = new URLSearchParams(window.location.search).get('room');
        
        navTo('p-wait');
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        mqttClient.on('connect', () => {
            mqttClient.subscribe('mx_sasuke_' + roomId);
            mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
        });
        mqttClient.on('message', (t, m) => {
            let d = JSON.parse(m.toString());
            if(d.type === 'sync') { players = d.players; renderPlayers(); }
            if(d.type === 'start') {
                let w = d.words[myName];
                if(w) {
                    document.getElementById('my-word').innerText = w;
                    if(w.includes('جاسوس')) document.getElementById('my-word').style.color = 'var(--imposter)';
                    navTo('p-game');
                }
            }
            if(d.type === 'kick' && d.target === myName) {
                alert("تم طردك من الغرفة!");
                forceLeave();
            }
            if(d.type === 'room_closed' && !isHost) {
                alert("الهوست قام بإغلاق الغرفة!");
                forceLeave();
            }
        });
    }

    function launchGame() {
        let assigned = {};
        if(gameMode === 'imposter') {
            // سحب قايمة الكلمات بناءً على التصنيف اللي الهوست اختاره، ولو مفيش يختار أكلات كاحتياطي
            let currentList = wordsDB[gameCategory] || wordsDB['food'];
            
            // اختيار كلمة عشوائية من القايمة
            let randomWord = currentList[Math.floor(Math.random() * currentList.length)];
            
            // اختيار لاعب عشوائي عشان يكون الجاسوس
            let imp = players[Math.floor(Math.random() * players.length)].name;
            
            // توزيع الأدوار
            players.forEach(p => {
                assigned[p.name] = (p.name === imp) ? "أنت الجاسوس 🕵️‍♂️" : "الكلمة: " + randomWord;
            });
        } else {
            players.forEach(p => assigned[p.name] = "شخصية عشوائية");
        }
        
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'start', words: assigned}));
        document.getElementById('my-word').innerText = assigned[myName];
        navTo('p-game');
    }

    function copyUrl() {
        navigator.clipboard.writeText(document.getElementById('invite-link').innerText);
        alert("تم النسخ!");
    }

    function kickUser(targetName) {
        if(!isHost) return;
        players = players.filter(p => p.name !== targetName);
        renderPlayers();
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'kick', target: targetName}));
        mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'sync', players: players}));
    }

    function leaveRoom() {
        if (mqttClient) {
            if (isHost) {
                mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'room_closed'}));
            } else {
                mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({type: 'leave', name: myName}));
            }
            forceLeave();
        } else {
            navTo('p-main');
        }
    }

    function forceLeave() {
        if(mqttClient) mqttClient.end();
        players = [];
        isHost = false;
        roomId = null;
        window.history.replaceState({}, document.title, window.location.pathname);
        navTo('p-main');
    }
</script>
