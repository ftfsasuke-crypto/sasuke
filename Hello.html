<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة الجاسوس 1 - النسخة المستقرة</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#eee;text-align:center;padding:15px}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:6px;border-radius:30px;cursor:pointer}
        .btn-gold{background:#f39c12}
        input{padding:12px;border-radius:30px;border:none;margin:8px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        li{background:rgba(255,255,255,.05);margin:5px 0;padding:10px;border-radius:40px}
        .host-box{background:rgba(255,255,255,.08);padding:16px;border-radius:28px;border:1px solid #e94560}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.97);z-index:1000;display:flex;align-items:center;justify-content:center}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:25px;border-radius:32px;max-width:400px}
        .vote-counter{background:rgba(0,0,0,.5);padding:10px;border-radius:48px;margin:10px 0}
        .guess-btn{background:#2ecc71;padding:8px 16px;margin:5px}
        .close-btn{background:#555;margin-top:15px;padding:8px 20px}
        .copy-btn{background:#2ecc71;padding:4px 15px}
    </style>
</head>
<body>
<div id="app" style="max-width:550px;margin:auto;background:rgba(0,0,0,.5);border-radius:28px;padding:20px">
    <div id="host-screen">
        <h1>🕵️ لعبة الجاسوس 1</h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <strong>⚔️ SASUKE ⚔️</strong></p></div>
        <button class="btn-gold" onclick="window.createRoom()">🎮 ابدأ غرفة جديدة</button>
    </div>

    <div id="join-screen" style="display:none">
        <h1>🕵️ انضم للعبة</h1>
        <input type="text" id="player-name" placeholder="اكتب اسمك">
        <button onclick="window.joinRoom()">🚪 دخول</button>
    </div>

    <div id="game-screen" style="display:none">
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;border-radius:20px;margin:10px 0">
            <span id="link-text"></span> <button onclick="window.copyLink()" class="copy-btn">📋 نسخ</button>
        </div>
        <div id="word-display" style="display:none;padding:20px;border-radius:24px;margin:10px 0;font-size:28px"></div>
        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="window.startGame()">🚀 ابدأ</button>
            <button id="btn-show-vote" onclick="window.showVoting()" style="display:none">🗳️ تصويت</button>
        </div>
        <div id="vote-counter-container" class="vote-counter" style="display:none">🗳️ <span id="vote-count">0</span> / <span id="total-voters">0</span></div>
        <ul id="player-list"></ul>
        <div id="vote-log-section" style="display:none"><div id="vote-log"></div></div>
        <div id="vote-section" style="display:none"><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار الآخرين...</div>
        <button onclick="window.leaveRoom()">🚪 مغادرة</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
        authDomain: "spy-game-1d774.firebaseapp.com",
        projectId: "spy-game-1d774",
        databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let mid, mn, rid, ih, si, sw, ap = {}, ph = 'waiting';
    let voteInterval = null;

    const w = ['تفاحة','موز','برتقال','فراولة','عنب','مانجو','أناناس','بطيخ','خوخ','رمان','ليمون','جزر','طماطم','خيار','فلفل','بصل','أسد','نمر','فيل','زرافة','كلب','قطة','حصان','بقرة','مسجد','كنيسة','مستشفى','مدرسة','جامعة','مكتبة','متحف','حديقة','مطعم','مقهى','فندق','شاطئ','سينما','مسرح','مطار','طبيب','مهندس','معلم','محامي','شرطي','طيار','سائق','نجار','سباك','كهربائي','سرير','كرسي','طاولة','خزانة','كنبة','ثلاجة','غسالة','هاتف','تلفاز','كتاب','قلم','شمس','قمر','نجوم','بحر','نهر','جبل','صحراء','كرة قدم','كرة سلة','تنس','سباحة','شطرنج','بيتزا','برغر','شاورما','فلافل','حمص','شاي','قهوة'];

    const params = new URLSearchParams(location.search);
    const roomParam = params.get('room');
    if (roomParam) { rid = roomParam; document.getElementById('host-screen').style.display = 'none'; document.getElementById('join-screen').style.display = 'block'; checkRoom(); }
    else document.getElementById('host-screen').style.display = 'block';

    async function checkRoom() {
        const snap = await get(ref(db, 'rooms/' + rid));
        if (!snap.exists() || !snap.val().active) expire();
    }
    function expire() { document.getElementById('join-screen').style.display = 'none'; alert("⚠️ الرابط منتهي"); setTimeout(()=> location.href=location.origin+location.pathname, 2000); }

    window.createRoom = async function() {
        rid = 'r' + Date.now(); mid = 'h' + Date.now(); mn = 'SASUKE'; ih = true;
        await set(ref(db, 'rooms/' + rid), { phase: 'waiting', active: true, si: null, sw: null, vr: {}, vl: {} });
        await set(ref(db, 'rooms/' + rid + '/players/' + mid), { id: mid, name: mn, ih: true, eliminated: false });
        document.getElementById('host-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('room-link').style.display = 'block';
        document.getElementById('link-text').innerText = location.origin + location.pathname + '?room=' + rid;
        document.getElementById('host-btns').style.display = 'block';
        listenPlayers(); listenRoom();
        alert("✅ الغرفة جاهزة");
    };

    window.joinRoom = async function() {
        let name = document.getElementById('player-name').value.trim();
        if (!name) return alert("ادخل اسمك");
        mn = name; mid = 'p' + Date.now(); ih = false;
        const snap = await get(ref(db, 'rooms/' + rid));
        if (!snap.exists() || !snap.val().active) return expire();
        await set(ref(db, 'rooms/' + rid + '/players/' + mid), { id: mid, name: mn, ih: false, eliminated: false });
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        listenPlayers(); listenRoom();
        alert("👋 مرحباً " + mn);
    };

    function listenPlayers() {
        onValue(ref(db, 'rooms/' + rid + '/players'), (snap) => {
            ap = snap.val() || {};
            let list = '';
            for (let id in ap) list += `<li>${ap[id].name} ${ap[id].ih ? '👑' : ''} ${ap[id].eliminated ? '👀' : ''}</li>`;
            document.getElementById('player-list').innerHTML = list;
        });
    }

    function listenRoom() {
        onValue(ref(db, 'rooms/' + rid), (snap) => {
            if (!snap.exists()) { alert("الغرفة حذفت"); location.reload(); return; }
            let data = snap.val();
            if (data.phase !== ph) {
                ph = data.phase;
                si = data.si; sw = data.sw;
                if (ph === 'playing') showWord();
                else if (ph === 'voting') startVoting();
                else if (ph === 'spyGuess' && mid === si) showGuessUI();
            }
        });
        onValue(ref(db, 'rooms/' + rid + '/msg'), (s) => { let m = s.val(); if (m && m.html) showMessage(m.html); });
        onValue(ref(db, 'rooms/' + rid + '/vl'), (s) => { let log = ''; for(let v of Object.values(s.val() || {})) log += `<div>🗳️ ${v.v} → ${v.t}</div>`; document.getElementById('vote-log').innerHTML = log || 'لا تصويتات'; });
    }

    function showWord() {
        let div = document.getElementById('word-display');
        div.style.display = 'block';
        if (ap[mid]?.eliminated) { div.innerHTML = '👀 وضع المشاهدة'; div.style.background = '#444'; return; }
        if (mid === si) { div.innerHTML = '🕵️ أنت الجاسوس!'; div.style.background = '#8b0000'; }
        else { div.innerHTML = '🔍 الكلمة: ' + sw; div.style.background = '#1e5631'; }
        if (ih) { document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-show-vote').style.display = 'inline-block'; }
    }

    function startVoting() {
        document.getElementById('vote-section').style.display = 'block';
        let btns = '';
        for (let id in ap) if (id !== mid && !ap[id].eliminated) btns += `<button onclick="window.vote('${id}')">${ap[id].name}</button>`;
        document.getElementById('vote-btns').innerHTML = btns;
        document.getElementById('vote-log-section').style.display = 'block';
        if (voteInterval) clearInterval(voteInterval);
        voteInterval = setInterval(async () => {
            if (ph !== 'voting') { document.getElementById('vote-counter-container').style.display = 'none'; return; }
            let players = (await get(ref(db, 'rooms/' + rid + '/players'))).val() || {};
            let active = Object.values(players).filter(p => !p.eliminated).length;
            let votes = (await get(ref(db, 'rooms/' + rid + '/vr'))).val() || {};
            document.getElementById('vote-count').innerText = Object.keys(votes).length;
            document.getElementById('total-voters').innerText = active;
            document.getElementById('vote-counter-container').style.display = 'block';
        }, 800);
    }

    window.vote = async function(votedId) {
        if (ap[mid]?.eliminated) return alert("أنت في وضع المشاهدة");
        await set(ref(db, 'rooms/' + rid + '/vr/' + mid), votedId);
        await set(ref(db, 'rooms/' + rid + '/vl/' + mid), { v: mn, t: ap[votedId]?.name });
        document.getElementById('vote-section').style.display = 'none';
        document.getElementById('waiting-votes').style.display = 'block';

        let players = (await get(ref(db, 'rooms/' + rid + '/players'))).val() || {};
        let active = Object.values(players).filter(p => !p.eliminated).length;
        let votes = (await get(ref(db, 'rooms/' + rid + '/vr'))).val() || {};
        if (Object.keys(votes).length >= active) {
            document.getElementById('waiting-votes').style.display = 'none';
            let count = {};
            for (let v of Object.values(votes)) count[v] = (count[v] || 0) + 1;
            let sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]);
            let votedOut = sorted[0][0];
            let isSpy = (votedOut === si);
            let votedName = ap[votedOut]?.name || '???';
            let spyName = ap[si]?.name || '???';

            if (isSpy) {
                await update(ref(db, 'rooms/' + rid), { phase: 'spyGuess' });
                showMessage(`✅ تم اكتشاف الجاسوس: ${votedName}\n⏳ في انتظار تخمين الجاسوس...`, true);
            } else {
                await update(ref(db, 'rooms/' + rid + '/players/' + votedOut), { eliminated: true });
                // ⭐⭐⭐ هنا الرسالة اللي كانت ناقصة ⭐⭐⭐
                showMessage(`❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n🕵️ الجاسوس الحقيقي هو: ${spyName}\n⏳ في انتظار تخمين الجاسوس...`, true);
                await update(ref(db, 'rooms/' + rid), { phase: 'spyGuess' });
            }
        }
    };

    function showGuessUI() {
        let old = document.getElementById('guessDiv');
        if (old) old.remove();
        let div = document.createElement('div');
        div.id = 'guessDiv';
        div.className = 'overlay';
        div.innerHTML = `<div class="overlay-box"><h3>🤔 خمن الكلمة</h3><input id="guessInput" type="text" placeholder="اكتب كلمة"><br><button onclick="window.submitGuess()">📨 إرسال</button><br><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
        document.getElementById('guessInput')?.focus();
    }

    window.submitGuess = async function() {
        let guess = document.getElementById('guessInput')?.value.trim();
        if (!guess) return;
        document.getElementById('guessDiv')?.remove();
        await update(ref(db, 'rooms/' + rid), { phase: 'finished' });
        await set(ref(db, 'rooms/' + rid + '/msg'), { html: `🔍 الجاسوس (${ap[si]?.name}) كتب: ${guess}\n🔑 الكلمة الصحيحة كانت: ${sw}\n🏆 انتهت اللعبة`, target: 'all' });
    };

    window.startGame = async function() {
        let players = (await get(ref(db, 'rooms/' + rid + '/players'))).val() || {};
        let ids = Object.keys(players);
        if (ids.length < 2) return alert("يلزم 2 لاعبين على الأقل");
        let spy = ids[Math.floor(Math.random() * ids.length)];
        let word = w[Math.floor(Math.random() * w.length)];
        await update(ref(db, 'rooms/' + rid), { phase: 'playing', si: spy, sw: word, vr: {}, vl: {} });
        for (let id of ids) await update(ref(db, 'rooms/' + rid + '/players/' + id), { eliminated: false });
        alert("🎮 بدأت اللعبة!");
    };

    window.showVoting = function() { update(ref(db, 'rooms/' + rid), { phase: 'voting' }); };
    window.copyLink = function() {
        navigator.clipboard.writeText(document.getElementById('link-text').innerText);
        alert("📋 تم النسخ");
        document.getElementById('room-link').style.display = 'none';
    };
    window.leaveRoom = function() {
        if (voteInterval) clearInterval(voteInterval);
        if (mid && rid) {
            if (ih) remove(ref(db, 'rooms/' + rid));
            else remove(ref(db, 'rooms/' + rid + '/players/' + mid));
        }
        location.reload();
    };
    function showMessage(msg, permanent = false) {
        let old = document.getElementById('tempMsg');
        if (old) old.remove();
        let div = document.createElement('div');
        div.id = 'tempMsg';
        div.className = 'overlay';
        div.innerHTML = `<div class="overlay-box">${msg.replace(/\n/g,'<br>')}<br><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
        if (!permanent) setTimeout(() => div.remove(), 5000);
    }
</script>
</body>
</html>
