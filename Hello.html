<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس 1 و 2</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#eee;text-align:center;padding:15px;min-height:100vh;direction:rtl}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:6px;border-radius:30px;cursor:pointer}
        .btn-gold{background:#f39c12}
        input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        li{background:rgba(255,255,255,.05);margin:5px 0;padding:10px;border-radius:12px}
        .host-box{background:rgba(255,255,255,.05);padding:16px;border-radius:24px;border:1px solid #e94560}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.96);z-index:1000;display:flex;align-items:center;justify-content:center}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:25px;border-radius:28px;max-width:450px}
        .vote-counter{background:rgba(0,0,0,.5);padding:10px;border-radius:30px;margin:10px 0}
        .guess-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0}
        .guess-btn{background:#2ecc71;padding:8px 16px;margin:5px}
        .close-btn{background:#555;margin-top:15px;padding:8px 20px}
    </style>
</head>
<body>
<div id="app" style="max-width:550px;margin:auto;background:rgba(0,0,0,.5);border-radius:24px;padding:20px">
    <div id="host-screen">
        <h1>🕵️ لعبة الجاسوس</h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: ⚔️ SASUKE ⚔️</p></div>
        <button class="btn-gold" onclick="window.createRoom('normal')">🎮 لعبة الجاسوس ١</button>
        <button class="btn-gold" onclick="window.createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
    </div>

    <div id="join-screen" style="display:none">
        <h1>🕵️ الانضمام</h1>
        <input type="text" id="player-name" placeholder="اسمك"><br>
        <button onclick="window.joinRoom()">🚪 انضمام</button>
    </div>

    <div id="game-screen" style="display:none">
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;margin:10px 0">
            <span id="link-text"></span> <button onclick="window.copyLink()">📋 نسخ الرابط</button>
        </div>
        <div id="word-display" style="display:none;padding:20px;border-radius:20px;margin:10px 0;font-size:28px"></div>
        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="window.startGame()">🚀 ابدأ</button>
            <button id="btn-show-vote" onclick="window.showVoting()" style="display:none">🗳️ تصويت</button>
        </div>
        <div id="vote-counter-container" class="vote-counter" style="display:none">🗳️ <span id="vote-count">0</span>/<span id="total-voters">0</span></div>
        <ul id="player-list"></ul>
        <div id="vote-log-section" style="display:none"><div id="vote-log"></div></div>
        <div id="vote-section" style="display:none"><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار باقي التصويتات...</div>
        <button onclick="window.leaveRoom()">🚪 مغادرة</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
        authDomain: "spy-game-1d774.firebaseapp.com",
        projectId: "spy-game-1d774",
        databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com/"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let mid, mn, rid, ih, gm, si, sw, ap = {}, ph = 'waiting';
    let voteInterval = null;

    // ---------- 1000 كلمة ----------
    const w = [
        'تفاحة','موز','برتقال','فراولة','عنب','مانجو','أناناس','بطيخ','شمام','كرز','خوخ','كمثرى','رمان','كيوي','جوز هند','افوكادو','توت','توت بري','ليمون','جريب فروت','يوسفي','باباي','جاك فروت','ليتشي','تمر','زيتون','جزر','بطاطس','طماطم','خيار','فلفل','باذنجان','قرنبيط','بروكلي','سبانخ','خس','كرنب','بصل','ثوم','زنجبيل','فجل','كرفس','كوسا','بامية','فاصوليا','بازلاء','ذرة','عدس','حمص','فول','أسد','نمر','فيل','زرافة','حمار وحشي','وحيد القرن','فرس النهر','تمساح','ثعبان','سلحفاة','قرد','غوريلا','شمبانزي','دب','ذئب','ثعلب','كلب','قطة','حصان','بقرة','خروف','ماعز','دجاجة','بطة','أوزة','حمامة','نسر','بومة','ببغاء','نعامة','كنغر','كوالا','باندا','جمل','غزال','سنجاب','أرنب','فأر','قنفذ','حوت','دلفين','قرش','أخطبوط','مسجد','كنيسة','مستشفى','مدرسة','جامعة','روضة','مكتبة','متحف','حديقة','حمام سباحة','صالة رياضية','سوبر ماركت','بقالة','سوق','مول تجاري','مطعم','مقهى','فندق','شاطئ','سينما','مسرح','استاد','مطار','محطة قطار','مركز شرطة','مخبز','صالون حلاقة','عيادة','صيدلية','نادي','طبيب','مهندس','معلم','محامي','قاضي','شرطي','جندي','اطفائي','طيار','بحار','سائق','ميكانيكي','نجار','حداد','سباك','كهربائي','بناء','رسام','موسيقي','مغني','راقص','ممثل','كاتب','شاعر','صحفي','مصور','طباخ','خباز','حلواني','صائغ','خياط','حلاق','بيطري','ممرض','صيدلي','عالم','باحث','محاسب','مدير','تاجر','مزارع','راعي','صياد','غواص','سرير','كرسي','طاولة','خزانة','كنبة','ستارة','سجادة','وسادة','بطانية','مرآة','مصباح','ثلاجة','فرن','ميكروويف','غسالة','مكنسة','ممسحة','خلاط','غلاية','طنجرة','مقلاة','صحن','كأس','ملعقة','شوكة','سكين','مفتاح','هاتف','شاحن','كمبيوتر','تلفاز','ريموت','كتاب','قلم','دفتر','مقص','صمغ','مشط','فرشاة أسنان','شامبو','صابون','شمس','قمر','نجوم','سماء','سحاب','مطر','ثلج','برق','رعد','رياح','بحر','نهر','شلال','بحيرة','وادي','جبل','صحراء','رمال','عشب','شجر','زهرة','وردة','ياسمين','نخلة','صنوبر','غابة','كهف','جزيرة','بركان','كرة قدم','كرة سلة','كرة طائرة','كرة يد','تنس','سباحة','ملاكمة','جودو','كاراتيه','يوغا','جمباز','جري','دراجات','فروسية','رماية','شطرنج','داما','بوكر','أونو','الغاز','سودوكو','لابتوب','تابلت','ساعة ذكية','سماعات','كاميرا','ميكروفون','شاشة','فأرة','طابعة','راوتر','فلاشة','بطارية','روبوت','انترنت','واي فاي','بلوتوث','تلسكوب','بيتزا','برغر','شاورما','فلافل','حمص','فتوش','تبولة','كبة','باستا','رز','كبسة','مندي','سلطة','شوربة','جبنة','حليب','عسل','شوكولاتة','بقلاوة','كنافة','قطايف','عصير','شاي','قهوة','نسكافيه','كابتشينو','كوكتيل','ميكي ماوس','بندق','سبونج بوب','كابتن ماجد','شريك','توم','جيري','علاء الدين','سيمبا','ناروتو','ساسوكي','غوكو','لوفي'
    ];

    const params = new URLSearchParams(location.search);
    const roomIdUrl = params.get('room');
    if (roomIdUrl) { rid = roomIdUrl; document.getElementById('host-screen').style.display = 'none'; document.getElementById('join-screen').style.display = 'block'; checkRoom(); }
    else document.getElementById('host-screen').style.display = 'block';

    async function checkRoom() { let snap = await get(ref(db, 'rooms/' + rid)); if (!snap.exists() || !snap.val().active) expireRoom(); }
    function expireRoom() { document.getElementById('join-screen').style.display = 'none'; showMessage("⚠️ الغرفة منتهية"); setTimeout(()=> location.href=location.origin+location.pathname, 2000); }

    window.createRoom = async function(gameMode) {
        gm = gameMode; mn = 'SASUKE'; rid = 'r'+Date.now(); mid = 'h'+Date.now(); ih = true;
        await set(ref(db, 'rooms/'+rid), { gm, phase:'waiting', active:true, si:null, sw:null, vr:{}, vl:{}, msg:null });
        await set(ref(db, 'rooms/'+rid+'/players/'+mid), { id:mid, name:mn, ih:true, eliminated:false });
        document.getElementById('host-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('room-link').style.display = 'block';
        document.getElementById('link-text').innerText = location.origin+location.pathname+'?room='+rid;
        document.getElementById('host-btns').style.display = 'block';
        listenPlayers(); listenRoom();
        showMessage("✅ الغرفة جاهزة");
    };

    window.joinRoom = async function() {
        let name = document.getElementById('player-name').value.trim();
        if (!name) return showMessage("ادخل اسمك");
        mn = name; mid = 'p'+Date.now(); ih = false;
        let snap = await get(ref(db, 'rooms/'+rid));
        if (!snap.exists() || !snap.val().active) return expireRoom();
        await set(ref(db, 'rooms/'+rid+'/players/'+mid), { id:mid, name:mn, ih:false, eliminated:false });
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        listenPlayers(); listenRoom();
        showMessage(`👋 مرحبا ${mn}`);
    };

    function listenPlayers() {
        onValue(ref(db, 'rooms/'+rid+'/players'), (snap) => {
            ap = snap.val() || {};
            let list = '';
            for(let id in ap) list += `<li>${ap[id].name} ${ap[id].ih ? '👑' : ''} ${ap[id].eliminated ? '👀' : ''}</li>`;
            document.getElementById('player-list').innerHTML = list;
            if (gm === 'multi' && ph === 'playing') {
                let active = Object.values(ap).filter(p=>!p.eliminated).length;
                if (active <= 2) endGameLowPlayers(ap[si]?.name, sw);
            }
        });
    }

    function listenRoom() {
        onValue(ref(db, 'rooms/'+rid), (snap) => {
            if (!snap.exists()) { showMessage("🔁 تم حذف الغرفة"); setTimeout(()=> location.reload(), 2000); return; }
            let data = snap.val();
            if (data.phase !== ph) {
                ph = data.phase; si = data.si; sw = data.sw;
                if (ph === 'playing') showWord();
                else if (ph === 'voting') startVoting();
                else if (ph === 'spyGuess' && mid === si) {
                    if (gm === 'normal') showGuessInput();
                    else showSpyOptions();
                }
            }
        });
        onValue(ref(db, 'rooms/'+rid+'/msg'), (s) => { let m = s.val(); if (m && m.html) showMessage(m.html, true); });
        onValue(ref(db, 'rooms/'+rid+'/vl'), (s) => {
            let log = ''; for(let v of Object.values(s.val() || {})) log += `<div>🗳️ ${v.v} → ${v.t}</div>`;
            document.getElementById('vote-log').innerHTML = log || 'لا تصويتات';
        });
    }

    function showWord() {
        let div = document.getElementById('word-display');
        div.style.display = 'block';
        if (ap[mid]?.eliminated) { div.innerHTML = '👀 وضع المشاهدة'; div.style.background = '#444'; return; }
        if (mid === si) { div.innerHTML = '🕵️ أنت الجاسوس!'; div.style.background = '#8b0000'; }
        else { div.innerHTML = '🔍 الكلمة: ' + sw; div.style.background = '#1e5631'; }
        if (ih) { document.getElementById('btn-start').style.display = 'none'; document.getElementById('btn-show-vote').style.display = 'inline-block'; }
    }

    function startVoting() {
        document.getElementById('vote-section').style.display = 'block';
        let btns = '';
        for (let id in ap) if (id !== mid && !ap[id].eliminated) btns += `<button onclick="window.vote('${id}')">${ap[id].name}</button>`;
        document.getElementById('vote-btns').innerHTML = btns;
        document.getElementById('vote-log-section').style.display = 'block';
        if (voteInterval) clearInterval(voteInterval);
        voteInterval = setInterval(async () => {
            if (ph !== 'voting') { document.getElementById('vote-counter-container').style.display = 'none'; return; }
            let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
            let active = Object.values(players).filter(p=>!p.eliminated).length;
            let votes = (await get(ref(db, 'rooms/'+rid+'/vr'))).val() || {};
            document.getElementById('vote-count').innerText = Object.keys(votes).length;
            document.getElementById('total-voters').innerText = active;
            document.getElementById('vote-counter-container').style.display = 'block';
        }, 700);
    }

    window.vote = async function(votedId) {
        if (ap[mid]?.eliminated) return showMessage("⚠️ انت في وضع المشاهدة");
        await set(ref(db, 'rooms/'+rid+'/vr/'+mid), votedId);
        await set(ref(db, 'rooms/'+rid+'/vl/'+mid), { v: mn, t: ap[votedId]?.name });
        document.getElementById('vote-section').style.display = 'none';
        document.getElementById('waiting-votes').style.display = 'block';

        let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
        let active = Object.values(players).filter(p=>!p.eliminated).length;
        let votes = (await get(ref(db, 'rooms/'+rid+'/vr'))).val() || {};
        if (Object.keys(votes).length >= active) {
            document.getElementById('waiting-votes').style.display = 'none';
            let count = {}; for(let v of Object.values(votes)) count[v] = (count[v]||0)+1;
            let sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]);
            let votedOut = sorted[0][0];
            let isSpy = (votedOut === si);
            let votedName = ap[votedOut]?.name || '???';
            let spyName = ap[si]?.name || '???';

            if (isSpy) {
                await update(ref(db, 'rooms/'+rid), { phase: 'spyGuess' });
                showMessage(`✅ تم اكتشاف الجاسوس: ${votedName}\n⏳ في انتظار تخمين الجاسوس...`, true);
            } else {
                await update(ref(db, 'rooms/'+rid+'/players/'+votedOut), { eliminated: true });
                if (gm === 'normal') {
                    // جاسوس 1: الرسالة كاملة للكل
                    showMessage(`❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n🕵️ الجاسوس الحقيقي هو: ${spyName}\n⏳ في انتظار تخمين الجاسوس...`, true);
                    await update(ref(db, 'rooms/'+rid), { phase: 'spyGuess' });
                } else {
                    // جاسوس 2: بدون كشف الجاسوس
                    showMessage(`❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n⏳ في انتظار قرار الجاسوس...`, true);
                    if (mid === si) showSpyOptions();
                    else update(ref(db, 'rooms/'+rid), { phase: 'playing' });
                }
            }
        }
    };

    function showGuessInput() {
        let old = document.getElementById('guessDiv');
        if(old) old.remove();
        let d = document.createElement('div');
        d.id = 'guessDiv';
        d.className = 'overlay';
        d.innerHTML = `<div class="overlay-box"><h3>🤔 خمن الكلمة</h3><input id="guessText" type="text" placeholder="اكتب الكلمة"><br><button onclick="window.submitTextGuess()">📨 إرسال</button><br><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️</button></div>`;
        document.body.appendChild(d);
        document.getElementById('guessText')?.focus();
    }

    window.submitTextGuess = async function() {
        let guess = document.getElementById('guessText')?.value.trim();
        if (!guess) return;
        document.getElementById('guessDiv')?.remove();
        await update(ref(db, 'rooms/'+rid), { phase: 'finished' });
        showMessage(`🔍 الجاسوس (${ap[si]?.name}) كتب: ${guess}\n🔑 الكلمة الصحيحة: ${sw}\n🏆 انتهت اللعبة`, true);
        await set(ref(db, 'rooms/'+rid+'/msg'), { html: `🔍 الجاسوس (${ap[si]?.name}) كتب: ${guess}\n🔑 الكلمة الصحيحة: ${sw}\n🏆 انتهت اللعبة`, target: 'all' });
    };

    function showSpyOptions() {
        let other = w.filter(word => word !== sw);
        let picks = [sw];
        for(let i=0;i<9;i++) picks.push(other[Math.floor(Math.random()*other.length)]);
        picks.sort(()=>Math.random()-0.5);
        let btns = '';
        picks.forEach(p => btns += `<button class="guess-btn" onclick="window.submitChoiceGuess('${p.replace(/'/g,"\\'")}')">${p}</button>`);
        let d = document.createElement('div');
        d.className = 'overlay';
        d.innerHTML = `<div class="overlay-box"><h3>🤔 اختر الكلمة الصحيحة</h3><div class="guess-buttons">${btns}</div><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️</button></div>`;
        document.body.appendChild(d);
    }

    window.submitChoiceGuess = async function(guess) {
        document.querySelector('.overlay')?.remove();
        await update(ref(db, 'rooms/'+rid), { phase: 'finished' });
        showMessage(`🔍 الجاسوس (${ap[si]?.name}) اختار: ${guess}\n🔑 الكلمة الصحيحة: ${sw}\n🏆 انتهت اللعبة`, true);
        await set(ref(db, 'rooms/'+rid+'/msg'), { html: `🔍 الجاسوس (${ap[si]?.name}) اختار: ${guess}\n🔑 الكلمة الصحيحة: ${sw}\n🏆 انتهت اللعبة`, target: 'all' });
    };

    async function endGameLowPlayers(spyName, word) {
        if (ph === 'finished') return;
        ph = 'finished';
        showMessage(`⚠️ انتهت اللعبة لان عدد اللاعبين 2 فقط\n🕵️ الجاسوس الحقيقي: ${spyName}\n🔑 الكلمة: ${word}\n🎉 الجاسوس كسب`, true);
        await update(ref(db, 'rooms/'+rid), { phase: 'finished', active: false });
    }

    window.startGame = async function() {
        let players = (await get(ref(db, 'rooms/'+rid+'/players'))).val() || {};
        let ids = Object.keys(players);
        if ((gm === 'normal' && ids.length < 2) || (gm === 'multi' && ids.length < 3)) return showMessage(`⚠️ يحتاج ${gm==='normal'?2:3} لاعبين`);
        let spy = ids[Math.floor(Math.random()*ids.length)];
        let word = w[Math.floor(Math.random()*w.length)];
        await update(ref(db, 'rooms/'+rid), { phase: 'playing', si: spy, sw: word, vr: {}, vl: {} });
        for(let id of ids) await update(ref(db, 'rooms/'+rid+'/players/'+id), { eliminated: false });
        showMessage("🎮 بدأت اللعبة!");
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-show-vote').style.display = 'inline-block';
    };

    window.showVoting = function() { update(ref(db, 'rooms/'+rid), { phase: 'voting' }); };
    window.copyLink = function() { navigator.clipboard.writeText(document.getElementById('link-text').innerText); showMessage("📋 تم نسخ الرابط"); document.getElementById('room-link').style.display = 'none'; };
    window.leaveRoom = function() { if(voteInterval) clearInterval(voteInterval); if(mid && rid) { if(ih) remove(ref(db, 'rooms/'+rid)); else remove(ref(db, 'rooms/'+rid+'/players/'+mid)); } location.reload(); };

    let activeMsgDiv = null;
    function showMessage(msg, permanent = false) {
        if (activeMsgDiv) activeMsgDiv.remove();
        let div = document.createElement('div');
        div.className = 'overlay';
        div.innerHTML = `<div class="overlay-box">${msg.replace(/\n/g,'<br>')}<br><button class="close-btn" onclick="this.closest('.overlay').remove(); activeMsgDiv=null;">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
        activeMsgDiv = div;
        if (!permanent) setTimeout(() => { if(activeMsgDiv === div) { div.remove(); activeMsgDiv = null; } }, 5000);
    }
</script>
</body>
</html>
