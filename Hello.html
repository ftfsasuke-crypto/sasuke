<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; --liar: #f59e0b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation; overflow: hidden; }
        
        .box-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #333; position: relative; }
        h1 { color: white; margin-bottom: 20px; font-size: 22px; text-align: center; }
        
        .game-btn { background: #111; border: 2px solid #333; color: white; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: block; text-align: center; text-decoration: none; border-color: #333; }
        .game-btn:active { background: #222; transform: scale(0.98); }
        
        .input-field { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #000; color: var(--accent); font-size: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .action-btn { background: var(--main); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: block; width: 100%; }
        .action-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .leave-btn { background: #333; border: 1px solid #555; color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        .panel { display: none; }
        .panel.active { display: block !important; }
        .players-list { background: #000; border: 1px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; }
        .player-item { padding: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        
        /* نظام الأنيميشن والتحميل */
        #anim-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .loader-ring { width: 80px; height: 80px; border: 5px solid #222; border-top: 5px solid var(--liar); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .gun-img { width: 150px; filter: drop-shadow(0 0 10px red); margin-bottom: 20px; }
        .fire-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; z-index: 1001; pointer-events: none; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0%, 100% { transform: translate(0, 0); } 10%, 30%, 50%, 70%, 90% { transform: translate(-10px, 0); } 20%, 40%, 60%, 80% { transform: translate(10px, 0); } }

        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .liar-card-btn { background: #222; border: 1px solid #444; color: white; padding: 10px 5px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .choice-container { display: flex; gap: 10px; margin-top: 20px; }
        .health-badge { background: #333; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--liar); font-weight: bold;}
    </style>
</head>
<body id="main-body">

<div class="box-container">
    <div id="p-main" class="panel active">
        <h1>🎮 اختار الغرفة</h1>
        <input type="text" id="host-input" class="input-field" placeholder="اسمك..." value="Sasuke">
        <button class="game-btn" onclick="startHost('naruto', 'ناروتو', 'guess')">🍥 من أنا؟ (ناروتو)</button>
        <button class="game-btn" onclick="startHost('liar', 'الكذابين', 'liar')" style="border-color: var(--liar)">🃏 لعبة الكذابين ☠️</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1 id="lobby-title">غرفة الانتظار</h1>
        <div id="invite-link" style="font-size: 9px; color: #666; margin-bottom: 10px; word-break: break-all; text-align: center;"></div>
        <button class="action-btn" onclick="copyLink()" style="background: #222; font-size: 14px;">📋 نسخ الرابط</button>
        <div class="players-list" id="h-list"></div>
        <button class="action-btn" id="start-btn" onclick="gameLaunch()" disabled>🚀 ابدأ اللعبة</button>
        <button class="leave-btn" onclick="location.reload()">🚪 إغلاق</button>
    </div>

    <div id="p-join" class="panel">
        <h1>👋 أهلاً بك</h1>
        <input type="text" id="guest-input" class="input-field" placeholder="اكتب اسمك...">
        <button class="action-btn" onclick="joinRoomAction()">دخول الغرفة 🚪</button>
    </div>

    <div id="p-wait" class="panel">
        <h1>⏳ انتظار الهوست...</h1>
        <div class="players-list" id="g-list"></div>
        <button class="leave-btn" onclick="location.reload()">🚪 مغادرة</button>
    </div>

    <div id="p-liar" class="panel">
        <h2 id="turn-display" style="color: var(--liar); text-align: center; font-size: 18px;">دور: ...</h2>
        <div style="background: #222; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px;">
            المطلوب: <span id="liar-req" style="color: var(--liar); font-weight: bold;">...</span>
        </div>
        <div class="players-list" id="liar-list"></div>
        
        <div id="my-turn-controls" style="display: none;">
            <p style="text-align: center; font-size: 14px; margin: 0 0 10px;">اختر ورقة لتلعبها:</p>
            <div class="card-grid" id="my-hand"></div>
        </div>

        <div id="decision-controls" style="display: none;">
            <p style="text-align: center; font-size: 14px; margin-bottom: 10px;">اللاعب السابق لعب ورقة.. ماذا ستفعل؟</p>
            <div class="choice-container">
                <button class="action-btn" style="background: var(--fail);" onclick="liarMove('call')">كاذب! 🤬</button>
                <button class="action-btn" style="background: var(--accent);" onclick="liarMove('continue')">اكمل! ✅</button>
            </div>
        </div>
    </div>
</div>

<div id="anim-overlay">
    <div id="loader-part">
        <div class="loader-ring"></div>
        <h2 id="anim-msg" style="font-size: 20px;">جاري التحقق...</h2>
        <h1 id="anim-timer" style="font-size: 40px; color: var(--liar);">3</h1>
    </div>
    <div id="gun-part" style="display: none;">
        <div class="gun-img">🔫</div>
        <h2 style="color: var(--fail); font-size: 24px;">خسرت المواجهة!</h2>
        <h1 id="gun-timer" style="font-size: 50px;">3</h1>
    </div>
</div>
<div class="fire-flash" id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

<script>
    let client, myName, roomId, isHost = false, players = [], mode = '', cat = '';
    let currentLiarState = {};

    // وظيفة الأصوات (أضف روابط الملفات إذا توفرت)
    function playSfx(type) {
        try {
            const audio = new Audio();
            if(type === 'click') audio.src = ''; // رابط صوت ضغطة
            if(type === 'shot') audio.src = '';  // رابط صوت طلقة
            audio.play().catch(e => {});
        } catch(e) {}
    }

    function changeUI(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) { roomId = urlParams.get('room'); changeUI('p-join'); }

    function updateLists() {
        let html = "";
        players.forEach(p => html += `<div class="player-item"><span>${decodeURIComponent(p.name)}</span><span style="color:var(--accent)">●</span></div>`);
        ["h-list", "g-list"].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = html; });
        if(isHost) document.getElementById('start-btn').disabled = (players.length < 3 || players.length > 5);
    }

    function startHost(c, n, m) {
        isHost = true; mode = m; cat = c;
        myName = encodeURIComponent((document.getElementById('host-input').value || "Sasuke") + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        document.getElementById('invite-link').innerText = window.location.origin + window.location.pathname + "?room=" + roomId;
        players = [{name: myName}]; updateLists(); changeUI('p-lobby');
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => client.subscribe('sasuke_' + roomId));
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(isHost && d.type === 'join' && players.length < 5) {
                if(!players.find(p => p.name === d.name)) {
                    players.push({name: d.name}); updateLists();
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: mode}));
                }
            }
            if(d.type === 'liar_act') handleLiarLogic(d);
        });
    }

    function joinRoomAction() {
        let n = document.getElementById('guest-input').value; if(!n) return alert("اكتب اسمك");
        myName = encodeURIComponent(n);
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('sasuke_' + roomId);
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
            changeUI('p-wait');
        });
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(d.type === 'sync') { players = d.players; updateLists(); }
            if(d.type === 'liar_start' || d.type === 'liar_sync') { updateLiarUI(d.state); }
            if(d.type === 'anim') { startAnim(d.msg, d.sec, d.next); }
            if(d.type === 'gun') { startGunAnim(d.target, d.hits); }
        });
    }

    function gameLaunch() {
        let deck = [];
        let counts = players.length === 5 ? [7,7,7,3] : (players.length === 4 ? [6,6,6,3] : [4,4,4,2]);
        ['King','Ace','Queen'].forEach((v, i) => { for(let j=0; j<counts[i]; j++) deck.push(v); });
        for(let j=0; j<counts[3]; j++) deck.push('Joker');
        deck.sort(() => 0.5 - Math.random());

        let s = { turn: 0, req: ['King','Ace','Queen'][Math.floor(Math.random()*3)], last: null, phase: 'play', hands: {}, stats: {} };
        players.forEach(p => { s.hands[p.name] = []; s.stats[p.name] = {h:0, d:false}; });
        let i = 0; while(deck.length) { s.hands[players[i%players.length].name].push(deck.pop()); i++; }
        client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_start', state: s}));
    }

    function updateLiarUI(s) {
        currentLiarState = s; changeUI('p-liar');
        document.getElementById('turn-display').innerText = "دور: " + decodeURIComponent(players[s.turn].name);
        document.getElementById('liar-req').innerText = s.req;
        
        let h = ""; players.forEach((p, i) => {
            let st = s.stats[p.name];
            h += `<div class="player-item ${st.d?'dead':''}"><span><span class="health-badge">${st.h}/6</span> ${decodeURIComponent(p.name)}</span><span>${i===s.turn?'👈':''}</span></div>`;
        });
        document.getElementById('liar-list').innerHTML = h;

        let isMyTurn = (players[s.turn].name === myName && !s.stats[myName].d);
        document.getElementById('my-turn-controls').style.display = (isMyTurn && s.phase === 'play') ? 'block' : 'none';
        document.getElementById('decision-controls').style.display = (isMyTurn && s.phase === 'decision') ? 'block' : 'none';
        
        let cards = ""; (s.hands[myName] || []).forEach(c => { 
            cards += `<button class="liar-card-btn" onclick="liarMove('play','${c}')">${c}</button>`; 
        });
        document.getElementById('my-hand').innerHTML = cards || "انتهى ورقك!";
    }

    function handleLiarLogic(d) {
        if(!isHost) return;
        let s = currentLiarState;
        if(d.act === 'play') {
            let h = s.hands[d.n]; h.splice(h.indexOf(d.c), 1);
            s.last = {n: d.n, c: d.c}; s.phase = 'wait';
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: "جاري التحميل...", sec: 3}));
            setTimeout(() => {
                s.phase = 'decision';
                s.turn = (s.turn + 1) % players.length;
                while(s.stats[players[s.turn].name].d) s.turn = (s.turn + 1) % players.length;
                client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
            }, 3000);
        } 
        else if(d.act === 'continue') {
            s.phase = 'play';
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
        }
        else if(d.act === 'call') {
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: "جاري كشف الكذب...", sec: 4}));
            setTimeout(() => {
                let wasLying = (s.last.c !== s.req && s.last.c !== 'Joker');
                let victim = wasLying ? s.last.n : d.n;
                let msg = wasLying ? "طلع كذاب فعلاً! 😂" : "للآسف هو طلع صادق 😱";
                client.publish('sasuke_' + roomId, JSON.stringify({type: 'anim', msg: msg, sec: 4}));
                
                setTimeout(() => {
                    s.stats[victim].h++;
                    let died = (s.stats[victim].h >= 6 || Math.random() < 0.1);
                    if(died) s.stats[victim].d = true;
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'gun', target: victim, hits: s.stats[victim].h}));
                    
                    setTimeout(() => {
                        s.phase = 'play'; s.last = null;
                        s.req = ['King','Ace','Queen'][Math.floor(Math.random()*3)];
                        client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
                    }, 8000);
                }, 4000);
            }, 4000);
        }
    }

    function startAnim(msg, sec, next) {
        playSfx('click');
        const overlay = document.getElementById('anim-overlay');
        const msgEl = document.getElementById('anim-msg');
        const timerEl = document.getElementById('anim-timer');
        document.getElementById('loader-part').style.display = 'block';
        document.getElementById('gun-part').style.display = 'none';
        overlay.style.display = 'flex';
        msgEl.innerText = msg;
        let count = sec; timerEl.innerText = count;
        let interval = setInterval(() => {
            count--; timerEl.innerText = count;
            if(count <= 0) { clearInterval(interval); overlay.style.display = 'none'; }
        }, 1000);
    }

    function startGunAnim(target, hits) {
        if(myName !== target) return;
        const overlay = document.getElementById('anim-overlay');
        document.getElementById('loader-part').style.display = 'none';
        document.getElementById('gun-part').style.display = 'block';
        overlay.style.display = 'flex';
        let count = 3; document.getElementById('gun-timer').innerText = count;
        let interval = setInterval(() => {
            count--; document.getElementById('gun-timer').innerText = count;
            if(count <= 0) {
                clearInterval(interval);
                // تأثير الطلقة
                document.getElementById('main-body').classList.add('shake');
                document.getElementById('flash').style.opacity = '1';
                playSfx('shot');
                setTimeout(() => {
                    document.getElementById('flash').style.opacity = '0';
                    document.getElementById('main-body').classList.remove('shake');
                    document.getElementById('gun-part').innerHTML = `<h2>حظك حلو لم تمت بعد!<br>فاضلك ${6-hits} مرات كمان<br>ركز ولا تخاطر</h2>`;
                    setTimeout(() => overlay.style.display = 'none', 4000);
                }, 200);
            }
        }, 1000);
    }

    function liarMove(a, c) { client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_act', act: a, c: c, n: myName})); }
    function copyLink() { navigator.clipboard.writeText(document.getElementById('invite-link').innerText); alert("تم النسخ!"); }
</script>
</body>
</html>
