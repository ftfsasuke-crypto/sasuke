<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub2Unlock Pro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f0f0f; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; display: none; }
        h3 { margin-top: 0; color: #ff0000; font-size: 24px; }
        p { color: #aaa; font-size: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-gen { background-color: #ff0000; color: white; }
        .result { margin-top: 20px; padding: 15px; background: #27ae60; border-radius: 8px; display: none; word-break: break-all; color: white; cursor: pointer; }
        
        /* أزرار واجهة المشاهد */
        .btn-sub { background-color: #ff0000; color: white; }
        .btn-like { background-color: #0056b3; color: white; }
        .btn-unlock { background-color: #444; color: #888; cursor: not-allowed; }
        .btn-unlock.enabled { background-color: #2ecc71; color: white; cursor: pointer; }
        .active { display: block !important; }
    </style>
</head>
<body>

<!-- 1. واجهة المولد (تظهر لك أنت فقط) -->
<div id="generator" class="box">
    <h3>لوحة تحكم MX_SASUKE</h3>
    <p>أدخل تفاصيل الرابط الجديد</p>
    <input type="text" id="fileName" placeholder="عنوان الملف (مثال: تحميل السكنات)">
    <input type="text" id="channelUrl" placeholder="رابط قناتك">
    <input type="text" id="videoUrl" placeholder="رابط الفيديو (للايك)">
    <input type="text" id="targetUrl" placeholder="رابط التحميل النهائي">
    <button class="btn-gen" onclick="generateLink()">إنشاء الرابط وتخصيصه</button>
    <div id="finalLink" class="result" onclick="copyText()"></div>
</div>

<!-- 2. واجهة المشاهد (تظهر لمن يضغط على الرابط) -->
<div id="viewer" class="box">
    <h3 id="displayFileName">فتح المحتوى</h3>
    <p>نفذ المهام بالأسفل لفتح الرابط مباشرة</p>
    <button class="btn-sub" id="subBtn" onclick="doTask('sub')">1. إشترك في القناة</button>
    <button class="btn-like" id="likeBtn" onclick="doTask('like')">2. لايك للمقطع</button>
    <button id="unlockBtn" class="btn-unlock" disabled>3. خذ الرابط الآن</button>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const n = urlParams.get('n'); // اسم الملف
    const s = urlParams.get('s'); // قناة
    const l = urlParams.get('l'); // لايك
    const t = urlParams.get('t'); // رابط التحميل

    // فحص: هل المستخدم مشاهد أم صانع؟
    if (s && t) {
        document.getElementById('viewer').classList.add('active');
        if(n) document.getElementById('displayFileName').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('generator').classList.add('active');
    }

    function generateLink() {
        const name = document.getElementById('fileName').value;
        const sub = document.getElementById('channelUrl').value;
        const like = document.getElementById('videoUrl').value;
        const target = document.getElementById('targetUrl').value;
        
        if(!sub || !target) return alert("رابط القناة والتحميل ضروريين!");

        const base = window.location.href.split('?')[0];
        const final = `${base}?n=${btoa(encodeURIComponent(name))}&s=${btoa(sub)}&l=${btoa(like)}&t=${btoa(target)}`;
        
        const resDiv = document.getElementById('finalLink');
        resDiv.innerText = final;
        resDiv.style.display = 'block';
    }

    function copyText() {
        navigator.clipboard.writeText(document.getElementById('finalLink').innerText);
        alert("تم نسخ الرابط! انشره الآن.");
    }

    let tasks = { sub: false, like: false };
    function doTask(type) {
        if (type === 'sub') { window.open(atob(s), '_blank'); tasks.sub = true; }
        else if (type === 'like') { window.open(atob(l), '_blank'); tasks.like = true; }

        if (tasks.sub && (l ? tasks.like : true)) {
            setTimeout(() => {
                const ub = document.getElementById('unlockBtn');
                ub.disabled = false;
                ub.classList.add('enabled');
                ub.innerText = "اذهب للرابط جاهز ✅";
                ub.onclick = () => window.location.href = atob(t);
            }, 2000);
        }
    }
</script>
</body>
</html>
