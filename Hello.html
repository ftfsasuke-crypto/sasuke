<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<style>
body{
margin:0;
font-family:Tajawal, sans-serif;
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:rgba(0,0,0,0.4);
padding:30px;
border-radius:20px;
text-align:center;
width:90%;
max-width:400px;
}

button{
padding:14px 25px;
border:none;
border-radius:25px;
margin:10px;
cursor:pointer;
background:linear-gradient(45deg,#ff00cc,#3333ff);
color:white;
font-size:18px;
}

input{
padding:12px;
width:80%;
border-radius:15px;
border:none;
text-align:center;
margin:10px;
}

.hidden{display:none}

.player{
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:10px;
margin:5px;
}
</style>
</head>

<body>

<div class="box">

<h2>👑 SASUKE 👑</h2>

<button id="createBtn">🎮 لعبة الجاسوس 1</button>
<button id="copyBtn" class="hidden">📋 نسخ الرابط</button>

<div id="joinBox" class="hidden">
<h3>✍️ اكتب اسمك</h3>
<input id="nameInput" placeholder="اسمك">
<button id="joinBtn">🚪 انضم</button>
</div>

<div id="roomBox" class="hidden">
<h3>اللاعبين:</h3>
<div id="players"></div>
<button id="startBtn">🚀 بدء اللعبة</button>
<button id="leaveBtn">🚪 مغادرة</button>
</div>

</div>

<!-- ⚠️ مهم جداً: خلي السكريبت عادي مش module -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
authDomain: "spy-game-1d774.firebaseapp.com",
databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com",
projectId: "spy-game-1d774"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let roomId = new URLSearchParams(location.search).get("room");
let playerId = localStorage.getItem("playerId") || ("p"+Date.now());
localStorage.setItem("playerId", playerId);

const createBtn = document.getElementById("createBtn");
const copyBtn = document.getElementById("copyBtn");
const joinBox = document.getElementById("joinBox");
const joinBtn = document.getElementById("joinBtn");
const nameInput = document.getElementById("nameInput");
const roomBox = document.getElementById("roomBox");
const playersDiv = document.getElementById("players");
const startBtn = document.getElementById("startBtn");
const leaveBtn = document.getElementById("leaveBtn");

function show(el){el.classList.remove("hidden")}
function hide(el){el.classList.add("hidden")}

/* ========== إنشاء غرفة ========== */
createBtn.onclick = function(){
roomId = "r"+Date.now();

db.ref("rooms/"+roomId).set({
started:false,
players:{
[playerId]:{name:"👑 SASUKE 👑"}
}
});

hide(createBtn);
show(copyBtn);
show(roomBox);

copyBtn.onclick = function(){
navigator.clipboard.writeText(location.origin+location.pathname+"?room="+roomId);
copyBtn.style.display="none";
alert("تم نسخ الرابط");
};

listenPlayers();
};

/* ========== دخول ========== */
if(roomId){
hide(createBtn);
show(joinBox);
}

joinBtn.onclick = function(){
let name = nameInput.value.trim();
if(!name) return alert("اكتب اسمك");

db.ref("rooms/"+roomId).once("value",snap=>{
if(!snap.exists()) return alert("الغرفة مش موجودة");
if(snap.val().started) return alert("اللعبة بدأت");

db.ref("rooms/"+roomId+"/players/"+playerId).set({
name:name
});

/* خروج تلقائي */
db.ref("rooms/"+roomId+"/players/"+playerId).onDisconnect().remove();

hide(joinBox);
show(roomBox);

listenPlayers();
});
};

/* ========== عرض اللاعبين ========== */
function listenPlayers(){
db.ref("rooms/"+roomId+"/players").on("value",snap=>{
let data = snap.val() || {};
playersDiv.innerHTML="";
Object.values(data).forEach(p=>{
let div=document.createElement("div");
div.className="player";
div.innerText=p.name;
playersDiv.appendChild(div);
});
});
}

/* ========== بدء اللعبة ========== */
startBtn.onclick = function(){
db.ref("rooms/"+roomId+"/players").once("value",snap=>{
let players = snap.val();
if(Object.keys(players).length < 3){
alert("لازم 3 لاعبين");
return;
}
db.ref("rooms/"+roomId+"/started").set(true);
alert("🔥 بدأت اللعبة");
});
};

/* ========== مغادرة ========== */
leaveBtn.onclick = function(){
db.ref("rooms/"+roomId+"/players/"+playerId).remove();
alert("غادرت");
location.href = location.pathname;
};
</script>

</body>
</html>
