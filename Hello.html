<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub | Neon Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
        <style>
        :root { --bg: #0a0a0f; --card: rgba(20, 20, 25, 0.7); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: #0a0a0f;
            background-image: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0a1a2e 0%, transparent 60%);
            color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; 
        }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: fall linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
        .box-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.7); position: relative; z-index: 10; }
        h1 { color: white; margin-bottom: 25px; font-size: 24px; text-align: center; }
        .input-field { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; font-family: 'Cairo'; }
        .action-btn { color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s; display: block; text-align: center; text-decoration: none; }
        .btn-orange { background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%); }
        .btn-purple { background: linear-gradient(135deg, #b224ef 0%, #7579ff 100%); }
        .btn-gold { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #000; }
        .btn-red { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .btn-ghost { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #ccc; }
        .panel { display: none; }
        .panel.active { display: block !important; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* استايل قائمة اللاعبين */
        .players-list { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; margin: 15px 0; min-height: 50px; border: 1px dashed rgba(255,255,255,0.1); }
    </style>
</head>
<body>
<div class="stars-container" id="stars"></div>
<div class="box-container">
    <div id="p-main" class="panel active">
        <h1>🎮 الألعاب</h1>
        <input type="text" id="user-name" class="input-field" placeholder="اكتب اسمك..." value="Sasuke">
        <button class="action-btn btn-gold" onclick="changeUI('p-liar')">🃏 لعبة الكذابين ☠️</button>
        <button class="action-btn btn-purple" onclick="changeUI('p-imposter')">🕵️‍♂️ لعبة الجاسوس ➡️</button>
    </div>

    <div id="p-imposter" class="panel">
        <h1>🕵️‍♂️ تصنيفات الجاسوس</h1>
        <button class="action-btn btn-orange" onclick="startLobby('أكلات')">🍕 أكلات</button>
        <button class="action-btn btn-purple" onclick="startLobby('حيوانات')">🦁 حيوانات</button>
        <button class="action-btn btn-ghost" onclick="changeUI('p-main')">رجوع 🔙</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1 id="lobby-title">🛰️ غرفة الانتظار</h1>
        <p style="font-size: 14px; color: #fda085;">التصنيف: <span id="selected-cat">...</span></p>
        <div class="players-list" id="p-list">
            <div style="padding: 5px;">👤 Sasuke (أنت)</div>
        </div>
        <button class="action-btn btn-red" onclick="alert('تحتاج لاعبين آخرين للبدء!')">🚀 إطلاق اللعبة</button>
        <button class="action-btn btn-ghost" onclick="changeUI('p-imposter')">إلغاء ❌</button>
    </div>

    <div id="p-liar" class="panel">
        <h1>🃏 لعبة الكذابين</h1>
        <p>جاري التطوير...</p>
        <button class="action-btn btn-ghost" onclick="changeUI('p-main')">رجوع 🔙</button>
    </div>
</div>
<script>
    function createStars() {
        const container = document.getElementById('stars');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(star);
        }
    }

    function changeUI(panelId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(panelId);
        if (target) target.classList.add('active');
    }

    // وظيفة جديدة للدخول لغرفة الانتظار
    function startLobby(category) {
        const name = document.getElementById('user-name').value;
        if(!name) { alert('اكتب اسمك الأول!'); return; }
        
        document.getElementById('selected-cat').innerText = category;
        changeUI('p-lobby');
    }

    window.onload = () => {
        createStars();
        changeUI('p-main'); 
    };
</script>
</body>
</html>
