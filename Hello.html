<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub | VIP Neon</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --card: rgba(20, 20, 25, 0.7); --liar: #f59e0b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg);
            background-image: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, #0a1a2e 0%, transparent 60%);
            color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation; overflow: hidden; 
        }

        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: fall linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
        
        .lang-switch { position: fixed; top: 20px; inset-inline-end: 20px; background: #1a1a1c; border-radius: 20px; padding: 4px; display: flex; z-index: 1000; border: 1px solid rgba(255,255,255,0.1); }
        .lang-btn { padding: 5px 15px; border-radius: 16px; color: #888; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .lang-btn.active { background: #ff0000; color: white; }

        #host-menu-btn { display: none; position: fixed; top: 20px; inset-inline-start: 20px; background: rgba(0,0,0,0.6); border: 1px solid #ff512f; color: white; padding: 8px 15px; border-radius: 20px; cursor: pointer; z-index: 1000; font-weight: bold; }
        #host-sidebar { position: fixed; top: 0; inset-inline-start: -300px; width: 260px; height: 100vh; background: rgba(10, 10, 15, 0.98); backdrop-filter: blur(10px); border-inline-end: 1px solid rgba(255,255,255,0.1); z-index: 1001; transition: 0.4s; padding: 20px; }
        #host-sidebar.open { inset-inline-start: 0; }
        
        .box-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); box-shadow: 0 20px 50px rgba(0,0,0,0.7); position: relative; z-index: 10; }
        h1 { color: white; margin-bottom: 25px; font-size: 24px; text-align: center; }

        .input-field { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; }

        .action-btn { color: white; border: none; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: block; text-align: center; transition: 0.3s; }
        .btn-orange { background: linear-gradient(135deg, #ff512f 0%, #dd2476 100%); }
        .btn-red { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); }
        .btn-green { background: linear-gradient(135deg, #0ba360 0%, #3cba92 100%); }
        .btn-blue { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); }
        .btn-purple { background: linear-gradient(135deg, #b224ef 0%, #7579ff 100%); }
        .btn-gold { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #000; }
        .btn-ghost { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #ccc; }
        .action-btn:disabled { background: #333; opacity: 0.5; cursor: not-allowed; }

        .panel { display: none; }
        .panel.active { display: block !important; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .players-list { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 10px; margin-bottom: 20px; max-height: 180px; overflow-y: auto; }
        .player-item { padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; margin-bottom: 15px; }
        .liar-card-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px 5px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .liar-card-btn.selected { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); color: #000; transform: translateY(-6px); }

        #anim-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 8, 0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader-ring { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #f59e0b; border-radius: 50%; animation: spin 1s infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .fire-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ff0000; opacity: 0; z-index: 1001; pointer-events: none; }
    </style>
</head>
<body id="main-body">

<div class="stars-container" id="stars"></div>

<div class="lang-switch">
    <div class="lang-btn active" id="btn-ar" onclick="setLang('ar')">AR</div>
    <div class="lang-btn" id="btn-en" onclick="setLang('en')">EN</div>
</div>

<button id="host-menu-btn" onclick="toggleHostMenu()" data-tr="hostMenu">⚙️ الإدارة</button>

<div id="host-sidebar">
    <h3 style="color: white; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 30px;" data-tr="managePlayers">إدارة اللاعبين</h3>
    <div id="sidebar-players-list" style="margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
    <button class="action-btn btn-ghost" onclick="toggleHostMenu()" data-tr="closeMenu">إغلاق</button>
</div>

<div class="box-container">
    <div id="p-main" class="panel">
        <h1 data-tr="gamesTitle">🎮 الألعاب</h1>
        <input type="text" id="host-input" class="input-field" data-tr-ph="namePh" placeholder="اكتب اسمك..." value="Sasuke">
        <button class="action-btn btn-gold" onclick="startHost('liar', 'liarTitle', 'liar')">🃏 <span data-tr="liarBtn">لعبة الكذابين ☠️</span></button>
        <button class="action-btn btn-purple" onclick="changeUI('p-imposter')">🕵️‍♂️ <span data-tr="impBtn">لعبة الجاسوس ➡️</span></button>
    </div>

    <div id="p-imposter" class="panel">
        <h1 data-tr="impCatsTitle">🕵️‍♂️ تصنيفات الجاسوس</h1>
        <div style="max-height: 350px; overflow-y: auto; padding-right: 5px;">
            <button class="action-btn btn-orange" onclick="startHost('food', 'catFood', 'imposter')">🍕 <span data-tr="catFood">أكلات</span></button>
            <button class="action-btn btn-green" onclick="startHost('animals', 'catAnimals', 'imposter')">🦁 <span data-tr="catAnimals">حيوانات</span></button>
            <button class="action-btn btn-blue" onclick="startHost('countries', 'catCountries', 'imposter')">🌍 <span data-tr="catCountries">دول وأماكن</span></button>
            <button class="action-btn btn-purple" onclick="startHost('jobs', 'catJobs', 'imposter')">👨‍⚕️ <span data-tr="catJobs">مهن ووظائف</span></button>
        </div>
        <button class="action-btn btn-ghost" onclick="changeUI('p-main')" style="margin-top: 10px;" data-tr="backBtn">رجوع 🔙</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1 data-tr="lobbyTitle">🛰️ غرفة الانتظار</h1>
        <button class="action-btn btn-ghost" onclick="copyLink()" data-tr="copyLinkBtn">📋 نسخ الرابط</button>
        <div class="players-list" id="h-list"></div>
        <button class="action-btn btn-red" id="start-btn" onclick="gameLaunch()" disabled data-tr="startBtn">🚀 إطلاق اللعبة</button>
        <button id="cancel-room-btn" class="action-btn btn-ghost" onclick="exitGame()" data-tr="cancelBtn">إلغاء ❌</button>
    </div>

    <div id="p-join" class="panel">
        <h1 data-tr="joinTitle">🛸 بدء اللعبة</h1>
        <input type="text" id="guest-input" class="input-field" data-tr-ph="guestPh" placeholder="اكتب اسمك...">
        <button class="action-btn btn-orange" onclick="joinRoomAction()" data-tr="joinBtn">انضمام 🚪</button>
    </div>

    <div id="p-wait" class="panel">
        <h1 data-tr="waitTitle">⏳ جاري الانتظار...</h1>
        <div class="players-list" id="g-list"></div>
    </div>

    <div id="p-expired" class="panel" style="text-align: center;">
        <h1 style="font-size: 80px; margin-bottom: 10px;">⏳</h1>
        <h2 style="color: #ef4444;" data-tr="expiredTitle">انتهت صلاحية الرابط!</h2>
        <p style="color: #ccc; margin-bottom: 25px;" data-tr="expiredMsg">هذه الغرفة لم تعد متاحة.</p>
        <button class="action-btn btn-ghost" onclick="location.href=location.pathname" data-tr="backBtn">العودة للرئيسية 🔙</button>
    </div>

    <div id="p-imp-game" class="panel">
        <div id="imp-role-title" style="text-align:center; font-size:18px;">...</div>
        <div id="imp-my-word" style="background:rgba(0,0,0,0.6); border:2px dashed #b224ef; border-radius:15px; padding:20px; margin:15px 0; font-size:24px; font-weight:bold; text-align:center;"></div>
        <div id="imp-timer-sec" style="text-align:center;">
            <h1 id="imp-countdown" style="font-size:50px; color:#0ba360;">10:00</h1>
            <button id="host-skip-btn" class="action-btn btn-red" style="display:none; width:60%; margin:10px auto;" onclick="skipTimer()" data-tr="skipTimerBtn">تخطي الوقت ⏩</button>
        </div>
        <div id="imp-vote-sec" style="display:none;">
            <p id="live-vote-counter" style="text-align:center; color:#0ba360; font-weight:bold;"></p>
            <div id="imp-vote-list" style="display:flex; flex-direction:column; gap:8px;"></div>
            <button id="host-force-vote-btn" class="action-btn btn-red" style="display:none; width:60%; margin:10px auto;" onclick="forceEndVote()" data-tr="forceVoteBtn">إنهاء التصويت 🏁</button>
        </div>
        <div id="imp-guess-sec" style="display:none; text-align:center;">
            <h3 id="imp-status-msg" style="color:#fda085;"></h3>
            <div id="imp-input-area" style="display:none;">
                <input type="text" id="imp-word-guess" class="input-field" placeholder="الكلمة هي...">
                <button class="action-btn btn-purple" onclick="submitImpGuess()" data-tr="confirmBtn">تأكيد</button>
            </div>
        </div>
        <div id="imp-end-sec" style="display:none; text-align:center;">
            <h2 id="imp-final-title"></h2>
            <p>الكلمة: <span id="imp-real-word" style="color:#00c6ff;"></span></p>
            <button class="action-btn btn-ghost" style="margin-top:15px;" onclick="exitGame()" data-tr="exitBtn">انسحاب 🚪</button>
        </div>
    </div>
</div>

<div id="anim-overlay">
    <div class="loader-ring"></div>
    <h2 id="anim-msg">...</h2>
    <h1 id="anim-timer">3</h1>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script>
    let isGuestFlow = new URLSearchParams(window.location.search).has('room');
    let lang = 'ar';
    let client, myName, roomId, isHost = false, players = [], mode = '', cat = '', impState = { phase: 'timer', votes: {} }, timerInterval, joinTimeout;

    const tr = {
        ar: {
            gamesTitle: "🎮 الألعاب", namePh: "اكتب اسمك...", liarBtn: "لعبة الكذابين ☠️", impBtn: "لعبة الجاسوس ➡️",
            lobbyTitle: "🛰️ غرفة الانتظار", startBtn: "🚀 إطلاق اللعبة", cancelBtn: "إلغاء ❌",
            joinTitle: "🛸 بدء اللعبة", guestPh: "اكتب اسمك...", joinBtn: "انضمام 🚪", waitTitle: "⏳ جاري الانتظار...",
            secretWordTitle: "الكلمة السرية:", waitingVote: "في انتظار الباقين...",
            confirmBtn: "تأكيد", exitBtn: "انسحاب 🚪", voteFor: "تصويت لـ", backBtn: "رجوع 🔙",
            hostMenu: "⚙️ الإدارة", skipTimerBtn: "تخطي الوقت ⏩", forceVoteBtn: "إنهاء التصويت 🏁",
            expiredTitle: "انتهت صلاحية الرابط!", expiredMsg: "هذه الغرفة لم تعد متاحة.",
            online: "● متصل", kickBtn: "طرد 🥾", managePlayers: "إدارة اللاعبين", closeMenu: "إغلاق"
        },
        en: {
            gamesTitle: "🎮 Games", namePh: "Enter your name...", liarBtn: "Liar Game ☠️", impBtn: "Imposter Game ➡️",
            lobbyTitle: "🛰️ Lobby", startBtn: "🚀 Launch Game", cancelBtn: "Cancel ❌",
            joinTitle: "🛸 Start Game", guestPh: "Enter your name...", joinBtn: "Join 🚪", waitTitle: "⏳ Waiting...",
            secretWordTitle: "Secret Word:", waitingVote: "Waiting for votes...",
            confirmBtn: "Confirm", exitBtn: "Leave 🚪", voteFor: "Vote for", backBtn: "Back 🔙",
            hostMenu: "⚙️ Manage", skipTimerBtn: "Skip Time ⏩", forceVoteBtn: "Force Vote 🏁",
            expiredTitle: "Link Expired!", expiredMsg: "This room is no longer available.",
            online: "● Online", kickBtn: "Kick 🥾", managePlayers: "Manage Players", closeMenu: "Close"
        }
    };

    function t(key) { return tr[lang][key] || key; }

    function changeUI(id) {
        // حماية: منع الضيف من الرجوع لقائمة الهوست
        if (isGuestFlow && (id === 'p-main' || id === 'p-imposter')) return;
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function setLang(l) {
        lang = l; document.documentElement.dir = (l === 'ar') ? 'rtl' : 'ltr';
        document.getElementById('btn-ar').classList.toggle('active', l === 'ar');
        document.getElementById('btn-en').classList.toggle('active', l === 'en');
        document.querySelectorAll('[data-tr]').forEach(el => { el.innerHTML = t(el.getAttribute('data-tr')); });
        document.querySelectorAll('[data-tr-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-tr-ph')); });
    }

    function createStars() {
        const container = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = star.style.height = Math.random() * 3 + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.opacity = Math.random();
            container.appendChild(star);
        }
    }

    function startHost(c, nameKey, m) {
        isHost = true; mode = m; cat = c;
        myName = encodeURIComponent((document.getElementById('host-input').value || "Sasuke") + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        players = [{name: myName}]; updateLists(); changeUI('p-lobby');
        document.getElementById('host-menu-btn').style.display = 'block';
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('sasuke_' + roomId);
            // نبضة قلب فورية للضيوف
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'ping'}));
        });
        client.on('message', (topic, msg) => {
            let d = JSON.parse(msg.toString());
            if(d.type === 'join' && players.length < 10) {
                if(!players.find(p => p.name === d.name)) {
                    players.push({name: d.name}); updateLists();
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: mode}));
                }
            }
            if(d.type === 'imp_act') handleImpLogic(d);
        });
    }

    function joinRoomAction() {
        let n = document.getElementById('guest-input').value; if(!n) return;
        myName = encodeURIComponent(n); roomId = new URLSearchParams(window.location.search).get('room');
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('sasuke_' + roomId);
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
            changeUI('p-wait');
            // انتظار الهوست (12 ثانية لتجنب مشاكل النت البطئ)
            joinTimeout = setTimeout(() => { changeUI('p-expired'); client.end(); }, 12000);
        });
        client.on('message', (topic, msg) => {
            let d = JSON.parse(msg.toString());
            if(d.type === 'sync' || d.type === 'ping' || d.type === 'imp_start') clearTimeout(joinTimeout);
            if(d.type === 'room_closed') { changeUI('p-expired'); client.end(); }
            if(d.type === 'sync') { players = d.players; mode = d.mode; updateLists(); }
            if(d.type === 'imp_start') handleImpStart(d);
            if(d.type === 'imp_sync') updateImpUI(d.state);
            if(d.type === 'kick' && d.target === myName) { changeUI('p-kicked'); client.end(); }
        });
    }

    function updateLists() {
        let html = "", sideHtml = "";
        players.forEach(p => {
            html += `<div class="player-item"><span>${decodeURIComponent(p.name)}</span><span style="color:#0ba360;">●</span></div>`;
            if(isHost && p.name !== myName) sideHtml += `<div class="player-item"><span>${decodeURIComponent(p.name)}</span><button class="kick-btn-side" onclick="kickUser('${p.name}')">${t('kickBtn')}</button></div>`;
        });
        document.getElementById('h-list').innerHTML = document.getElementById('g-list').innerHTML = html;
        if(isHost) {
            document.getElementById('sidebar-players-list').innerHTML = sideHtml;
            document.getElementById('start-btn').disabled = (players.length < 3);
        }
    }

    function exitGame() {
        if(isHost && client) client.publish('sasuke_' + roomId, JSON.stringify({type: 'room_closed'}));
        setTimeout(() => location.href = location.pathname, 300);
    }

    function handleImpStart(d) {
        impState = d.state; changeUI('p-imp-game');
        let w = d.words[myName];
        document.getElementById('imp-my-word').innerText = (w === "IMP") ? (lang === 'ar' ? "أنت الجاسوس 🕵️‍♂️" : "You are the Spy") : w;
        document.getElementById('imp-role-title').innerText = (w === "IMP") ? t('impMission') : t('secretWordTitle');
        updateImpUI(impState);
        let endTime = Date.now() + 600000;
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if(impState.phase !== 'timer') return clearInterval(timerInterval);
            let tl = Math.round((endTime - Date.now()) / 1000);
            if(tl <= 0) { clearInterval(timerInterval); if(isHost) skipTimer(); }
            else { 
                let m = Math.floor(tl/60), s = (tl%60).toString().padStart(2,'0');
                document.getElementById('imp-countdown').innerText = `${m}:${s}`;
            }
        }, 500);
    }

    function skipTimer() { client.publish('sasuke_' + roomId, JSON.stringify({type: 'imp_act', act: 'skip_timer'})); }
    function castVote(target) { client.publish('sasuke_' + roomId, JSON.stringify({type: 'imp_act', act: 'vote', n: myName, target: target})); }
    function forceEndVote() { client.publish('sasuke_' + roomId, JSON.stringify({type: 'imp_act', act: 'force_vote'})); }

    function handleImpLogic(d) {
        if(!isHost) return;
        if(d.act === 'skip_timer') impState.phase = 'vote';
        if(d.act === 'vote') { impState.votes[d.n] = d.target; if(Object.keys(impState.votes).length === players.length) checkEndVote(); }
        if(d.act === 'force_vote') checkEndVote();
        client.publish('sasuke_' + roomId, JSON.stringify({type: 'imp_sync', state: impState}));
        updateImpUI(impState);
    }

    function checkEndVote() {
        let counts = {}; Object.values(impState.votes).forEach(v => counts[v] = (counts[v]||0)+1);
        let highest = Object.keys(counts).reduce((a,b) => counts[a] > counts[b] ? a : b, players[0].name);
        impState.caught = (highest === impState.imp); impState.phase = 'guess';
    }

    function updateImpUI(s) {
        impState = s;
        ['imp-timer-sec','imp-vote-sec','imp-guess-sec','imp-end-sec'].forEach(id => document.getElementById(id).style.display = 'none');
        if(s.phase === 'timer') { document.getElementById('imp-timer-sec').style.display = 'block'; document.getElementById('host-skip-btn').style.display = isHost ? 'block' : 'none'; }
        if(s.phase === 'vote') {
            document.getElementById('imp-vote-sec').style.display = 'block';
            document.getElementById('live-vote-counter').innerText = `(${Object.keys(s.votes).length}/${players.length})`;
            document.getElementById('imp-vote-list').style.display = s.votes[myName] ? 'none' : 'flex';
            document.getElementById('imp-wait-vote-msg').style.display = s.votes[myName] ? 'block' : 'none';
            document.getElementById('host-force-vote-btn').style.display = isHost ? 'block' : 'none';
            let vHtml = ""; players.forEach(p => { if(p.name !== myName) vHtml += `<button class="action-btn btn-ghost" onclick="castVote('${p.name}')">${t('voteFor')} ${decodeURIComponent(p.name)}</button>`; });
            document.getElementById('imp-vote-list').innerHTML = vHtml;
        }
        if(s.phase === 'guess') {
            document.getElementById('imp-guess-sec').style.display = 'block';
            document.getElementById('imp-status-msg').innerText = s.caught ? (lang === 'ar' ? "تم كشف الجاسوس!" : "Spy Caught!") : (lang === 'ar' ? "الجاسوس هرب!" : "Spy Escaped!");
            document.getElementById('imp-input-area').style.display = (myName === s.imp) ? 'block' : 'none';
        }
    }

    function gameLaunch() {
        if(!isHost) return;
        const words = ['بيتزا', 'برجر', 'مصر', 'اليابان', 'أسد', 'نمر'];
        let w = words[Math.floor(Math.random()*words.length)];
        let imp = players[Math.floor(Math.random()*players.length)].name;
        let assigned = {}; players.forEach(p => assigned[p.name] = (p.name === imp ? "IMP" : w));
        impState = { phase: 'timer', word: w, imp: imp, votes: {} };
        client.publish('sasuke_' + roomId, JSON.stringify({type: 'imp_start', words: assigned, state: impState}));
    }

    function kickUser(t) { if(confirm("طرد " + decodeURIComponent(t) + "?")) { client.publish('sasuke_' + roomId, JSON.stringify({type: 'kick', target: t})); players = players.filter(p => p.name !== t); updateLists(); client.publish('sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: mode})); } }
    function copyLink() { navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?room=" + roomId); alert("تم النسخ!"); }
    function toggleHostMenu() { document.getElementById('host-sidebar').classList.toggle('open'); }

    createStars(); setLang('ar');
    if(!isGuestFlow) document.getElementById('p-main').classList.add('active');
</script>
</body>
</html>
