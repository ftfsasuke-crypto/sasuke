<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX_SASUKE | Real Check</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 90%; max-width: 420px; text-align: center; padding: 20px 0; }
        
        .yt-logo { width: 50px; margin-bottom: 10px; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; word-wrap: break-word; line-height: 1.4; }
        
        .video-card { position: relative; width: 100%; border-radius: 15px; overflow: hidden; margin-bottom: 25px; border: 1px solid #333; cursor: pointer; background: #111; min-height: 180px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-card img { width: 100%; display: block; }
        
        .task-box { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; border: 2px solid transparent; text-align: right; cursor: pointer; transition: 0.3s; }
        .task-box.active { border-color: var(--main); }
        .task-box.done { border-color: var(--accent); cursor: default; }
        
        .task-info { flex-grow: 1; margin-right: 15px; }
        .task-info h4 { margin: 0; font-size: 16px; color: white; }
        .task-info p { margin: 5px 0 0; font-size: 12px; color: #94a3b8; }
        
        .step-num { width: 35px; height: 35px; background: #222; border: 2px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--main); transition: 0.3s; }
        .task-box.active .step-num { border-color: var(--main); background: rgba(255,0,0,0.1); }
        .task-box.done .step-num { background: var(--accent); color: white; border-color: var(--accent); }
        
        .checker-card { background: #0f0f10; border: 1px solid #222; border-radius: 15px; padding: 15px; margin-top: 20px; }
        #count-num { font-size: 32px; font-weight: bold; display: block; margin: 5px 0; }
        
        .verify-btn { background: var(--main); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: 0.3s; }
        .verify-btn:disabled { background: #1a1a1c; color: #555; cursor: not-allowed; }
        
        #error-msg { display: none; color: var(--fail); font-size: 13px; margin-top: 10px; font-weight: bold; }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
        .circle-timer { width: 60px; height: 60px; border: 5px solid #222; border-top: 5px solid var(--main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .final-btn { background: var(--accent); width: 100%; padding: 18px; border-radius: 12px; color: white; border: none; margin-top: 20px; font-weight: bold; font-size: 18px; display: none; cursor: pointer; }
        .gen-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #111; color: white; box-sizing: border-box; text-align: right; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

<div id="loader">
    <div class="circle-timer"></div>
    <h2 id="timer-text" style="font-size: 30px; margin: 20px 0;">جاري الفحص...</h2>
    <p>بنتأكد من تحديث اللايكات ⏳</p>
</div>

<div id="app" class="container"></div>

<script>
    const app = document.getElementById('app');
    const urlParams = new URLSearchParams(window.location.search);

    function safeEncode(str) { return btoa(encodeURIComponent(str)); }
    function safeDecode(str) { try { return decodeURIComponent(atob(str.replace(/ /g, '+'))); } catch(e) { return ""; } }
    function fixUrl(url) {
        if (!url || url === 'undefined') return "#";
        url = url.trim();
        if (!/^https?:\/\//i.test(url) && url !== "#") return 'https://' + url;
        return url;
    }

    if (urlParams.has('data')) {
        const raw = urlParams.get('data').split('|');
        let config = {
            t: safeDecode(raw[0]),
            c: fixUrl(safeDecode(raw[1] || raw[0])),
            v: fixUrl(safeDecode(raw[2] || raw[1])),
            f: fixUrl(safeDecode(raw[3] || raw[2]))
        };

        let vIdMatch = config.v.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/user\/\S+|\/ytscreeningroom\?v=|\/sandayat\?v=|\/condition_video_id\/|\/watch\?feature=player_embedded&v=))([^#\&\?]*)/);
        let vId = vIdMatch && vIdMatch[1].length === 11 ? vIdMatch[1] : null;
        let thumb = vId ? `https://img.youtube.com/vi/${vId}/maxresdefault.jpg` : '';

        let sub = false, vid = false;
        
        // المتغير اللي هيخزن اللايكات الأولية
        let baselineLikes = -1; 

        app.innerHTML = `
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" class="yt-logo">
            <div class="page-title">${config.t}</div>

            <div class="video-card" onclick="openT('v')">
                <img src="${thumb}">
            </div>

            <div class="task-box active" id="tk1" onclick="openT('c')">
                <div class="task-info">
                    <h4>Subscribe to channel</h4>
                    <p>اضغط هنا للاشتراك في القناة</p>
                </div>
                <div class="step-num"><span>1</span></div>
            </div>

            <div class="task-box" id="tk2" onclick="openT('v')">
                <div class="task-info">
                    <h4>Like & comment on video</h4>
                    <p>اعمل لايك وكومنت على الفيديو</p>
                </div>
                <div class="step-num"><span>2</span></div>
            </div>

            <div class="checker-card">
                <span style="color:#888; font-size:12px;">عدد اللايكات الحالي بالفيديو</span>
                <span id="count-num">جاري التحميل...</span>
                <button class="verify-btn" id="vBtn" onclick="verifyReal()">تحقق من الشروط 🔍</button>
                <div id="error-msg">❌ فشل التحقق: لم نكتشف لايك جديد! تأكد من وضع اللايك.</div>
            </div>

            <button id="fBtn" class="final-btn" onclick="window.location.href='${config.f}'">فتح الرابط 🔓</button>
        `;

        // دالة سحب اللايكات (مع كسر الكاش)
        function fetchLikes(callback) {
            if (!vId) { callback(0); return; }
            // إضافة ?t=timestamp بتجبر المتصفح يسحب أحدث رقم من السيرفر
            fetch('https://returnyoutubedislikeapi.com/votes?videoId=' + vId + '&t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (data && 'likes' in data) {
                    callback(data.likes);
                } else {
                    callback(-1);
                }
            }).catch(() => { callback(-1); });
        }

        // سحب اللايكات أول ما الصفحة تفتح لعمل الـ Baseline (نقطة الأساس)
        fetchLikes((likes) => {
            if (likes !== -1) {
                baselineLikes = likes;
                document.getElementById('count-num').innerText = baselineLikes.toLocaleString('en-US');
            } else {
                document.getElementById('count-num').innerText = "غير متاح";
            }
        });

        window.openT = function(type) {
            window.open(type === 'c' ? config.c : config.v, '_blank');
            if(type === 'c') { 
                sub = true; 
                document.getElementById('tk1').classList.remove('active');
                document.getElementById('tk1').classList.add('done'); 
                document.getElementById('tk1').querySelector('.step-num span').innerText = '✓';
                document.getElementById('tk2').classList.add('active'); 
            } else { 
                vid = true; 
                document.getElementById('tk2').classList.remove('active');
                document.getElementById('tk2').classList.add('done'); 
                document.getElementById('tk2').querySelector('.step-num span').innerText = '✓';
            }
        };

        // دالة التحقق الحقيقية (Before & After)
        window.verifyReal = function() {
            if(!sub || !vid) return alert("يرجى إكمال المهام أولاً!");
            if(baselineLikes === -1) return alert("جاري تحميل البيانات، حاول بعد ثانية...");
            
            document.getElementById('error-msg').style.display = 'none';
            const ld = document.getElementById('loader');
            ld.style.display = 'flex';
            
            // سحب الرقم الجديد بعد ما ضغطت "تحقق"
            fetchLikes((currentLikes) => {
                ld.style.display = 'none';
                
                if (currentLikes === -1) {
                    alert("حدث خطأ في الاتصال، حاول مرة أخرى.");
                    return;
                }

                // تحديث الرقم اللي ظاهر قدام المستخدم
                document.getElementById('count-num').innerText = currentLikes.toLocaleString('en-US');

                // لو الرقم الجديد أكبر من الرقم القديم = نجاح!
                if (currentLikes > baselineLikes) {
                    document.getElementById('count-num').style.color = "#22c55e";
                    document.getElementById('vBtn').innerText = "تم التحقق ✓";
                    document.getElementById('vBtn').disabled = true;
                    document.getElementById('fBtn').style.display = 'block';
                } else {
                    // لو الرقم الجديد زي القديم أو أقل = فشل!
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('vBtn').innerText = "أعد التحقق 🔄";
                    
                    // تحديث نقطة الأساس، عشان لو كان شال اللايك، نسجل الرقم القليل الجديد
                    baselineLikes = currentLikes;
                }
            });
        };

    } else {
        // صفحة الصانع زي ما هي
        app.innerHTML = `
            <div class="task-box" style="display:block; text-align:center; cursor:default;">
                <h2 style="color:var(--accent)">MX_SASUKE Generator</h2>
                <input type="text" id="it" class="gen-input" value="لازم تعمل اشتراك ولايك وتعليق للحصول على السكربت">
                <input type="url" id="ic" class="gen-input" placeholder="👇 رابط قناتك (اشتراك)">
                <input type="url" id="iv" class="gen-input" placeholder="👇 رابط فيديو اليوتيوب (اللايك والصورة)">
                <input type="url" id="if" class="gen-input" placeholder="👇 الرابط النهائي (ميديا فاير)">
                <button class="verify-btn" onclick="gen()">إنشاء الصفحة</button>
            </div>
        `;
        window.gen = function() {
            const d = [
                safeEncode(document.getElementById('it').value),
                safeEncode(document.getElementById('ic').value),
                safeEncode(document.getElementById('iv').value),
                safeEncode(document.getElementById('if').value)
            ].join('|');
            window.location.href = "?data=" + encodeURIComponent(d);
        };
    }
</script>
</body>
</html>
