<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; --liar: #f59e0b; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation; }
        .box-container { width: 92%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 20px; border: 1px solid #333; position: relative; }
        h1 { color: white; margin-bottom: 20px; font-size: 22px; text-align: center; }
        .game-btn { background: #111; border: 2px solid #333; color: white; padding: 16px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; display: block; text-align: center; text-decoration: none; border-color: #333; }
        .game-btn:active { background: #222; transform: scale(0.98); }
        .input-field { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #000; color: var(--accent); font-size: 16px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .action-btn { background: var(--main); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 10px; display: block; width: 100%; }
        .action-btn:disabled { background: #444; cursor: not-allowed; opacity: 0.6; }
        .leave-btn { background: #333; border: 1px solid #555; color: white; padding: 12px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .panel { display: none; }
        .panel.active { display: block !important; }
        .players-list { background: #000; border: 1px solid #333; border-radius: 10px; padding: 10px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; }
        .player-item { padding: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .liar-log { background: #1a1a1c; border: 1px solid #333; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 15px; text-align: center; color: #ccc; min-height: 40px; }
        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 15px; }
        .liar-card-btn { background: #222; border: 1px solid #444; color: white; padding: 10px 5px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .liar-card-btn:hover { border-color: var(--liar); }
    </style>
</head>
<body>

<div class="box-container">
    <div id="p-main" class="panel active">
        <h1>🎮 اختار الغرفة</h1>
        <input type="text" id="host-input" class="input-field" placeholder="اسمك..." value="Sasuke">
        <button class="game-btn" onclick="startHost('naruto', 'ناروتو', 'guess')">🍥 من أنا؟ (ناروتو)</button>
        <button class="game-btn" onclick="startHost('liar', 'الكذابين', 'liar')" style="border-color: var(--liar)">🃏 لعبة الكذابين ☠️</button>
        <button class="game-btn" onclick="changeUI('p-imposter')" style="border-color: #a855f7">🕵️‍♂️ لعبة الجاسوس ➡️</button>
    </div>

    <div id="p-imposter" class="panel">
        <h1>🕵️‍♂️ تصنيفات الجاسوس</h1>
        <button class="game-btn" onclick="startHost('food', 'أكلات', 'imposter')">🍕 أكلات</button>
        <button class="game-btn" onclick="startHost('animals', 'حيوانات', 'imposter')">🦁 حيوانات</button>
        <button class="leave-btn" onclick="changeUI('p-main')">رجوع 🔙</button>
    </div>

    <div id="p-lobby" class="panel">
        <h1 id="lobby-title">غرفة الانتظار</h1>
        <div id="invite-link" style="font-size: 9px; color: #666; margin-bottom: 10px; word-break: break-all; text-align: center;"></div>
        <button class="action-btn" onclick="copyLink()" style="background: #222; font-size: 14px;">📋 نسخ الرابط</button>
        <div class="players-list" id="h-list"></div>
        <button class="action-btn" id="start-btn" onclick="gameLaunch()" disabled>🚀 ابدأ اللعبة</button>
        <button class="leave-btn" onclick="location.reload()">🚪 إغلاق</button>
    </div>

    <div id="p-join" class="panel">
        <h1>👋 أهلاً بك</h1>
        <input type="text" id="guest-input" class="input-field" placeholder="اكتب اسمك...">
        <button class="action-btn" onclick="joinRoomAction()">دخول الغرفة 🚪</button>
    </div>

    <div id="p-wait" class="panel">
        <h1>⏳ انتظار الهوست...</h1>
        <div class="players-list" id="g-list"></div>
        <button class="leave-btn" onclick="location.reload()">🚪 مغادرة</button>
    </div>

    <div id="p-game" class="panel">
        <h2 id="game-res-title" style="text-align: center; font-size: 18px;">سرّك هو:</h2>
        <div id="my-word" style="background: #111; border: 2px dashed var(--accent); border-radius: 15px; padding: 30px; margin: 20px 0; font-size: 28px; font-weight: bold; text-align: center;"></div>
        <div class="players-list" id="game-list"></div>
        <button class="leave-btn" onclick="location.reload()">🚪 مغادرة</button>
    </div>

    <div id="p-liar" class="panel">
        <h2 style="color: var(--liar); text-align: center; font-size: 18px;">لعبة الكذابين ☠️</h2>
        <div class="liar-log" id="liar-log">🎲 بدأت اللعبة..</div>
        <div style="background: #222; padding: 10px; border-radius: 8px; text-align: center;">
            الورقة المطلوبة: <span id="liar-req" style="color: var(--liar); font-weight: bold;">...</span>
        </div>
        <div class="players-list" id="liar-list" style="margin-top:10px;"></div>
        <div id="my-turn-controls" style="display: none; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;">
            <p style="text-align: center; font-size: 12px; color: var(--liar); margin: 0;">دورك الآن! اختر ورقة لتمويههم:</p>
            <div class="card-grid" id="my-hand"></div>
            <button class="action-btn" id="call-liar-btn" onclick="liarMove('call')" style="background: var(--fail); margin-top: 10px; display: none;">كذبه! 🤬</button>
        </div>
        <button class="leave-btn" onclick="location.reload()">🚪 مغادرة</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>

<script>
    let client, myName, roomId, isHost = false, players = [], mode = '', cat = '';
    let currentLiarState = {};

    function changeUI(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) {
        roomId = urlParams.get('room');
        changeUI('p-join');
    }

    function updateLists() {
        let html = "";
        players.forEach(p => {
            let n = decodeURIComponent(p.name);
            html += `<div class="player-item"><span>${n}</span><span style="color:var(--accent)">● متصل</span></div>`;
        });
        ["h-list", "g-list", "game-list"].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = html; });
        
        if(isHost) {
            let btn = document.getElementById('start-btn');
            btn.disabled = (mode === 'liar') ? (players.length < 3 || players.length > 5) : (players.length < 2);
        }
    }

    function startHost(c, n, m) {
        if(typeof mqtt === 'undefined') return alert("السيرفر يحمل، حاول ثانية");
        isHost = true; mode = m; cat = c;
        myName = encodeURIComponent((document.getElementById('host-input').value || "Sasuke") + " 👑");
        roomId = Math.floor(10000 + Math.random() * 90000).toString();
        
        document.getElementById('invite-link').innerText = window.location.origin + window.location.pathname + "?room=" + roomId;
        players = [{name: myName}];
        updateLists();
        changeUI('p-lobby');

        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => client.subscribe('sasuke_' + roomId));
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(isHost && d.type === 'join') {
                if(!players.find(p => p.name === d.name) && players.length < 5) {
                    players.push({name: d.name});
                    updateLists();
                    client.publish('sasuke_' + roomId, JSON.stringify({type: 'sync', players: players, mode: mode}));
                }
            }
            if(d.type === 'liar_act') handleLiarLogic(d);
        });
    }

    function joinRoomAction() {
        let n = document.getElementById('guest-input').value;
        if(!n) return alert("اكتب اسمك");
        myName = encodeURIComponent(n);
        client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');
        client.on('connect', () => {
            client.subscribe('sasuke_' + roomId);
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'join', name: myName}));
            changeUI('p-wait');
        });
        client.on('message', (t, msg) => {
            let d = JSON.parse(msg.toString());
            if(d.type === 'sync') { players = d.players; mode = d.mode; updateLists(); }
            if(d.type === 'start') { showGame(d.words[myName]); }
            if(d.type === 'liar_start' || d.type === 'liar_sync') { updateLiarUI(d.state); }
        });
    }

    const DB = {
        naruto: ['ناروتو', 'ساسوكي', 'كاكاشي', 'ايتاشي', 'ايتاشي'],
        food: ['بيتزا', 'برجر', 'شاورما', 'كشري'],
        animals: ['أسد', 'نمر', 'قرد', 'قطة']
    };

    function gameLaunch() {
        if(!isHost) return;
        if(mode === 'liar') {
            let deck = [];
            let counts = players.length === 5 ? [7,7,7,3] : (players.length === 4 ? [6,6,6,3] : [4,4,4,2]);
            ['King','Ace','Queen'].forEach((v, i) => { for(let j=0; j<counts[i]; j++) deck.push(v); });
            for(let j=0; j<counts[3]; j++) deck.push('Joker');
            deck.sort(() => 0.5 - Math.random());

            let initialState = { turn: 0, req: ['King','Ace','Queen'][Math.floor(Math.random()*3)], last: null, logs: "بدأت اللعبة!", hands: {}, stats: {} };
            players.forEach(p => { initialState.hands[p.name] = []; initialState.stats[p.name] = {h:0, d:false}; });
            let i = 0; while(deck.length) { initialState.hands[players[i%players.length].name].push(deck.pop()); i++; }
            
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_start', state: initialState}));
            updateLiarUI(initialState);
        } else {
            let words = DB[cat] || DB.food;
            let w = words[Math.floor(Math.random()*words.length)];
            let assigned = {};
            let imp = players[Math.floor(Math.random()*players.length)].name;
            players.forEach(p => assigned[p.name] = (mode === 'imposter' && p.name === imp ? "أنت الجاسوس 🕵️‍♂️" : w));
            client.publish('sasuke_' + roomId, JSON.stringify({type: 'start', words: assigned}));
            showGame(assigned[myName]);
        }
    }

    function showGame(w) {
        changeUI('p-game');
        document.getElementById('my-word').innerText = w;
        document.getElementById('my-word').style.color = (w.includes('جاسوس')) ? 'var(--liar)' : 'white';
        document.getElementById('game-res-title').innerText = (mode === 'imposter') ? "مهمتك:" : "شخصيتك هي:";
    }

    function updateLiarUI(s) {
        currentLiarState = s; changeUI('p-liar');
        document.getElementById('liar-req').innerText = s.req;
        document.getElementById('liar-log').innerHTML = s.logs;
        
        let h = ""; players.forEach((p, i) => {
            let st = s.stats[p.name];
            let isTurn = (i === s.turn);
            h += `<div class="player-item" style="border-right: ${isTurn?'3px solid var(--accent)':'none'}">
                <span class="${st.d?'dead':''}">${st.h}/6 ${decodeURIComponent(p.name)}</span>
                <span>${st.d?'💀 ميت':(isTurn?'👈 دوره':'')}</span>
            </div>`;
        });
        document.getElementById('liar-list').innerHTML = h;

        let myTurn = (players[s.turn].name === myName && !s.stats[myName].d);
        document.getElementById('my-turn-controls').style.display = myTurn ? 'block' : 'none';
        document.getElementById('call-liar-btn').style.display = (myTurn && s.last && s.last.n !== myName) ? 'block' : 'none';
        
        let cards = ""; (s.hands[myName] || []).forEach(c => { 
            cards += `<button class="liar-card-btn" onclick="liarMove('play','${c}')">${c}</button>`; 
        });
        document.getElementById('my-hand').innerHTML = cards || "ورقك انتهى، انتظر النتائج!";
    }

    function handleLiarLogic(d) {
        if(!isHost) return;
        let s = currentLiarState;
        if(d.act === 'play') {
            let h = s.hands[d.n]; h.splice(h.indexOf(d.c), 1);
            s.last = {n: d.n, c: d.c};
            s.logs = `<b>${decodeURIComponent(d.n)}</b> لعب ورقة مقلوبة..`;
            do { s.turn = (s.turn + 1) % players.length; } while(s.stats[players[s.turn].name].d);
        } else {
            let wasLying = (s.last.c !== s.req && s.last.c !== 'Joker');
            let victim = wasLying ? s.last.n : d.n;
            s.stats[victim].h++;
            let died = (s.stats[victim].h >= 6 || Math.random() < 0.1);
            if(died) s.stats[victim].d = true;
            s.logs = `🚨 <b>${decodeURIComponent(d.n)}</b> كذب <b>${decodeURIComponent(s.last.n)}</b>!<br>الورقة كانت [${s.last.c}].. ${wasLying?'طلع كذاب!':'طلع صادق!'}<br>الضربة لـ ${decodeURIComponent(victim)} (${s.stats[victim].h}/6) ${died?'💀 مات!':''}`;
            s.last = null; s.req = ['King','Ace','Queen'][Math.floor(Math.random()*3)];
        }
        client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_sync', state: s}));
        updateLiarUI(s);
    }

    function liarMove(a, c) { client.publish('sasuke_' + roomId, JSON.stringify({type: 'liar_act', act: a, c: c, n: myName})); }
    function copyLink() { navigator.clipboard.writeText(document.getElementById('invite-link').innerText); alert("تم نسخ الرابط!"); }
</script>
</body>
</html>
