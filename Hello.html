<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس - اختبار</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#eee;text-align:center;padding:15px;min-height:100vh;direction:rtl;overflow-x:hidden}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:6px;border-radius:30px;font-size:16px;cursor:pointer}
        button:hover{background:#c23152}
        .btn-gold{background:#f39c12}
        input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        li{background:rgba(255,255,255,.05);margin:3px 0;padding:10px;border-radius:12px;font-size:16px}
        .game-select-btn{display:block;width:90%;margin:10px auto;font-size:18px;padding:16px;border-radius:20px}
        .host-name-display{background:linear-gradient(135deg,#f093fb,#f5576c,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:20px;font-weight:bold}
        .host-box{background:rgba(255,255,255,.05);padding:12px;border-radius:12px;border:1px solid #e94560;margin-bottom:12px}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:25px;border-radius:15px;text-align:center;max-width:450px}
        .notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e94560;padding:10px 20px;border-radius:25px;z-index:1000;font-size:14px}
    </style>
</head>
<body>
<div id="app" style="max-width:550px;margin:0 auto;background:rgba(0,0,0,.5);border-radius:20px;padding:15px;backdrop-filter:blur(5px);position:relative;z-index:1">

    <div id="host-screen">
        <h1>🕵️ لعبة الجاسوس</h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ S A S U K E ⚔️</span></p></div>
        <button class="game-select-btn" onclick="createRoom('normal')">🎮 لعبة الجاسوس ١</button>
        <button class="game-select-btn btn-gold" onclick="createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
    </div>

    <div id="join-screen" style="display:none">
        <h1>🕵️ لعبة الجاسوس</h1>
        <p style="color:#aaa;margin:15px 0">ادخل غرفة صديقك:</p>
        <input type="text" id="player-name" placeholder="اكتب اسمك"><br>
        <button onclick="joinRoom()">🚪 انضمام للغرفة</button>
    </div>

    <div id="game-screen" style="display:none">
        <h2>🕵️ لعبة الجاسوس <span id="mode-display"></span></h2>
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin:8px 0;font-size:12px">
            🔗 <span id="link-text" style="direction:ltr"></span>
            <br><button onclick="copyLink()" style="padding:4px 12px;font-size:12px">📋 نسخ</button>
        </div>
        <div id="word-display" style="display:none;padding:15px;border-radius:12px;margin:8px 0;font-size:24px;font-weight:bold"></div>
        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="startGame()">🚀 ابدأ اللعبة</button>
            <button id="btn-show-vote" onclick="showVoting()" style="display:none;background:#f39c12">🗳️ إظهار التصويت</button>
        </div>
        <h4>👥 اللاعبون:</h4><ul id="player-list"></ul>
        <div id="vote-section" style="display:none"><h4>🗳️ صوت على الجاسوس:</h4><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار باقي اللاعبين...</div>
        <button onclick="leaveRoom()" style="background:#555;margin-top:12px">🚪 مغادرة</button>
    </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const fc={apiKey:"AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",authDomain:"spy-game-1d774.firebaseapp.com",projectId:"spy-game-1d774",storageBucket:"spy-game-1d774.firebasestorage.app",messagingSenderId:"261865713515",appId:"1:261865713515:web:8868e0998ccd0d00aba62e"};
const a=initializeApp(fc),db=getDatabase(a);

let mid,mn,rid,ih,gm='normal',si,sw,ap={},ph='waiting';
const w=['تفاحة','سيارة','قمر','شمس','بحر','جبل','كتاب','قلم','نجمة','وردة','أسد','فيل','طائرة','سفينة','مفتاح','كاميرا','شجرة','نهر','ساعة','كرة','بيانو','تلفون','كنز','قناع','ملك','حصان','سيف','ذهب','ماء','نار','هاتف','تنس','عزف','ياسمين','ليمون','برتقال','عنب','مانجو','فراولة','رمان','عسل'];
const pr=new URLSearchParams(location.search),rf=pr.get('room');

if(rf){rid=rf;document.getElementById('host-screen').style.display='none';document.getElementById('join-screen').style.display='block';ck();}
else{document.getElementById('host-screen').style.display='block';document.getElementById('join-screen').style.display='none';}

function ck(){get(ref(db,'rooms/'+rid)).then(s=>{if(!s.exists()||!s.val().active){ex()}})}
function ex(){document.getElementById('join-screen').style.display='none';alert('⚠️ انتهت صلاحية الرابط!');}

window.createRoom=function(m){
    gm=m;mn='⚔️ SASUKE ⚔️';rid='r'+Date.now().toString(36);mid='h'+Date.now().toString(36);ih=true;
    set(ref(db,'rooms/'+rid),{gm,phase:'waiting',active:true,si:null,sw:null,vr:{},vl:{},om:null}).then(()=>{
        am();sg();document.getElementById('mode-display').textContent=gm==='multi'?'٢':'١';
        document.getElementById('host-btns').style.display='block';document.getElementById('btn-start').style.display='inline-block';
        document.getElementById('btn-show-vote').style.display='none';document.getElementById('room-link').style.display='block';
        document.getElementById('link-text').textContent=location.origin+location.pathname+'?room='+rid;
        la();sdc();nt('✅ تم!');
    });
};

window.joinRoom=function(){
    let n=document.getElementById('player-name').value.trim();if(!n)return nt('⚠️ اسمك!');
    mn=n;mid='p'+Date.now().toString(36);ih=false;
    get(ref(db,'rooms/'+rid)).then(s=>{if(s.exists()&&s.val().active){am();sg();document.getElementById('host-btns').style.display='none';document.getElementById('room-link').style.display='none';la();nt('👋 '+n+'!')}else{ex()}});
};

function am(){set(ref(db,'rooms/'+rid+'/players/'+mid),{id:mid,name:mn,ih,eliminated:false});}
function sdc(){if(ih){onDisconnect(ref(db,'rooms/'+rid)).remove();}}
function la(){lp();lg();}
function sg(){document.getElementById('host-screen').style.display='none';document.getElementById('join-screen').style.display='none';document.getElementById('game-screen').style.display='block';}

function lp(){onValue(ref(db,'rooms/'+rid+'/players'),s=>{let p=s.val()||{};ap=p;let h='';Object.keys(p).forEach(i=>{h+=`<li>${p[i].name}${p[i].ih?' 👑':''}</li>`});document.getElementById('player-list').innerHTML=h;if(ih&&ph==='waiting'){let k='';Object.keys(p).forEach(i=>{if(i!==mid)k+=`<button onclick="kick('${i}')" style="background:#ff6b6b;font-size:11px">❌ ${p[i].name}</button>`});document.getElementById('player-list').insertAdjacentHTML('afterend',k);}});}

window.kick=function(id){remove(ref(db,'rooms/'+rid+'/players/'+id));};
window.copyLink=function(){navigator.clipboard.writeText(document.getElementById('link-text').textContent);nt('📋 تم!');};

function lg(){onValue(ref(db,'rooms/'+rid),s=>{if(!s.exists()){if(!ih){alert('👑 غادر الهوست');location.href=location.origin+location.pathname;}return}let d=s.val();if(!d.active&&!ih){alert('انتهت اللعبة');location.href=location.origin+location.pathname;return}si=d.si;sw=d.sw;if(d.phase!==ph){ph=d.phase;hp(d)}});}

function hp(d){
    document.getElementById('vote-section').style.display='none';document.getElementById('waiting-votes').style.display='none';
    if(d.phase==='playing'){swd(d);if(ih){document.getElementById('btn-start').style.display='none';document.getElementById('btn-show-vote').style.display='inline-block'}}
    if(d.phase==='voting'){svu();if(ih)document.getElementById('btn-show-vote').style.display='none';}
    if(d.phase==='spyGuess'){if(mid===d.si)sgi();}
}

function swd(d){let wd=document.getElementById('word-display');wd.style.display='block';wd.style.background=mid===d.si?'rgba(200,0,0,.3)':'rgba(0,150,0,.3)';wd.innerHTML=mid===d.si?'🕵️ أنت الجاسوس!':'الكلمة: '+d.sw;}

window.startGame=function(){
    get(ref(db,'rooms/'+rid+'/players')).then(s=>{let p=s.val(),ids=Object.keys(p);if(ids.length<2)return nt('⚠️ محتاج لاعبين!');
        let spy=ids[Math.floor(Math.random()*ids.length)],sword=w[Math.floor(Math.random()*w.length)];
        ids.forEach(i=>update(ref(db,'rooms/'+rid+'/players/'+i),{eliminated:false}));
        update(ref(db,'rooms/'+rid),{phase:'playing',si:spy,sw:sword,vr:{},vl:{}});
        document.getElementById('btn-start').style.display='none';document.getElementById('btn-show-vote').style.display='inline-block';
    });
};

window.showVoting=function(){update(ref(db,'rooms/'+rid),{phase:'voting'});}

function svu(){document.getElementById('vote-section').style.display='block';let h='';Object.entries(ap).forEach(([id,p])=>{if(id!==mid&&!p.eliminated)h+=`<button onclick="vote('${id}')">${p.name}</button>`});document.getElementById('vote-btns').innerHTML=h;}

window.vote=function(id){
    set(ref(db,'rooms/'+rid+'/vr/'+mid),id);
    set(ref(db,'rooms/'+rid+'/vl/'+mid),{v:mn,t:ap[id]?.name||'???'});
    document.getElementById('vote-section').style.display='none';document.getElementById('waiting-votes').style.display='block';
    console.log(`🗳️ ${mn} صوت على ${ap[id]?.name}`);
    
    // CHECK VOTES IMMEDIATELY
    get(ref(db,'rooms/'+rid+'/vr')).then(s=>{
        let v=s.val()||{};
        let act=Object.values(ap).filter(x=>!x.eliminated).length;
        console.log(`✅ الأصوات: ${Object.keys(v).length} / ${act}`);
        if(Object.keys(v).length>=act) fz(v);
    });
};

function fz(v){
    console.log('🎯 finalize بدأت');
    let vc={};Object.values(v).forEach(x=>{vc[x]=(vc[x]||0)+1});
    let mv=Object.entries(vc).sort((a,b)=>b[1]-a[1])[0][0];
    let ok=(mv===si),sn=ap[si]?.name||'???';
    console.log(`الجاسوس: ${sn}, تم التصويت عليه: ${ok?'صح':'غلط'}`);
    
    document.getElementById('waiting-votes').style.display='none';
    
    if(gm==='normal'){
        if(ok){
            alert(`✅ الجاسوس هو: ${sn}\nعليه يخمن الكلمة!`);
        }else{
            alert(`❌ الي صوتو عليه غلط\n🕵️ الجاسوس: ${sn}\n⏳ في انتظار إجابة الجاسوس...`);
        }
    }
    update(ref(db,'rooms/'+rid),{phase:'spyGuess'});
}

function sgi(){
    let ovd=document.createElement('div');ovd.className='overlay';ovd.id='go';
    ovd.innerHTML=`<div class="overlay-box"><h3>🤔 خمن الكلمة:</h3><input id="gi" placeholder="اكتب الكلمة"><br><button onclick="sg()">📨 إرسال</button></div>`;
    document.body.appendChild(ovd);
}

window.sg=function(){
    let g=document.getElementById('gi')?.value.trim();if(!g)return;
    let el=document.getElementById('go');if(el)el.remove();
    alert(`✍️ الجاسوس خمّن: ${g}\nالكلمة الصحيحة: ${sw}`);
    update(ref(db,'rooms/'+rid),{phase:'finished',active:false});
};

function nt(msg){let n=document.createElement('div');n.className='notification';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}

window.leaveRoom=function(){
    if(mid&&rid){if(ih)remove(ref(db,'rooms/'+rid));else remove(ref(db,'rooms/'+rid+'/players/'+mid))}
    document.getElementById('game-screen').style.display='none';
    document.getElementById('host-screen').style.display='none';
    document.getElementById('join-screen').style.display='none';
    alert('👋 لقد غادرت اللعبة');
    location.href=location.origin+location.pathname;
};
</script>
</body>
</html>
