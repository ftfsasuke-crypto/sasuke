<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Link | MX_SASUKE</title>
    <style>
        :root { --red: #ff0000; --bg: #0f0f0f; --card: #1a1a1a; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; display: none; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .thumb-container { width: 100%; border-radius: 15px; margin-bottom: 20px; overflow: hidden; background: #222; border: 1px solid #444; min-height: 180px; display: none; }
        .thumb { width: 100%; height: 100%; object-fit: cover; }
        .progress-container { background: #333; height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: var(--red); height: 100%; width: 0%; transition: 0.6s; }
        .counter { font-size: 14px; font-weight: bold; color: var(--red); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; text-align: right; box-sizing: border-box; outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; position: relative; }
        .btn-red { background: var(--red); color: white; }
        .btn-task.done { background: #333 !important; color: #777 !important; pointer-events: none; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }
        .btn-unlock { background: #444; color: #888; cursor: not-allowed; margin-top: 20px; }
        .btn-unlock.enabled { background: #2ecc71; color: white; cursor: pointer; }
        #resArea { margin-top: 15px; background: #000; font-size: 11px; padding: 12px; border-radius: 10px; word-break: break-all; display: none; border: 1px dashed #555; cursor: pointer; color: #2ecc71; }
        .active { display: block !important; }
    </style>
</head>
<body>

<div id="gen" class="box" dir="rtl">
    <h3 style="color:var(--red)">لوحة تحكم MX_SASUKE</h3>
    <input type="text" id="imgUrl" placeholder="رابط ImgBB أو رابط مباشر">
    <input type="text" id="fName" placeholder="عنوان الملف">
    <input type="text" id="sUrl" placeholder="رابط القناة">
    <input type="text" id="vUrl" placeholder="رابط الفيديو">
    <input type="text" id="tUrl" placeholder="رابط التحميل">
    <button class="btn-red" onclick="make()">إنشاء الرابط</button>
    <div id="resArea" onclick="copy()">اضغط هنا للنسخ</div>
</div>

<div id="view" class="box" dir="ltr">
    <div class="thumb-container" id="tmCont"><img id="tm" class="thumb" src=""></div>
    <h3 id="nm">Unlock Content</h3>
    <div class="counter" id="st">Steps: 0/2</div>
    <div class="progress-container"><div class="progress-bar" id="pBar"></div></div>
    <button class="btn-red btn-task" id="b1" onclick="go('s')"><div class="spinner"></div><span class="btn-text">🔴 Subscribe to channel</span></button>
    <button class="btn-red btn-task" id="b2" onclick="go('l')"><div class="spinner"></div><span class="btn-text">👍 Like a video</span></button>
    <button id="un" class="btn-unlock" disabled>Unlock Link</button>
</div>

<script>
    const p = new URLSearchParams(location.search);
    const i = p.get('i'), n = p.get('n'), s = p.get('s'), l = p.get('l'), t = p.get('t');

    if (s && t) {
        document.getElementById('view').classList.add('active');
        if(i) { 
            const pic = document.getElementById('tm');
            const cont = document.getElementById('tmCont');
            let url = decodeURIComponent(atob(i));
            // تحويل روابط ImgBB العادية لروابط مباشرة أوتوماتيكياً
            if(url.includes('ibb.co') && !url.includes('i.ibb.co')) {
                let id = url.split('/').pop();
                url = `https://i.ibb.co/${id}/${id}.png`; 
            }
            pic.src = url;
            cont.style.display = 'block';
            pic.onerror = function() { 
                // محاولة ثانية لو الأولى فشلت (تبديل الامتداد)
                if(this.src.includes('.png')) { this.src = this.src.replace('.png', '.jpg'); }
                else { cont.innerHTML = '<div style="padding:40px; color:#555;">Image Error</div>'; }
            };
        }
        if(n) document.getElementById('nm').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('gen').classList.add('active');
    }

    function make() {
        const final = `${location.href.split('?')[0]}?i=${btoa(encodeURIComponent(document.getElementById('imgUrl').value))}&n=${btoa(encodeURIComponent(document.getElementById('fName').value))}&s=${btoa(document.getElementById('sUrl').value)}&l=${btoa(document.getElementById('vUrl').value)}&t=${btoa(document.getElementById('tUrl').value)}`;
        document.getElementById('resArea').innerText = final;
        document.getElementById('resArea').style.display = 'block';
        window.finalLink = final;
    }

    function copy() { navigator.clipboard.writeText(window.finalLink); alert("Copied!"); }

    let done = 0;
    function go(type) {
        const btn = document.getElementById(type === 's' ? 'b1' : 'b2');
        window.open(atob(type === 's' ? s : l), '_blank');
        btn.classList.add('loading');
        setTimeout(() => {
            btn.classList.remove('loading');
            btn.classList.add('done');
            btn.innerHTML = "Done ✅";
            done++;
            document.getElementById('pBar').style.width = (done/2)*100 + '%';
            document.getElementById('st').innerText = `Steps: ${done}/2`;
            if(done >= 2) { 
                const u = document.getElementById('un'); u.disabled = false; u.classList.add('enabled'); 
                u.innerText = "Get Link ✅";
                u.onclick = () => location.href = atob(t);
            }
        }, 5000); 
    }
</script>
</body>
</html>
