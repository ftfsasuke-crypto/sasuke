<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>

<style>
body{
    margin:0;
    font-family:Tahoma;
    background:linear-gradient(135deg,#2b2f5b,#485185);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:rgba(0,0,0,0.3);
    padding:30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:400px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:25px;
    font-size:18px;
    color:white;
    cursor:pointer;
    background:linear-gradient(to right,#8e44ad,#9b59b6);
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="box" id="home">
<h1>👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑</h1>
<button onclick="startGame()">🎮 لعبة الجاسوس 1</button>
</div>

<div class="box hidden" id="room">
<h2>🔥 تم إنشاء الغرفة</h2>
<p>جاهز نكمل الخطوة اللي بعدها</p>
</div>

<script>
function startGame(){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("room").classList.remove("hidden");
}
</script>

</body>
</html>
