<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX_SASUKE | VIP Unlocker</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --main: #ff0000; --bg: #000000; --card: rgba(21, 21, 23, 0.85); --accent: #22c55e; --fail: #ef4444; }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
            position: relative;
        }

        /* === التعديل الجديد للخلفية (زي Boostylink بالظبط) === */
        #dynamic-bg {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%; /* تكبير الصورة عشان التفاصيل تختفي */
            height: 140%;
            background-size: cover;
            background-position: center;
            filter: blur(80px); /* تشويش عميق جداً يسيح الألوان */
            z-index: -2;
            opacity: 0.8; 
            transform: scale(1.2); /* تكبير إضافي لضمان نعومة الحواف */
        }

        /* طبقة متدرجة: فاتحة شوية في النص عشان الألوان تنور، وغامقة في الأطراف */
        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
            z-index: -1;
        }
        /* ================================================== */

        .container { width: 90%; max-width: 420px; text-align: center; padding: 20px 0; z-index: 1; position: relative; }
        
        .yt-logo { width: 50px; margin-bottom: 10px; transition: 0.3s; }
        .page-title { font-size: 24px; font-weight: bold; margin-bottom: 25px; word-wrap: break-word; line-height: 1.4; transition: 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .video-card { 
            position: relative; 
            width: 100%; 
            border-radius: 15px; 
            overflow: hidden; 
            margin-bottom: 25px; 
            border: 1px solid rgba(255,255,255,0.08); 
            cursor: pointer; 
            background: rgba(17, 17, 17, 0.6);
            backdrop-filter: blur(10px);
            min-height: 180px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .video-card img { width: 100%; display: block; }
        
        .task-box { 
            background: var(--card); 
            border-radius: 15px; 
            padding: 15px; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: right; 
            cursor: pointer; 
            transition: 0.3s; 
            backdrop-filter: blur(10px);
        }
        .task-box.active { border-color: var(--main); box-shadow: 0 0 15px rgba(255,0,0,0.2); }
        .task-box.done { border-color: var(--accent); cursor: default; }
        
        .task-info { flex-grow: 1; margin-right: 15px; }
        .task-info h4 { margin: 0; font-size: 16px; color: white; }
        .task-info p { margin: 5px 0 0; font-size: 12px; color: #cbd5e1; }
        
        .step-num { width: 35px; height: 35px; background: rgba(0,0,0,0.3); border: 2px solid #444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--main); transition: 0.3s; }
        .task-box.active .step-num { border-color: var(--main); background: rgba(255,0,0,0.1); }
        .task-box.done .step-num { background: var(--accent); color: white; border-color: var(--accent); }
        
        .checker-card { background: rgba(15, 15, 16, 0.85); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; margin-top: 20px; backdrop-filter: blur(10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #count-num { font-size: 32px; font-weight: bold; display: block; margin: 5px 0; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        .verify-btn { background: var(--main); color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,0,0,0.2); }
        .verify-btn:disabled { background: #1a1a1c; color: #555; cursor: not-allowed; box-shadow: none; }
        
        #error-msg { display: none; color: var(--fail); font-size: 13px; margin-top: 10px; font-weight: bold; }

        .warning-box { background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 10px; padding: 15px; margin-top: 15px; text-align: right; }
        .warning-box h4 { color: var(--fail); margin: 0 0 5px; font-size: 14px; }
        .warning-box p { color: #cbd5e1; font-size: 12px; margin: 0; line-height: 1.6; }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .circle-timer { width: 60px; height: 60px; border: 5px solid #222; border-top: 5px solid var(--main); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        #countdown-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .countdown-wrapper { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .countdown-num { position: absolute; font-size: 40px; font-weight: bold; color: white; }
        .progress-ring { transform: rotate(-90deg); }
        #progress-circle { stroke-dasharray: 264; stroke-dashoffset: 0; stroke-linecap: round; }
        @keyframes circle-deplete { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 264; } }
        
        @keyframes bounce-icon { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } }

        .gen-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: rgba(0,0,0,0.5); color: white; box-sizing: border-box; text-align: right; font-family: 'Cairo', sans-serif; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

<div id="dynamic-bg"></div>
<div id="bg-overlay"></div>

<div id="countdown-overlay">
    <div class="countdown-wrapper">
        <svg class="progress-ring" width="100" height="100">
            <circle stroke="#333" stroke-width="6" fill="transparent" r="42" cx="50" cy="50"/>
            <circle id="progress-circle" stroke="var(--main)" stroke-width="6" fill="transparent" r="42" cx="50" cy="50"/>
        </svg>
        <span id="countdown-number" class="countdown-num">7</span>
    </div>
    <h2 style="margin-top: 10px; font-size: 24px;">انتظر قليلاً... ⏳</h2>
    <p style="color: #cbd5e1; font-size: 14px; text-align: center; width: 80%;">انتظر فقط، النظام يتحقق من إتمامك للشرط<br>بعد الانتهاء ستكتمل المهمة 👍</p>
</div>

<div id="loader">
    <div class="circle-timer"></div>
    <h2 id="timer-text" style="font-size: 30px; margin: 20px 0;">جاري التحقق</h2>
    <p>بنتأكد من اللايك في سيرفر يوتيوب... ⏳</p>
</div>

<div id="app" class="container"></div>

<script>
    const YOUTUBE_API_KEY = "AIzaSyA6NebhJLqT8ZEG56cmMEm4xsRR5byisPI"; 

    const app = document.getElementById('app');
    const urlParams = new URLSearchParams(window.location.search);

    function safeEncode(str) { return btoa(encodeURIComponent(str)); }
    function safeDecode(str) { try { return decodeURIComponent(atob(str.replace(/ /g, '+'))); } catch(e) { return ""; } }
    function fixUrl(url) {
        if (!url || url === 'undefined') return "#";
        url = url.trim();
        if (!/^https?:\/\//i.test(url) && url !== "#") return 'https://' + url;
        return url;
    }

    if (urlParams.has('data')) {
        const raw = urlParams.get('data').split('|');
        let config = {
            t: safeDecode(raw[0]),
            c: fixUrl(safeDecode(raw[1] || raw[0])),
            v: fixUrl(safeDecode(raw[2] || raw[1])),
            f: fixUrl(safeDecode(raw[3] || raw[2]))
        };

        let vIdMatch = config.v.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/user\/\S+|\/ytscreeningroom\?v=|\/sandayat\?v=|\/condition_video_id\/|\/watch\?feature=player_embedded&v=))([^#\&\?]*)/);
        let vId = vIdMatch && vIdMatch[1].length === 11 ? vIdMatch[1] : null;
        let thumb = vId ? `https://img.youtube.com/vi/${vId}/maxresdefault.jpg` : '';

        if(thumb) {
            document.getElementById('dynamic-bg').style.backgroundImage = `url('${thumb}')`;
        }

        let sub = false, vid = false;
        let initialLikes = -1; 

        app.innerHTML = `
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png" class="yt-logo" id="top-logo">
            <div class="page-title" id="top-title">${config.t}</div>

            <div id="tasks-container">
                <div class="video-card" onclick="openT('v')">
                    <img src="${thumb}">
                </div>

                <div class="task-box active" id="tk1" onclick="openT('c')">
                    <div class="task-info">
                        <h4>Subscribe to channel</h4>
                        <p>اضغط هنا للاشتراك في القناة</p>
                    </div>
                    <div class="step-num"><span>1</span></div>
                </div>

                <div class="task-box" id="tk2" onclick="openT('v')">
                    <div class="task-info">
                        <h4>Like & comment on video</h4>
                        <p>اعمل لايك وكومنت على الفيديو</p>
                    </div>
                    <div class="step-num"><span>2</span></div>
                </div>

                <div class="checker-card">
                    <span style="color:#cbd5e1; font-size:12px;">عدد اللايكات الفعلي (مباشر)</span>
                    <span id="count-num">جاري الاتصال...</span>
                    <button class="verify-btn" id="vBtn" onclick="verifyStrict()">تحقق من الشروط 🔍</button>
                    <div id="error-msg">❌ فشل التحقق: لم نكتشف زيادة في اللايكات! تأكد من وضع لايك.</div>
                    
                    <div class="warning-box">
                        <h4>تنبيه مهم ⚠️</h4>
                        <p>لما تضغط على Like & comment on video وتعمل كومنت ولايك اذا انت اصلا عامل لايك شيل اللايك وحطه تاني واعمل تحقق من الشروط واذا قالك فشل هذا لانه لسه ما سجل اللايك تبعك رح تضغط عليه تاني يكون هو سجل اللايك تبعك وبينقلك للصفحة الي بعدها ♥️</p>
                    </div>
                </div>
            </div>

            <div id="success-container" style="display: none; background: rgba(21, 21, 23, 0.8); backdrop-filter: blur(10px); border-radius: 15px; padding: 35px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
                <div style="font-size: 70px; margin-bottom: 10px; animation: bounce-icon 2s infinite;">🎉</div>
                
                <h2 style="margin: 0 0 15px; font-size: 28px; color: white;">احسنت يا بطل 😎</h2>
                
                <p style="color: var(--accent); font-size: 15px; font-weight: bold; margin-bottom: 20px; line-height: 1.6;">
                    هذا البداية فقط ولكن لانك اسطورة رح تقدر تتخطي بقية الروابط بسهولة
                </p>
                
                <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 15px; margin-bottom: 25px;">
                    <p style="color: #cbd5e1; font-size: 13px; margin: 0; line-height: 1.8;">
                        انصحك تشاهد الفيديو بالكامل لاني بشرح فيه كيفية تخطي الروابط او تشوف التعليق المثبت رح تلاقي رابط شرح كيفية تخطي الروابط 🔥
                    </p>
                </div>

                <button style="display: block; width: 100%; background: var(--accent); padding: 18px; border-radius: 12px; color: white; border: none; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 5px 20px rgba(34, 197, 94, 0.4);" onclick="window.location.href='${config.f}'">🔓 افتح الرابط</button>
            </div>
        `;

        function fetchRealLikes(callback) {
            if (!vId || YOUTUBE_API_KEY === "حط_المفتاح_بتاعك_هنا") {
                callback(-1);
                return;
            }
            fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics&id=' + vId + '&key=' + YOUTUBE_API_KEY + '&t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if(data.items && data.items.length > 0) {
                    callback(parseInt(data.items[0].statistics.likeCount));
                } else { callback(-1); }
            }).catch(e => callback(-1));
        }

        fetchRealLikes((likes) => {
            if (likes !== -1) {
                initialLikes = likes;
                document.getElementById('count-num').innerText = initialLikes.toLocaleString('en-US');
            } else {
                document.getElementById('count-num').innerText = "حدث خطأ";
            }
        });

        window.openT = function(type) {
            if (type === 'c' && sub) return;
            if (type === 'v' && vid) return;

            window.open(type === 'c' ? config.c : config.v, '_blank');

            const overlay = document.getElementById('countdown-overlay');
            const numSpan = document.getElementById('countdown-number');
            const progCircle = document.getElementById('progress-circle');
            
            overlay.style.display = 'flex';
            
            progCircle.style.animation = 'none';
            void progCircle.offsetWidth; 
            progCircle.style.animation = 'circle-deplete 7s linear forwards';
            
            let timeLeft = 7;
            numSpan.innerText = timeLeft;

            const timer = setInterval(() => {
                timeLeft--;
                numSpan.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    overlay.style.display = 'none';

                    if(type === 'c') { 
                        sub = true; 
                        document.getElementById('tk1').classList.remove('active');
                        document.getElementById('tk1').classList.add('done'); 
                        document.getElementById('tk1').querySelector('.step-num span').innerText = '✓';
                        document.getElementById('tk2').classList.add('active'); 
                    } else { 
                        vid = true; 
                        document.getElementById('tk2').classList.remove('active');
                        document.getElementById('tk2').classList.add('done'); 
                        document.getElementById('tk2').querySelector('.step-num span').innerText = '✓';
                    }
                }
            }, 1000);
        };

        window.verifyStrict = function() {
            if(!sub || !vid) return alert("يرجى إكمال المهام أولاً!");
            if(initialLikes === -1) return alert("حدث خطأ في الاتصال بيوتيوب!");
            
            document.getElementById('error-msg').style.display = 'none';
            const ld = document.getElementById('loader');
            ld.style.display = 'flex';
            
            setTimeout(() => {
                fetchRealLikes((currentLikes) => {
                    ld.style.display = 'none';
                    
                    if (currentLikes === -1) return alert("حدث خطأ في الاتصال بيوتيوب!");

                    document.getElementById('count-num').innerText = currentLikes.toLocaleString('en-US');

                    if (currentLikes > initialLikes) {
                        document.getElementById('tasks-container').style.display = 'none';
                        document.getElementById('top-logo').style.display = 'none';
                        document.getElementById('top-title').style.display = 'none';
                        
                        document.getElementById('success-container').style.display = 'block';
                        
                        var duration = 3 * 1000;
                        var end = Date.now() + duration;

                        (function frame() {
                            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                            if (Date.now() < end) { requestAnimationFrame(frame); }
                        }());

                    } else {
                        document.getElementById('error-msg').style.display = 'block';
                        document.getElementById('vBtn').innerText = "أعد التحقق 🔄";
                        initialLikes = currentLikes; 
                    }
                });
            }, 3000);
        };

    } else {
        document.getElementById('bg-overlay').style.background = 'rgba(0,0,0,0.9)'; 

        app.innerHTML = `
            <div class="task-box" style="display:block; text-align:center; cursor:default; background: rgba(21, 21, 23, 0.8); border: 1px solid rgba(255,255,255,0.1);">
                <h2 style="color:var(--accent); margin-top:0;">MX_SASUKE VIP Generator</h2>
                <input type="text" id="it" class="gen-input" value="لازم تعمل اشتراك ولايك وتعليق للحصول على السكربت">
                <input type="url" id="ic" class="gen-input" placeholder="👇 رابط قناتك (اشتراك)">
                <input type="url" id="iv" class="gen-input" placeholder="👇 رابط فيديو اليوتيوب (اللايك والصورة)">
                <input type="url" id="if" class="gen-input" placeholder="👇 الرابط النهائي (ميديا فاير)">
                <button class="verify-btn" onclick="gen()">إنشاء الصفحة</button>
            </div>
        `;
        window.gen = function() {
            const d = [
                safeEncode(document.getElementById('it').value),
                safeEncode(document.getElementById('ic').value),
                safeEncode(document.getElementById('iv').value),
                safeEncode(document.getElementById('if').value)
            ].join('|');
            window.location.href = "?data=" + encodeURIComponent(d);
        };
    }
</script>
</body>
</html>
