<script>
function createStars() {
    const container = document.getElementById('stars');
    if(!container) return;
    for (let i = 0; i < 80; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 'px';
        star.style.width = size; star.style.height = size;
        star.style.left = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        star.style.animationDelay = (Math.random() * 5) + 's';
        star.style.opacity = Math.random();
        container.appendChild(star);
    }
}
createStars();

const YOUTUBE_API_KEY = "AIzaSyA6NebhJLqT8ZEG56cmMEm4xsRR5byisPI"; 
let sub = false, vid = false, initialLikes = -1, vId = null, finalLink = "#", tutLink = "#", cLink = "#", vLink = "#";

function safeEncode(str) { return btoa(encodeURIComponent(str || "")); }
function safeDecode(str) { try { return decodeURIComponent(atob(str.replace(/ /g, '+'))); } catch(e) { return "خطأ"; } }
function fixUrl(url) {
    if (!url || url === 'undefined' || url === "" || url === "خطأ") return "#";
    url = url.trim();
    if (!/^https?:\/\//i.test(url) && url !== "#") return 'https://' + url;
    return url;
}

try {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('data') && urlParams.get('data').length > 5) {
        document.getElementById('generator-view').style.display = 'none';
        document.getElementById('task-view').style.display = 'block';
        
        const raw = urlParams.get('data').split('|');
        const titleText = safeDecode(raw[0]);
        cLink = fixUrl(safeDecode(raw[1] || raw[0]));
        vLink = fixUrl(safeDecode(raw[2] || raw[1]));
        finalLink = fixUrl(safeDecode(raw[3] || raw[2]));
        tutLink = raw[4] ? fixUrl(safeDecode(raw[4])) : "#";

        let vIdMatch = vLink.match(/(?:youtu\.be\/|youtube\.com(?:\/embed\/|\/v\/|\/watch\?v=|\/user\/\S+|\/ytscreeningroom\?v=|\/sandayat\?v=|\/condition_video_id\/|\/watch\?feature=player_embedded&v=))([^#\&\?]*)/);
        vId = vIdMatch && vIdMatch[1].length === 11 ? vIdMatch[1] : null;
        let thumb = vId ? `https://img.youtube.com/vi/${vId}/maxresdefault.jpg` : 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png';

        if(document.getElementById('top-title')) document.getElementById('top-title').innerText = titleText;
        if(document.getElementById('vid-thumb')) document.getElementById('vid-thumb').src = thumb;

        fetchRealLikes((likes) => {
            if (likes !== -1) {
                initialLikes = likes;
                if(document.getElementById('count-num')) document.getElementById('count-num').innerText = initialLikes.toLocaleString('en-US');
            } else {
                if(document.getElementById('count-num')) document.getElementById('count-num').innerText = "حدث خطأ";
            }
        });
    }
} catch (error) {}

function fetchRealLikes(callback) {
    if (!vId) { callback(-1); return; }
    fetch('https://www.googleapis.com/youtube/v3/videos?part=statistics&id=' + vId + '&key=' + YOUTUBE_API_KEY + '&t=' + Date.now())
    .then(res => res.json())
    .then(data => {
        if(data.items && data.items.length > 0) {
            callback(parseInt(data.items[0].statistics.likeCount));
        } else { callback(-1); }
    }).catch(e => callback(-1));
}

window.openC = function() { processTask('c', cLink); };
window.openV = function() { processTask('v', vLink); };
window.openTut = function() { window.open(tutLink, '_blank'); };
window.openFinal = function() { window.location.href = finalLink; };

function processTask(type, url) {
    if (type === 'c' && sub) return;
    if (type === 'v' && vid) return;

    window.open(url, '_blank');

    const overlay = document.getElementById('countdown-overlay');
    const numSpan = document.getElementById('countdown-number');
    const progCircle = document.getElementById('progress-circle');
    
    if(overlay) overlay.style.display = 'flex';
    if(progCircle) {
        progCircle.style.animation = 'none';
        void progCircle.offsetWidth; 
        progCircle.style.animation = 'circle-deplete 7s linear forwards';
    }
    
    let timeLeft = 7;
    if(numSpan) numSpan.innerText = timeLeft;

    const timer = setInterval(() => {
        timeLeft--;
        if(numSpan) numSpan.innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            if(overlay) overlay.style.display = 'none';

            if(type === 'c') { 
                sub = true; 
                if(document.getElementById('tk1')) {
                    document.getElementById('tk1').classList.remove('active');
                    document.getElementById('tk1').classList.add('done'); 
                    document.getElementById('tk1').querySelector('.step-icon').innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                }
                if(document.getElementById('tk2')) document.getElementById('tk2').classList.add('active'); 
            } else { 
                vid = true; 
                if(document.getElementById('tk2')) {
                    document.getElementById('tk2').classList.remove('active');
                    document.getElementById('tk2').classList.add('done'); 
                    document.getElementById('tk2').querySelector('.step-icon').innerHTML = '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
                }
            }
        }
    }, 1000);
}

window.verifyStrict = function() {
    if(!sub || !vid) return alert("يرجى إكمال المهام أولاً!");
    
    if(document.getElementById('error-msg')) document.getElementById('error-msg').style.display = 'none';
    const ld = document.getElementById('loader');
    if(ld) ld.style.display = 'flex';
    
    setTimeout(() => {
        fetchRealLikes((currentLikes) => {
            if(ld) ld.style.display = 'none';
            
            if (currentLikes !== -1 && document.getElementById('count-num')) {
                document.getElementById('count-num').innerText = currentLikes.toLocaleString('en-US');
            }

            if (currentLikes > initialLikes) {
                if(document.getElementById('tasks-container')) document.getElementById('tasks-container').style.display = 'none';
                if(document.getElementById('top-logo')) document.getElementById('top-logo').style.display = 'none';
                if(document.getElementById('top-title')) document.getElementById('top-title').style.display = 'none';
                if(document.getElementById('success-container')) document.getElementById('success-container').style.display = 'block';
                
                var duration = 3 * 1000;
                var end = Date.now() + duration;

                if (typeof confetti !== 'undefined') {
                    (function frame() {
                        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#22c55e', '#ffffff'] });
                        if (Date.now() < end) { requestAnimationFrame(frame); }
                    }());
                }
            } else {
                let errMsg = document.getElementById('error-msg');
                if(errMsg) {
                    errMsg.innerHTML = "❌ فشل التحقق: لم نكتشف زيادة في اللايكات! إذا كنت متأكداً من وضع اللايك، اضغط على <b>أعد التحقق</b> مجدداً بعد ثوانٍ.";
                    errMsg.style.display = 'block';
                }
                if(document.getElementById('vBtn')) document.getElementById('vBtn').innerText = "أعد التحقق 🔄";
                
                if (currentLikes !== -1 && currentLikes < initialLikes) {
                    initialLikes = currentLikes; 
                }
            }
        });
    }, 3000);
};

// ==========================================
// دالة الإنشاء الجديدة الخارقة (مضادة للحظر)
// ==========================================
window.gen = function() {
    const elId = id => document.getElementById(id) ? document.getElementById(id).value.trim() : "";
    const d = [
        safeEncode(elId('it')),
        safeEncode(elId('ic')),
        safeEncode(elId('iv')),
        safeEncode(elId('if')),
        safeEncode(elId('itut'))
    ].join('|');
    
    let baseUrl = window.location.href.split('?')[0];
    const finalUrl = baseUrl + "?data=" + encodeURIComponent(d);
    
    // محاولة إظهار النتيجة في الصندوق لو موجود
    let box = document.getElementById('result-box');
    let input = document.getElementById('short-link-input');
    
    if (box && input) {
        box.style.display = 'block';
        input.value = finalUrl;
        
        // محاولة تقصير الرابط في الخلفية بدون ما نوقف الموقع
        fetch(`https://is.gd/create.php?format=json&url=${encodeURIComponent(finalUrl)}`)
        .then(res => res.json())
        .then(data => {
            if(data.shorturl) {
                input.value = data.shorturl; // تحديث الرابط للقصير لو نجح
            }
        }).catch(e => { /* تجاهل الخطأ واحتفظ بالرابط الطويل */ });
        
    } else {
        // لو الصندوق مش موجود في الـ HTML بتاعك، هيطلعلك رسالة منبثقة إجبارية تنسخ منها
        prompt("تم إنشاء الرابط بنجاح! انسخه من المربع التالي:", finalUrl);
    }
};

window.copyLink = function() {
    const copyText = document.getElementById("short-link-input");
    if(!copyText) return;
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    
    if (navigator.clipboard) {
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("تم نسخ الرابط! 📋");
        });
    } else {
        document.execCommand("copy");
        alert("تم نسخ الرابط! 📋");
    }
};

window.testLink = function() {
    const url = document.getElementById("short-link-input");
    if(url && url.value) window.open(url.value, '_blank');
};
</script>
