<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<title>🕵️ لعبة الجاسوس</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:'Cairo',sans-serif;
background: linear-gradient(135deg,#141e30,#243b55);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.card{
width:90%;
max-width:420px;
padding:25px;
border-radius:30px;
background: rgba(255,255,255,0.08);
backdrop-filter: blur(30px);
box-shadow:0 10px 40px rgba(0,0,0,0.6);
text-align:center;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:30px;
margin-top:10px;
font-size:16px;
font-weight:bold;
background: linear-gradient(90deg,#667eea,#764ba2);
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{transform:scale(1.05)}

.overlay{
position:fixed;
top:0;left:0;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
background: linear-gradient(135deg,#141e30,#243b55);
}

.popup{
width:90%;
max-width:420px;
padding:30px;
border-radius:30px;
background: rgba(255,255,255,0.08);
backdrop-filter: blur(40px);
box-shadow:0 10px 50px rgba(0,0,0,0.7);
text-align:center;
}

.popup input{
width:100%;
padding:16px;
border:none;
border-radius:25px;
margin-top:10px;
font-size:16px;
text-align:center;
direction:rtl;
background: rgba(255,255,255,0.9);
color:#333;
outline:none;
}

ul{list-style:none;padding:0}
li{
background:rgba(255,255,255,0.1);
margin:6px 0;
padding:10px;
border-radius:15px;
}

.category-btn{
margin:6px;
padding:12px;
border-radius:20px;
background:#3498db;
}
</style>

</head>

<body>

<div class="card">

<div id="home">
<h2>🕵️ لعبة الجاسوس</h2>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<div id="linkContainer">
<p id="link"></p>
<button onclick="copyLink()">📋 نسخ الرابط</button>
</div>

<ul id="players"></ul>

<button id="startBtn" onclick="showCategories()" style="display:none">
🚀 ابدأ اللعبة
</button>
</div>

<div id="game" style="display:none;">
<h2 id="role"></h2>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", playersData={};

// 🔥 تحويل Bold
function toBold(text){
const normal="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const bold="𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳";

return text.split('').map(c=>{
let i=normal.indexOf(c);
return i!==-1?bold[i]:c;
}).join('');
}

// دخول من لينك
const params=new URLSearchParams(location.search);
const roomFromLink=params.get("room");

if(roomFromLink){
room=roomFromLink;
showJoinPopup();
}

// popup
function showJoinPopup(){
let div=document.createElement("div");
div.className="overlay";

div.innerHTML=`
<div class="popup">
<h2>✍️ اكتب اسمك</h2>
<input id="joinName" placeholder="اسمك">
<button onclick="joinNow()">🚪 انضمام</button>
</div>
`;

document.body.appendChild(div);
}

// انضمام
function joinNow(){
let name=document.getElementById("joinName").value.trim();
if(!name) return;

if(/^[A-Za-z ]+$/.test(name)){
name=toBold(name);
}

playerId="p"+Date.now();

db.ref("rooms/"+room+"/players/"+playerId).set({name});

document.querySelector(".overlay").remove();
openRoom();
}

// إنشاء غرفة
function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();

db.ref("rooms/"+room).set({
players:{
[playerId]:{name:"👑 ⚔️ 𝐒𝐀𝐒𝐔𝐊𝐄 ⚔️"}
},
phase:"waiting"
});

openRoom();

document.getElementById("link").innerText=
location.origin+location.pathname+"?room="+room;
}

// فتح الغرفة
function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

db.ref("rooms/"+room+"/players").on("value",snap=>{
playersData=snap.val()||{};
let html="";
for(let id in playersData){
html+=`<li>${playersData[id].name}</li>`;
}
document.getElementById("players").innerHTML=html;

if(Object.keys(playersData).length>=2){
document.getElementById("startBtn").style.display="block";
}
});

db.ref("rooms/"+room).on("value",snap=>{
let d=snap.val();
if(d.phase==="playing") showRole(d);
});
}

// نسخ الرابط
function copyLink(){
navigator.clipboard.writeText(document.getElementById("link").innerText);
document.getElementById("linkContainer").style.display="none";
}

// تصنيفات
function showCategories(){
let cats=["🍔 أكلات","🍎 فواكه","🐶 حيوانات","💻 أجهزة","🎌 كرتون وأنمي"];
let html="";

cats.forEach(c=>{
html+=`<button class="category-btn" onclick="startGame()">${c}</button>`;
});

let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`<div class="popup">${html}</div>`;
document.body.appendChild(div);
}

// بدء اللعبة
function startGame(){
document.querySelector(".overlay")?.remove();

let ids=Object.keys(playersData);
let spy=ids[Math.floor(Math.random()*ids.length)];

let words=["تفاح","بيتزا","أسد","موبايل","ناروتو","برجر","كمبيوتر"];
let word=words[Math.floor(Math.random()*words.length)];

db.ref("rooms/"+room).update({
spy:spy,
word:word,
phase:"playing"
});
}

// عرض الدور
function showRole(d){
document.getElementById("room").style.display="none";
document.getElementById("game").style.display="block";

if(playerId===d.spy){
document.getElementById("role").innerText="🕵️ أنت الجاسوس!";
}else{
document.getElementById("role").innerText="🔍 "+d.word;
}
}

</script>

</body>
</html>
