<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Unlocker | Ninja Edition</title>
    <style>
        :root { --p: #ff0000; --bg: #0a0a0b; --accent: #22c55e; }
        
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
        }

        .bg-blur { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: url('https://p16-capcut-va.ibyteimg.com/tos-alisg-i-7306232532/5a1b3263720f4f9f8c6f37648f57276a~tplv-nhvf8v017r-1.image') no-repeat center center;
            background-size: cover; 
            filter: blur(15px) brightness(0.3); 
            z-index: -1; 
            transform: scale(1.1); 
        }

        .container { width: 90%; max-width: 420px; text-align: center; z-index: 1; }
        
        .card { 
            background: rgba(30, 41, 59, 0.8); 
            padding: 30px 20px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }

        /* ستايل شعار يوتيوب والعنوان */
        .yt-header { margin-bottom: 25px; }
        .yt-logo { width: 50px; margin-bottom: 10px; }
        .main-title { font-size: 18px; font-weight: bold; line-height: 1.6; color: #fff; margin: 0; }

        .task-btn { 
            background: var(--p); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            cursor: pointer; 
            font-size: 16px;
            transition: 0.3s;
            line-height: 1.2;
        }

        .task-btn span { 
            font-size: 12px; 
            font-weight: normal; 
            display: block; 
            opacity: 0.8;
            margin-top: 4px;
        }

        .task-btn:disabled { 
            background: rgba(51, 65, 85, 0.5); 
            color: rgba(255, 255, 255, 0.3); 
            cursor: not-allowed; 
        }
        
        .task-btn.done { background: rgba(51, 65, 85, 0.9); color: var(--accent); cursor: default; }

        .progress-box { margin-top: 25px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 13px; color: #94a3b8; margin-bottom: 8px; }
        .bar-bg { background: #0f172a; height: 10px; border-radius: 10px; overflow: hidden; }
        .bar-fill { background: var(--accent); height: 100%; width: 0%; transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 15px var(--accent); }

        .final-btn { 
            background: var(--accent); 
            width: 100%; 
            padding: 18px; 
            border-radius: 12px; 
            color: white; 
            border: none; 
            margin-top: 20px; 
            font-weight: bold; 
            font-size: 18px; 
            display: none; 
            cursor: pointer; 
            box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3);
        }

        input { 
            width: 100%; padding: 14px; margin: 10px 0 20px; border-radius: 10px; border: 1px solid #475569; 
            background: #0f172a; color: white; box-sizing: border-box; 
        }
        label { display: block; text-align: right; font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="bg-blur"></div>

<div id="app" class="container"></div>

<script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);

    if (params.has('data')) {
        const raw = params.get('data').split('|');
        const config = {
            t: decodeURIComponent(atob(raw[0])),
            c: atob(raw[1]),
            v: atob(raw[2]),
            f: atob(raw[3])
        };
        let completed = 0;

        app.innerHTML = `
            <div class="yt-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/ef/Youtube_logo.png?20220706172052" class="yt-logo">
                <p class="main-title">${config.t}</p>
            </div>
            
            <div class="card">
                <div style="color:#94a3b8; font-size:14px; margin-bottom:20px; text-align:center;">Complete the actions to unlock</div>
                
                <button class="task-btn" id="b1" onclick="verify('${config.c}', 'b1')">
                    Subscribe to channel
                    <span>اشترك بالقناة</span>
                </button>
                
                <button class="task-btn" id="b2" onclick="verify('${config.v}', 'b2')" disabled>
                    Like & comment on video
                    <span>اعمل لايك وكومنت</span>
                </button>
                
                <div class="progress-box">
                    <div class="progress-text"><span>Unlock progress</span><span id="p-num">0/2</span></div>
                    <div class="bar-bg"><div class="bar-fill" id="bar"></div></div>
                </div>
                <button id="final" class="final-btn" onclick="window.location.href='${config.f}'">Unlock Link 🔓</button>
            </div>
        `;

        window.verify = function(url, id) {
            window.open(url, '_blank');
            const btn = document.getElementById(id);
            if(btn.classList.contains('done')) return;
            
            btn.innerHTML = "...Verifying<br><span>جاري التحقق</span>";
            
            setTimeout(() => {
                btn.innerHTML = "✓ Completed<br><span>تم بنجاح</span>";
                btn.classList.add('done');
                btn.disabled = true;
                completed++;
                
                document.getElementById('p-num').innerText = completed + "/2";
                document.getElementById('bar').style.width = (completed/2)*100 + "%";
                
                if(completed === 1) {
                    document.getElementById('b2').disabled = false;
                }
                
                if(completed === 2) {
                    document.getElementById('final').style.display = 'block';
                }
            }, 5000);
        };
    } else {
        app.innerHTML = `
            <div class="card" style="text-align:right">
                <h2 style="color:var(--accent); text-align:center; margin-bottom:30px;">MX_SASUKE Generator 🛠️</h2>
                <label>عنوان الصفحة:</label>
                <input type="text" id="title" value="افتح الرابط بلايك وكومنت واشتراك في القناه">
                <label>رابط قناتك:</label>
                <input type="url" id="c" placeholder="https://youtube.com/...">
                <label>رابط الفيديو:</label>
                <input type="url" id="v" placeholder="https://youtube.com/watch...">
                <label>رابط التحميل:</label>
                <input type="url" id="f" placeholder="https://...">
                <button class="task-btn" style="background:var(--accent); margin-top:10px" onclick="generate()">إنشاء الرابط</button>
            </div>
        `;

        window.generate = function() {
            const t = btoa(encodeURIComponent(document.getElementById('title').value));
            const c = btoa(document.getElementById('c').value);
            const v = btoa(document.getElementById('v').value);
            const f = btoa(document.getElementById('f').value);
            window.location.href = `?data=${t}|${c}|${v}|${f}`;
        };
    }
</script>

</body>
</html>
