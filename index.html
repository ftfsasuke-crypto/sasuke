<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Page</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

img {
    width: 100%;
    height: auto;
    object-fit: contain;
    border-radius: 10px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button.done {
    background: green;
}

button:disabled {
    background: gray;
}

.progress {
    height: 10px;
    background: #1e293b;
    border-radius: 10px;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: lime;
    border-radius: 10px;
}

.generator {
    display: none;
}
</style>
</head>

<body>

<div class="container" id="viewer">
    <h2 id="title"></h2>
    <img id="thumb">

    <button id="subBtn">اشترك</button>
    <button id="likeBtn">اعمل لايك</button>

    <div class="progress">
        <div class="progress-bar" id="bar"></div>
    </div>

    <button id="unlockBtn" disabled>فتح الرابط</button>
</div>

<div class="container generator" id="generator">
    <h2>Generator</h2>
    <input id="img" placeholder="رابط الصورة"><br><br>
    <input id="titleInput" placeholder="العنوان"><br><br>
    <input id="channel" placeholder="رابط القناة"><br><br>
    <input id="video" placeholder="رابط الفيديو"><br><br>
    <input id="download" placeholder="رابط التحميل"><br><br>

    <button onclick="generate()">إنشاء الرابط</button>
    <p id="result"></p>
</div>

<script>
let params = new URLSearchParams(window.location.search);
let data = params.get("data");

if (data) {
    let decoded = JSON.parse(atob(data));

    document.getElementById("title").innerText = decoded.title;
    document.getElementById("thumb").src = decoded.img;

    let progress = 0;

    function updateProgress() {
        progress++;
        document.getElementById("bar").style.width = (progress / 2) * 100 + "%";
        if (progress === 2) {
            document.getElementById("unlockBtn").disabled = false;
        }
    }

    document.getElementById("subBtn").onclick = function () {
        window.open(decoded.channel, "_blank");
        this.innerText = "✔ تمت";
        this.classList.add("done");
        this.disabled = true;
        setTimeout(updateProgress, 3000);
    };

    document.getElementById("likeBtn").onclick = function () {
        window.open(decoded.video, "_blank");
        this.innerText = "✔ تمت";
        this.classList.add("done");
        this.disabled = true;
        setTimeout(updateProgress, 3000);
    };

    document.getElementById("unlockBtn").onclick = function () {
        window.location.href = decoded.download;
    };

} else {
    document.getElementById("viewer").style.display = "none";
    document.getElementById("generator").style.display = "block";
}

function generate() {
    let data = {
        img: document.getElementById("img").value,
        title: document.getElementById("titleInput").value,
        channel: document.getElementById("channel").value,
        video: document.getElementById("video").value,
        download: document.getElementById("download").value
    };

    let encoded = btoa(JSON.stringify(data));
    let link = window.location.origin + "?data=" + encoded;

    document.getElementById("result").innerText = link;
}
</script>

</body>
</html>
