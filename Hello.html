<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>🕵️ لعبة الجاسوس</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #5f2c82, #49a09d);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.container {
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(15px);
  box-shadow: 0 0 30px rgba(0,0,0,0.3);
  width: 300px;
}

h1 {
  margin-bottom: 10px;
}

input {
  width: 90%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  margin: 10px 0;
  text-align: center;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

.btn-main {
  background: linear-gradient(90deg, #667eea, #764ba2);
  color: white;
}

.btn-main:hover {
  transform: scale(1.05);
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: rgba(255,255,255,0.1);
  margin: 5px;
  padding: 8px;
  border-radius: 10px;
}
</style>

</head>
<body>

<div class="container">

<div id="home" class="card">
  <h1>🕵️ لعبة الجاسوس</h1>
  <p>هل تستطيع اكتشاف الجاسوس؟</p>

  <input id="name" placeholder="اكتب اسمك">

  <button class="btn-main" onclick="createRoom()">👑 إنشاء غرفة</button>
  <button class="btn-main" onclick="joinRoom()">🚪 انضمام</button>
</div>

<div id="room" class="card" style="display:none;">
  <h3 id="roomCode"></h3>
  <p id="link"></p>
  <ul id="players"></ul>
  <button class="btn-main" onclick="startGame()">🚀 ابدأ</button>
</div>

<div id="game" class="card" style="display:none;">
  <h2 id="role"></h2>
</div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  authDomain: "spy-game-1d774.firebaseapp.com",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com",
  projectId: "spy-game-1d774"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room = "";
let playerId = "";

function createRoom() {
  const name = document.getElementById("name").value;
  room = "r" + Date.now();
  playerId = "p" + Date.now();

  db.ref("rooms/" + room).set({
    players: {
      [playerId]: { name: name }
    },
    phase: "waiting"
  });

  openRoom();
}

function joinRoom() {
  const name = document.getElementById("name").value;
  room = prompt("اكتب كود الغرفة");
  playerId = "p" + Date.now();

  db.ref("rooms/" + room + "/players/" + playerId).set({
    name: name
  });

  openRoom();
}

function openRoom() {
  document.getElementById("home").style.display = "none";
  document.getElementById("room").style.display = "block";

  document.getElementById("roomCode").innerText = "كود الغرفة: " + room;
  document.getElementById("link").innerText = location.href + "?room=" + room;

  db.ref("rooms/" + room + "/players").on("value", snap => {
    const data = snap.val();
    let html = "";

    for (let id in data) {
      html += "<li>" + data[id].name + "</li>";
    }

    document.getElementById("players").innerHTML = html;
  });

  db.ref("rooms/" + room + "/phase").on("value", snap => {
    if (snap.val() === "playing") showRole();
  });
}

function startGame() {
  db.ref("rooms/" + room + "/players").once("value").then(snap => {
    const players = Object.keys(snap.val());
    const spy = players[Math.floor(Math.random() * players.length)];

    const words = ["تفاحة", "موز", "عنب", "برتقال"];
    const word = words[Math.floor(Math.random() * words.length)];

    db.ref("rooms/" + room).update({
      spy: spy,
      word: word,
      phase: "playing"
    });
  });
}

function showRole() {
  document.getElementById("room").style.display = "none";
  document.getElementById("game").style.display = "block";

  db.ref("rooms/" + room).once("value").then(snap => {
    const data = snap.val();

    if (playerId === data.spy) {
      document.getElementById("role").innerHTML = "🕵️ أنت الجاسوس!";
    } else {
      document.getElementById("role").innerHTML = "🔍 الكلمة: " + data.word;
    }
  });
}
</script>

</body>
</html>
