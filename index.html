<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فتح الرابط | Unlock Link</title>
    <style>
        :root {
            --primary-color: #007bff;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h2 { margin-bottom: 1.5rem; font-size: 1.5rem; }

        .step {
            background: #334155;
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        .unlock-btn {
            background-color: #22c55e;
            width: 100%;
            margin-top: 1rem;
            padding: 15px;
            font-size: 1.1rem;
            display: none; /* مخفي في البداية */
        }

        .check-mark { color: #22c55e; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>أكمل المهام لفتح الرابط</h2>

    <!-- المهمة الأولى: يوتيوب -->
    <div class="step" id="step1">
        <span>1. اشترك في القناة</span>
        <button class="btn" onclick="completeTask('https://youtube.com/@YOUR_CHANNEL_LINK', 'step1')">اشتراك</button>
        <span class="check-mark">✔</span>
    </div>

    <!-- المهمة الثانية: ديسكورد -->
    <div class="step" id="step2">
        <span>2. انضم لسيرفر الديسكورد</span>
        <button class="btn" onclick="completeTask('https://discord.gg/YOUR_INVITE', 'step2')">انضمام</button>
        <span class="check-mark">✔</span>
    </div>

    <!-- زر التحميل النهائي -->
    <button id="finalLink" class="btn unlock-btn" onclick="location.href='رابط_التحميل_هنا'">
        فتح الرابط الآن 🚀
    </button>
</div>

<script>
    let completedTasks = 0;
    const totalTasks = 2;

    function completeTask(url, stepId) {
        // فتح الرابط في نافذة جديدة
        window.open(url, '_blank');
        
        // محاكاة التحقق (بعد 5 ثواني يعتبر المهمة تمت)
        const step = document.getElementById(stepId);
        const btn = step.querySelector('.btn');
        const check = step.querySelector('.check-mark');

        btn.innerText = "جاري التحقق...";
        btn.disabled = true;

        setTimeout(() => {
            btn.style.display = 'none';
            check.style.display = 'inline';
            completedTasks++;
            checkStatus();
        }, 5000);
    }

    function checkStatus() {
        if (completedTasks === totalTasks) {
            document.getElementById('finalLink').style.display = 'block';
        }
    }
</script>

</body>
</html>
