<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MX_SASUKE Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
        <style>
        :root { --bg: #0a0a0f; --card: rgba(20, 20, 25, 0.7); --fail: #ef4444; }
        body { background: #0a0a0f; color: white; font-family: 'Cairo'; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: fall linear infinite; }
        @keyframes fall { from { transform: translateY(-10vh); } to { transform: translateY(110vh); } }
        .box-container { width: 90%; max-width: 400px; background: var(--card); padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); position: relative; z-index: 10; }
        .panel { display: none; text-align: center; }
        .panel.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .action-btn { color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .btn-gold { background: linear-gradient(135deg, #f6d365, #fda085); color: #000; }
        .btn-purple { background: linear-gradient(135deg, #b224ef, #7579ff); }
        .input-field { width: 100%; padding: 12px; border-radius: 10px; margin-bottom: 15px; background: #000; color: #fff; border: 1px solid #444; text-align: center; }
    </style>
</head>
<body>
<div class="stars-container" id="stars"></div>
<div class="box-container">
    <div id="p-main" class="panel active">
        <h1>🎮 الألعاب</h1>
        <input type="text" id="name" class="input-field" placeholder="اسمك...">
        <button class="action-btn btn-gold" onclick="changeUI('p-liar')">لعبة الكذابين ☠️</button>
        <button class="action-btn btn-purple" onclick="changeUI('p-imposter')">لعبة الجاسوس 🕵️‍♂️</button>
    </div>
    <div id="p-liar" class="panel">
        <h1>🃏 الكذابين</h1>
        <button class="action-btn" style="background:#444" onclick="changeUI('p-main')">رجوع</button>
    </div>
    <div id="p-imposter" class="panel">
        <h1>🕵️‍♂️ الجاسوس</h1>
        <button class="action-btn" style="background:#444" onclick="changeUI('p-main')">رجوع</button>
    </div>
</div>
<script>
    // إنشاء النجوم
    const container = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = '2px'; star.style.height = '2px';
        star.style.left = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        container.appendChild(star);
    }

    // التنقل بين الصفحات
    function changeUI(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // التأكد من العمل عند التحميل
    window.onload = () => changeUI('p-main');
</script>
</body>
</html>
