<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MX_SASUKE | Multiplayer Hub</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
--main:#ff0000;
--bg:#0a0a0b;
--card:#151517;
--accent:#22c55e;
--fail:#ef4444;
--imposter:#a855f7;
--warn:#f59e0b;
}

* {
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body {
background:var(--bg);
color:white;
font-family:'Cairo',sans-serif;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow-x:hidden;
touch-action:manipulation;
}

.box-container {
width:92%;
max-width:400px;
background:var(--card);
padding:25px;
border-radius:20px;
border:1px solid #333;
}

h1 {
text-align:center;
font-size:22px;
}

.game-btn,
.action-btn,
.leave-btn {
width:100%;
border:none;
padding:15px;
border-radius:12px;
font-size:16px;
font-weight:bold;
margin-bottom:12px;
cursor:pointer;
}

.game-btn {
background:#111;
border:2px solid #333;
color:white;
}

.action-btn {
background:var(--main);
color:white;
}

.leave-btn {
background:#333;
color:white;
}

.input-field {
width:100%;
padding:15px;
border-radius:10px;
border:1px solid #444;
background:black;
color:var(--accent);
font-size:16px;
text-align:center;
margin-bottom:20px;
}

.panel {
display:none;
}

.active-panel {
display:block;
}

.players-list {
background:black;
border:1px solid #333;
border-radius:10px;
padding:15px;
margin-bottom:20px;
}

.player-item {
padding:10px;
border-bottom:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
}

.secret-word-box {
background:#111;
border:2px dashed var(--accent);
border-radius:15px;
padding:30px 15px;
margin:20px 0;
font-size:28px;
font-weight:bold;
text-align:center;
}
</style>
</head>
<body>

<div class="box-container">

<div id="p-main" class="panel active-panel">
<h1>🎮 اختر اللعبة</h1>

<input type="text" id="host-input" class="input-field" placeholder="اسمك">

<button class="game-btn" onclick="hostRoom('food','جاسوس','imposter')">
🕵️ لعبة الجاسوس
</button>

<button class="game-btn" onclick="hostRoom('liars','الكذابين','liars')" style="border-color:#f59e0b;">
🎭 لعبة الكذابين
</button>
</div>

<div id="p-lobby" class="panel">
<h1>غرفة الانتظار</h1>

<div id="invite-link"></div>

<div class="players-list" id="h-list"></div>

<button class="action-btn" onclick="launchGame()">
🚀 ابدأ اللعبة
</button>

<button class="leave-btn" onclick="leaveRoom()">
🚪 خروج
</button>
</div>

<div id="p-join" class="panel">
<h1>دخول الغرفة</h1>

<input type="text" id="guest-input" class="input-field" placeholder="اسمك">

<button class="action-btn" onclick="joinRoom()">
دخول
</button>
</div>

<div id="p-liars" class="panel">

<h1>🎭 لعبة الكذابين</h1>

<div class="secret-word-box" id="liar-card">???</div>

<h3 id="required-card" style="text-align:center;color:var(--warn);">
المطلوب: ؟؟؟
</h3>

<div class="players-list" id="liars-players"></div>

<div id="liars-actions"></div>

<button class="leave-btn" onclick="leaveRoom()">
🚪 مغادرة
</button>

</div>

</div>

<script>

let mqttClient;
let myName;
let roomId;
let isHost=false;
let players=[];
let gameMode='';

let myCards=[];
let myHits=0;
let currentTurn='';
let requiredType='';
let alivePlayers=[];

function navTo(id){
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active-panel'));
document.getElementById(id).classList.add('active-panel');
}

if(window.location.search.includes('room=')){
navTo('p-join');
}

function renderPlayers(){
let html='';

players.forEach(p=>{
html += `<div class="player-item">${decodeURIComponent(p.name)}</div>`;
});

document.getElementById('h-list').innerHTML = html;
}

function hostRoom(cat,name,mode){

isHost=true;
gameMode=mode;

myName = encodeURIComponent(document.getElementById('host-input').value || 'Host');

roomId = Math.floor(10000 + Math.random()*90000).toString();

players=[{name:myName}];

renderPlayers();

navTo('p-lobby');

let link = location.origin + location.pathname + '?room=' + roomId;

document.getElementById('invite-link').innerText = link;

mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

mqttClient.on('connect',()=>{
mqttClient.subscribe('mx_sasuke_' + roomId);
});

setupMessageHandler();
}

function joinRoom(){

myName = encodeURIComponent(document.getElementById('guest-input').value);
roomId = new URLSearchParams(location.search).get('room');

mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

mqttClient.on('connect',()=>{

mqttClient.subscribe('mx_sasuke_' + roomId);

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({
type:'join',
name:myName
}));

});

setupMessageHandler();
}

function setupMessageHandler(){

mqttClient.on('message',(t,m)=>{

let d = JSON.parse(m.toString());

if(d.type==='join' && isHost){

if(!players.find(p=>p.name===d.name)){
players.push({name:d.name});
renderPlayers();

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({
type:'sync',
players:players
}));
}
}

if(d.type==='sync'){
players=d.players;
renderPlayers();
}

if(d.type==='liars_start'){

myCards = d.cards[myName] || [];
currentTurn = d.turn;
requiredType = d.required;
alivePlayers = d.alive;

navTo('p-liars');
renderLiarsGame();
}

if(d.type==='liars_update'){

currentTurn = d.turn;
requiredType = d.required;
alivePlayers = d.alive;

if(d.cards && d.cards[myName]){
myCards = d.cards[myName];
}

if(d.hits && d.hits[myName] !== undefined){
myHits = d.hits[myName];
}

renderLiarsGame();
}

if(d.type==='liars_dead'){

if(d.player===myName){
alert('💀 خسرت! أصبحت متفرج');
}
}

});
}

function launchGame(){

if(gameMode !== 'liars') return;

if(players.length < 3){
return alert('❌ أقل عدد 3 لاعبين');
}

if(players.length > 5){
return alert('❌ الحد الأقصى 5 لاعبين');
}

let counts = {
3:{king:4,ace:4,queen:4,joker:2},
4:{king:6,ace:6,queen:6,joker:3},
5:{king:7,ace:7,queen:7,joker:3}
};

let cfg = counts[players.length];

let deck=[];

for(let i=0;i<cfg.king;i++) deck.push('King');
for(let i=0;i<cfg.ace;i++) deck.push('Ace');
for(let i=0;i<cfg.queen;i++) deck.push('Queen');
for(let i=0;i<cfg.joker;i++) deck.push('Joker');

for(let i=deck.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[deck[i],deck[j]]=[deck[j],deck[i]];
}

let distributed={};

players.forEach(p=>distributed[p.name]=[]);

let turnIndex=0;

while(deck.length>0){

distributed[players[turnIndex].name].push(deck.pop());

turnIndex++;

if(turnIndex>=players.length){
turnIndex=0;
}
}

let reqs=['King','Ace','Queen'];

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({

type:'liars_start',
cards:distributed,
turn:players[0].name,
required:reqs[Math.floor(Math.random()*reqs.length)],
alive:players.map(p=>p.name)

}));
}

function renderLiarsGame(){

let cardHTML = myCards.map(c=>`🃏 ${c}`).join('<br>');

if(cardHTML===''){
cardHTML='لا يوجد أوراق';
}

document.getElementById('liar-card').innerHTML = cardHTML;

document.getElementById('required-card').innerText = 'المطلوب الآن: ' + requiredType;

let html='';

alivePlayers.forEach(p=>{
html += `
<div class="player-item">
<span>${decodeURIComponent(p)}</span>
<span>${p===currentTurn?'🎯 دوره':''}</span>
</div>`;
});

document.getElementById('liars-players').innerHTML = html;

let actions='';

if(currentTurn===myName && myHits < 6){

actions += `
<button class="action-btn" onclick="playLiarCard()">
🎴 لعب ورقة
</button>

<button class="action-btn" style="background:#f59e0b;" onclick="callLiar()">
🤨 كذاب!
</button>
`;
}

actions += `<h3 style="text-align:center;">الضربات: ${myHits}/6</h3>`;

if(myHits >= 6){
actions += `<h3 style="text-align:center;color:red;">💀 أنت متفرج الآن</h3>`;
}

document.getElementById('liars-actions').innerHTML = actions;
}

function playLiarCard(){

if(myCards.length <= 0){
return alert('❌ لا يوجد أوراق');
}

myCards.splice(0,1);

let nextIndex = (alivePlayers.indexOf(myName)+1)%alivePlayers.length;

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({

type:'liars_update',
turn:alivePlayers[nextIndex],
required:['King','Ace','Queen'][Math.floor(Math.random()*3)],
alive:alivePlayers,
cards:{
[myName]:myCards
}

}));
}

function callLiar(){

let failChance = myHits >=5 ? 100 : 10;

let died = Math.random()*100 < failChance;

if(died){
myHits = 6;
alivePlayers = alivePlayers.filter(p=>p!==myName);

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({

type:'liars_dead',
player:myName

}));
}
else{
myHits++;
}

mqttClient.publish('mx_sasuke_' + roomId, JSON.stringify({

type:'liars_update',
turn:currentTurn,
required:requiredType,
alive:alivePlayers,
hits:{
[myName]:myHits
}

}));
}

function leaveRoom(){
location.href = location.pathname;
}

</script>
</body>
</html>
