<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
        }
        #app {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 20px;
        }
        h1, h2 { color: #e94560; }
        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #c23152; transform: scale(1.05); }
        input {
            padding: 12px;
            border-radius: 20px;
            border: none;
            margin: 10px;
            font-size: 16px;
            width: 70%;
        }
        #timer-display {
            font-size: 48px;
            font-weight: bold;
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: #0f3460;
            margin: 5px 0;
            padding: 10px;
            border-radius: 20px;
        }
        .notification { animation: fadeIn 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; top: 10px; }
            to { opacity: 1; top: 20px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- شاشة البداية -->
        <div id="start-screen">
            <h1>🕵️ لعبة الجاسوس</h1>
            <button onclick="createRoom()">إنشاء غرفة جديدة</button>
            <div id="join-section">
                <input type="text" id="player-name" placeholder="اكتب اسمك">
                <button onclick="joinRoom()">انضمام</button>
            </div>
        </div>

        <!-- شاشة الانتظار / اللعبة -->
        <div id="game-screen" style="display:none;">
            <h2>🕵️ لعبة الجاسوس</h2>
            <div id="timer-display">10:00</div>
            <div id="host-controls" style="display:none;">
                <button onclick="startGame()">🚀 ابدأ اللعبة</button>
                <button onclick="skipTime()">⏩ اسكب الوقت</button>
            </div>

            <h3>اللاعبون المتصلون:</h3>
            <ul id="player-list"></ul>

            <!-- مرحلة التصويت -->
            <div id="vote-section" style="display:none;">
                <h3>صوّت على الجاسوس</h3>
                <div id="vote-buttons"></div>
            </div>

            <!-- نتيجة التصويت -->
            <div id="vote-result" style="display:none;"></div>
            
            <!-- تخمين الجاسوس للكلمة -->
            <div id="spy-guess-section" style="display:none;">
                <h3>خمّن الكلمة السرية</h3>
                <input type="text" id="spy-guess-input" placeholder="اكتب الكلمة">
                <button onclick="submitSpyGuess()">إرسال التخمين</button>
            </div>

            <div id="final-result" style="display:none;"></div>
            
            <button onclick="leaveRoom()">🚪 مغادرة</button>
        </div>
    </div>

    <script>
        // ---------- إعدادات اللعبة ----------
        let gameState = {
            roomId: null,
            hostId: null,
            players: [],
            timer: 600,
            timerInterval: null,
            phase: 'waiting', // waiting, playing, voting, spyGuess, finished
            currentPlayerId: null,
            isHost: false,
            voteResults: {},
            spyPlayerId: null,
            secretWord: 'تفاحة'
        };

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // ---------- إنشاء غرفة ----------
        function createRoom() {
            const hostId = generateId();
            gameState.roomId = 'room-' + generateId();
            gameState.hostId = hostId;
            gameState.currentPlayerId = hostId;
            gameState.isHost = true;
            gameState.players = [{ id: hostId, name: 'الهوست' }];
            gameState.phase = 'waiting';
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('host-controls').style.display = 'block';
            
            updatePlayerList();
            showNotification('تم إنشاء الغرفة. أرسل الرابط إلى أصدقائك.');
        }

        // ---------- انضمام لاعب ----------
        function joinRoom() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value.trim();
            if (!name) {
                alert('اكتب اسمك الأول!');
                return;
            }
            
            const playerId = generateId();
            gameState.currentPlayerId = playerId;
            gameState.isHost = false;
            gameState.players.push({ id: playerId, name: name });
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('host-controls').style.display = 'none';
            
            updatePlayerList();
            showNotification(`مرحباً ${name}، أنت في الغرفة الآن!`);
            
            if (gameState.phase === 'playing') {
                updateTimerDisplay();
            }
        }

        // ---------- بدء اللعبة ----------
        function startGame() {
            if (!gameState.isHost) return;
            
            const randomIndex = Math.floor(Math.random() * gameState.players.length);
            gameState.spyPlayerId = gameState.players[randomIndex].id;
            gameState.phase = 'playing';
            gameState.timer = 600;
            
            updateTimerDisplay();
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timerInterval = setInterval(() => {
                gameState.timer--;
                updateTimerDisplay();
                
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    moveToVotingPhase();
                }
            }, 1000);
            
            showNotification('بدأت اللعبة! الكلمة السرية معروفة للجميع ما عدا الجاسوس.');
        }

        // ---------- اسكب الوقت ----------
        function skipTime() {
            if (!gameState.isHost) return;
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
            }
            moveToVotingPhase();
        }

        // ---------- مرحلة التصويت ----------
        function moveToVotingPhase() {
            gameState.phase = 'voting';
            gameState.timer = 0;
            updateTimerDisplay();
            
            document.getElementById('vote-section').style.display = 'block';
            document.getElementById('host-controls').style.display = 'none';
            
            let voteButtonsHtml = '';
            gameState.players.forEach(player => {
                if (player.id !== gameState.currentPlayerId) {
                    voteButtonsHtml += `<button onclick="voteFor('${player.id}')">${player.name}</button>`;
                }
            });
            document.getElementById('vote-buttons').innerHTML = voteButtonsHtml;
            showNotification('وقت التصويت! اختر من تظن أنه الجاسوس.');
        }

        // ---------- تسجيل الصوت ----------
        function voteFor(playerId) {
            if (gameState.phase !== 'voting') return;
            gameState.voteResults[gameState.currentPlayerId] = playerId;
            
            document.getElementById('vote-section').style.display = 'none';
            showNotification('تم تسجيل صوتك.');
            
            setTimeout(calculateVoteResult, 2000);
        }

        // ---------- نتيجة التصويت ----------
        function calculateVoteResult() {
            const mostVotedId = gameState.voteResults[gameState.currentPlayerId];
            const isCorrect = (mostVotedId === gameState.spyPlayerId);
            
            const resultDiv = document.getElementById('vote-result');
            resultDiv.style.display = 'block';
            
            if (isCorrect) {
                resultDiv.innerHTML = `✅ صحيح! الجاسوس هو ${getPlayerName(mostVotedId)}. عليه الآن تخمين الكلمة.`;
                if (gameState.currentPlayerId === gameState.spyPlayerId) {
                    document.getElementById('spy-guess-section').style.display = 'block';
                }
            } else {
                const spyName = getPlayerName(gameState.spyPlayerId);
                resultDiv.innerHTML = `❌ غلط! ده مش الجاسوس. الجاسوس هو ${spyName}. في انتظار تخمين الكلمة.`;
                if (gameState.currentPlayerId === gameState.spyPlayerId) {
                    document.getElementById('spy-guess-section').style.display = 'block';
                }
            }
            
            gameState.phase = 'spyGuess';
        }

        // ---------- تخمين الجاسوس ----------
        function submitSpyGuess() {
            if (gameState.currentPlayerId !== gameState.spyPlayerId) return;
            
            const guessInput = document.getElementById('spy-guess-input');
            const guess = guessInput.value.trim();
            if (!guess) {
                alert('اكتب تخمينك!');
                return;
            }
            
            const isCorrect = (guess === gameState.secretWord);
            const finalResultDiv = document.getElementById('final-result');
            finalResultDiv.style.display = 'block';
            finalResultDiv.innerHTML = isCorrect 
                ? `🎉 مبروك! التخمين صحيح! الكلمة كانت: ${gameState.secretWord}` 
                : `😞 للأسف تخمين خاطئ. الكلمة كانت: ${gameState.secretWord}`;
            
            document.getElementById('spy-guess-section').style.display = 'none';
            gameState.phase = 'finished';
        }

        // ---------- دوال مساعدة ----------
        function updatePlayerList() {
            const list = document.getElementById('player-list');
            list.innerHTML = gameState.players.map(p => `<li>${p.name} ${p.id === gameState.hostId ? '(هوست)' : ''}</li>`).join('');
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(gameState.timer / 60);
            const seconds = gameState.timer % 60;
            document.getElementById('timer-display').textContent = 
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function getPlayerName(id) {
            const player = gameState.players.find(p => p.id === id);
            return player ? player.name : 'لاعب غير معروف';
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #333;
                color: white;
                padding: 10px 20px;
                border-radius: 8px;
                z-index: 1000;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function leaveRoom() {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            location.reload();
        }
    </script>
</body>
</html>
