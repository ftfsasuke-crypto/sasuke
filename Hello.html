<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🕵️ لعبة الجاسوس</title>

<style>
body {
  margin:0;
  font-family:'Segoe UI';
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
}

/* الكارت */
.card {
  width:90%;
  max-width:400px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(20px);
  border-radius:25px;
  padding:20px;
  text-align:center;
}

/* الأزرار */
button {
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:25px;
  background: linear-gradient(90deg,#667eea,#764ba2);
  color:white;
  font-size:16px;
  cursor:pointer;
}

/* Overlay */
.overlay {
  position:fixed;
  top:0;left:0;
  width:100%;
  height:100%;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Popup */
.popup {
  width:90%;
  max-width:400px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(25px);
  padding:30px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}

.popup input {
  width:100%;
  padding:15px;
  border:none;
  border-radius:20px;
  margin-bottom:15px;
  font-size:16px;
  text-align:center;
}

/* تصنيفات */
.category-btn {
  margin:5px;
  padding:12px;
  border-radius:15px;
  background:#3498db;
}
</style>

</head>

<body>

<div class="card">

<div id="home">
<h2>🕵️ لعبة الجاسوس</h2>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<p id="link"></p>
<button onclick="copyLink()">📋 نسخ الرابط</button>

<ul id="players"></ul>

<button id="startBtn" onclick="showCategories()" style="display:none">
🚀 ابدأ اللعبة
</button>
</div>

<div id="game" style="display:none;">
<h2 id="role"></h2>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
  databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", playersData={};

// كلمات (خفيفة)
function expandWords(base){
let arr=[];
for(let i=0;i<200;i++){
arr.push(base[i % base.length] + (i>base.length? i:""));
}
return arr;
}

const categories = {
"🍔 أكلات": expandWords(["بيتزا","برجر","كشري","مكرونة","فراخ","رز","شاورما"]),
"🍎 فواكه": expandWords(["تفاح","موز","عنب","برتقال","مانجو"]),
"🐶 حيوانات": expandWords(["أسد","نمر","فيل","كلب","قطة"]),
"💻 أجهزة": expandWords(["موبايل","كمبيوتر","لابتوب","كاميرا"]),
"🎌 كرتون وأنمي": expandWords(["ناروتو","ساسكي","غوكو","لوفي","كونان"])
};

// دخول من لينك
const params=new URLSearchParams(location.search);
const roomFromLink=params.get("room");

if(roomFromLink){
room=roomFromLink;
showJoinPopup();
}

// 🔥 popup احترافي
function showJoinPopup(){
let div=document.createElement("div");
div.className="overlay";

div.innerHTML=`
<div class="popup">
<h2>✍️ اكتب اسمك</h2>
<input id="joinName" placeholder="اسمك">
<button onclick="joinNow()">🚪 انضمام</button>
</div>
`;

document.body.appendChild(div);
}

function joinNow(){
let name=document.getElementById("joinName").value;
playerId="p"+Date.now();

db.ref("rooms/"+room+"/players/"+playerId).set({name});

document.querySelector(".overlay").remove();
openRoom();
}

// إنشاء غرفة
function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();

db.ref("rooms/"+room).set({
players:{[playerId]:{name:"⚔️ SASUKE ⚔️"}},
phase:"waiting"
});

openRoom();

document.getElementById("link").innerText =
location.origin+location.pathname+"?room="+room;
}

// فتح الغرفة
function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

db.ref("rooms/"+room+"/players").on("value",snap=>{
playersData=snap.val()||{};
let html="";
for(let id in playersData){
html+="<li>"+playersData[id].name+"</li>";
}
document.getElementById("players").innerHTML=html;

if(Object.keys(playersData).length>=2){
document.getElementById("startBtn").style.display="block";
}
});

db.ref("rooms/"+room).on("value",snap=>{
let d=snap.val();
if(d.phase==="playing") showRole(d);
});
}

// نسخ الرابط + اخفائه
function copyLink(){
navigator.clipboard.writeText(document.getElementById("link").innerText);
document.getElementById("link").style.display="none";
}

// عرض التصنيفات
function showCategories(){
let html="";
for(let c in categories){
html+=`<button class="category-btn" onclick="startGame('${c}')">${c}</button>`;
}
let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`<div class="popup">${html}</div>`;
document.body.appendChild(div);
}

// بدء اللعبة
function startGame(cat){
document.querySelector(".overlay")?.remove();

let ids=Object.keys(playersData);
let spy=ids[Math.floor(Math.random()*ids.length)];
let wordList=categories[cat];
let word=wordList[Math.floor(Math.random()*wordList.length)];

db.ref("rooms/"+room).update({
spy:spy,
word:word,
phase:"playing"
});
}

// عرض الدور
function showRole(d){
document.getElementById("room").style.display="none";
document.getElementById("game").style.display="block";

if(playerId===d.spy){
document.getElementById("role").innerText="🕵️ أنت الجاسوس!";
}else{
document.getElementById("role").innerText="🔍 "+d.word;
}
}

</script>

</body>
</html>
