<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX_SASUKE | Games Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        h1 { color: white; margin-bottom: 25px; font-size: 26px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        /* تصميم زراير القائمة */
        .game-btn { background: #111; border: 2px solid #333; color: white; padding: 18px; border-radius: 15px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .game-btn:hover { border-color: var(--main); box-shadow: 0 0 15px rgba(255,0,0,0.3); transform: translateY(-2px); }
        .disabled-btn { opacity: 0.5; cursor: not-allowed; border-color: #222; }
        .disabled-btn:hover { border-color: #222; box-shadow: none; transform: none; }

        /* تصميم زراير الأنمي */
        .anime-btn { background: #1a1a1c; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s; text-align: right; }
        .anime-btn:hover { background: #222; border-color: var(--accent); padding-right: 20px; } /* حركة خفيفة لما تقف عليه */

        .back-btn { background: transparent; color: #888; border: none; font-size: 16px; margin-top: 15px; cursor: pointer; font-family: 'Cairo'; text-decoration: underline; }
        .back-btn:hover { color: white; }

        /* إخفاء القوائم */
        .screen { display: none; animation: fadeIn 0.4s; }
        .active-screen { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    
    <div id="main-menu" class="screen active-screen">
        <h1>🎮 قائمة الألعاب</h1>
        
        <button class="game-btn" onclick="showScreen('anime-menu')">
            👤 تخمين شخصيات الأنمي
        </button>
        
        <button class="game-btn disabled-btn">
            🕵️ لعبة البكّاس (قريباً)
        </button>
    </div>

    <div id="anime-menu" class="screen">
        <h1>📺 اختر الأنمي</h1>
        
        <button class="anime-btn" onclick="startLevel('naruto')">🍥 ناروتو (Naruto)</button>
        <button class="anime-btn" onclick="startLevel('aot')">⚔️ هجوم العمالقة (Attack on Titan)</button>
        <button class="anime-btn" onclick="startLevel('dbz')">🐉 دراجون بول (Dragon Ball)</button>
        <button class="anime-btn" onclick="startLevel('ds')">🗡️ قاتل الشياطين (Demon Slayer)</button>
        <button class="anime-btn" onclick="startLevel('monster')">🧠 مونستر (Monster)</button>
        
        <button class="back-btn" onclick="showScreen('main-menu')">رجوع للقائمة 🔙</button>
    </div>

</div>

<script>
    // دالة للتنقل بين الشاشات بنعومة
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    // دالة بداية اللعبة (هنبرمجها في الخطوة الجاية)
    function startLevel(animeName) {
        alert("جاهز للتخمين؟ الخطوة الجاية هنبرمج أسئلة قسم: " + animeName);
        // هنا هنضيف كود الانتقال لشاشة الأسئلة
    }
</script>

</body>
</html>
