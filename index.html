    <style>
        :root { --red: #ff0000; --bg: #0f0f0f; --card: #1a1a1a; }

        .box { background: var(--card); padding: 25px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; display: none; border: 1px solid #333; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        
        /* عرض الصورة المرفوعة بجودة كاملة */
        .thumb-container { width: 100%; border-radius: 12px; margin-bottom: 20px; overflow: hidden; background: #000; border: 1px solid #444; display: none; }
        .thumb { width: 100%; height: auto; display: block; }
        
        .progress-container { background: #333; height: 10px; border-radius: 10px; margin: 15px 0; overflow: hidden; }
        .progress-bar { background: var(--red); height: 100%; width: 0%; transition: 0.8s ease-in-out; }
        .counter { font-size: 15px; font-weight: bold; color: var(--red); margin-bottom: 5px; }

        input, textarea, .file-label { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #333; background: #252525; color: white; text-align: right; box-sizing: border-box; outline: none; }
        .file-label { background: #333; border: 2px dashed #555; text-align: center; cursor: pointer; display: block; color: #aaa; }
        #fileInput { display: none; }
        textarea { height: 80px; font-size: 10px; text-align: left; direction: ltr; display: none; }

        button { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-red { background: var(--red); color: white; }
        .btn-task.done { background: #333 !important; color: #777 !important; pointer-events: none; }
        
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading .spinner { display: block; }
        .loading .btn-text { display: none; }

        .btn-unlock { background: #444; color: #888; cursor: not-allowed; margin-top: 20px; }
        .btn-unlock.enabled { background: #2ecc71; color: white; cursor: pointer; }
        .active { display: block !important; }
    </style>
</head>
<body>

<!-- لوحة التحكم بالعربي -->
<div id="gen" class="box" dir="rtl">

    document.getElementById('fileInput').onchange = function(e) {
        const reader = new FileReader();

        reader.readAsDataURL(e.target.files[0]);

        if(n) document.getElementById('nm').innerText = decodeURIComponent(atob(n));
    } else {
        document.getElementById('gen').classList.add('active');
    }

    function make() {

        const area = document.getElementById('copyArea');
        area.value = final; area.style.display = 'block';
        document.getElementById('cpBtn').style.display = 'flex';
    }

    function copy() {
        const area = document.getElementById('copyArea');

    }
