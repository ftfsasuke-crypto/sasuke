<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0a0a1a,#1a1a3e);color:#eee;text-align:center;padding:20px;min-height:100vh;direction:rtl;overflow-x:hidden}
        .stars-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
        .star{position:absolute;background:white;border-radius:50%;animation:fall linear infinite;opacity:.8}
        @keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(360deg);opacity:0}}
        #app{max-width:600px;margin:0 auto;background:rgba(0,0,0,.5);border-radius:20px;padding:20px;position:relative;z-index:1;backdrop-filter:blur(10px)}
        h1 .title-spy{background:linear-gradient(135deg,#e94560,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:38px}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:8px;border-radius:30px;font-size:16px;cursor:pointer}
        button:hover{background:#c23152}
        .btn-gold{background:linear-gradient(135deg,#f39c12,#e67e22)}
        input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        li{background:rgba(255,255,255,.05);margin:5px 0;padding:12px;border-radius:15px;font-size:18px}
        .game-select-btn{display:block;width:90%;margin:12px auto;font-size:20px;padding:18px;border-radius:20px}
        .host-name-display{background:linear-gradient(135deg,#f093fb,#f5576c,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:22px;font-weight:bold}
        .host-box{background:rgba(255,255,255,.05);padding:15px;border-radius:15px;border:1px solid #e94560;margin-bottom:15px}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:30px;border-radius:20px;text-align:center;max-width:500px}
        .notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#e94560;color:white;padding:12px 24px;border-radius:30px;z-index:1000}
        .big-msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.95);border:2px solid #e94560;padding:30px;border-radius:20px;z-index:998;font-size:22px;text-align:center;max-width:450px}
        .vote-log-item{background:rgba(255,255,255,.05);padding:8px 15px;margin:4px 0;border-radius:10px;font-size:16px}
    </style>
</head>
<body>
<div class="stars-container" id="starsContainer"></div>
<div id="app">
    <div id="host-screen">
        <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ S A S U K E ⚔️</span></p></div>
        <button class="game-select-btn" onclick="createRoom('normal')">🎮 لعبة الجاسوس ١</button>
        <button class="game-select-btn btn-gold" onclick="createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
    </div>
    <div id="join-screen" style="display:none">
        <h1><span class="title-spy">🕵️ لعبة الجاسوس</span></h1>
        <p style="color:#aaa;margin:20px 0">ادخل غرفة صديقك:</p>
        <input type="text" id="player-name" placeholder="اكتب اسمك"><br>
        <button onclick="joinRoom()">🚪 انضمام للغرفة</button>
    </div>
    <div id="game-screen" style="display:none">
        <h2>🕵️ لعبة الجاسوس <span id="mode-display"></span></h2>
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;margin:10px 0">
            <p>🔗 الرابط:</p><span id="link-text" style="direction:ltr;font-size:12px"></span><br>
            <button onclick="copyLink()" style="padding:6px 15px;font-size:14px">📋 نسخ</button>
        </div>
        <div id="word-display" style="display:none;padding:20px;border-radius:15px;margin:10px 0;font-size:28px;font-weight:bold"></div>
        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="startGame()">🚀 ابدأ اللعبة</button>
            <button id="btn-show-vote" onclick="showVoting()" style="display:none;background:#f39c12">🗳️ إظهار التصويت</button>
        </div>
        <h3>👥 اللاعبون:</h3><ul id="player-list"></ul>
        <div id="vote-log-section" style="display:none"><h3>📋 سجل التصويتات:</h3><div id="vote-log"></div></div>
        <div id="vote-section" style="display:none"><h3>🗳️ صوت على الجاسوس:</h3><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار باقي اللاعبين...</div>
        <button onclick="leaveRoom()" style="background:#555;margin-top:15px">🚪 مغادرة</button>
    </div>
</div>

<script>
(function(){let c=document.getElementById('starsContainer');for(let i=0;i<60;i++){let s=document.createElement('div');s.className='star';let z=Math.random()*3+1;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.animationDuration=(Math.random()*4+3)+'s';s.style.animationDelay=Math.random()*5+'s';s.style.opacity=Math.random()*.7+.3;c.appendChild(s);}})();
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getDatabase,ref,set,get,update,onValue,onDisconnect,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const fc={apiKey:"AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",authDomain:"spy-game-1d774.firebaseapp.com",projectId:"spy-game-1d774",storageBucket:"spy-game-1d774.firebasestorage.app",messagingSenderId:"261865713515",appId:"1:261865713515:web:8868e0998ccd0d00aba62e"};
const app=initializeApp(fc),db=getDatabase(app);

let mid,mname,rid,isHost,gmode='normal',spyId,sword,allPlayers={},finished=false,phase='waiting';
const words=['تفاحة','سيارة','قمر','شمس','بحر','جبل','كتاب','قلم','نجمة','وردة','أسد','فيل','طائرة','سفينة','مفتاح','كاميرا','شجرة','نهر','ساعة','كرة','بيانو','تلفون','كنز','قناع','ملك','حصان','سيف','ذهب','فضة','ماء','نار','هاتف','كمبيوتر','تنس','ملاكمة','غناء','عزف','وردة','ياسمين','ليمون','برتقال','عنب','مانجو','فراولة','رمان','عسل','سكر'];

const params=new URLSearchParams(location.search),ridFromUrl=params.get('room');

if(ridFromUrl){rid=ridFromUrl;document.getElementById('host-screen').style.display='none';document.getElementById('join-screen').style.display='block'}
else{document.getElementById('host-screen').style.display='block';document.getElementById('join-screen').style.display='none'}

window.createRoom=function(mode){
    gmode=mode;mname='⚔️ SASUKE ⚔️';rid='r'+Date.now().toString(36);mid='h'+Date.now().toString(36);isHost=true;finished=false;
    set(ref(db,'rooms/'+rid),{gmode,phase:'waiting',active:true,spyId:null,sword:null,voteResults:{},voteLogs:{},overlay:null}).then(()=>{
        addMe();showGame();document.getElementById('mode-display').textContent=gmode==='multi'?'٢':'١';
        document.getElementById('host-btns').style.display='block';
        document.getElementById('btn-start').style.display='inline-block';
        document.getElementById('btn-show-vote').style.display='none';
        document.getElementById('room-link').style.display='block';
        document.getElementById('link-text').textContent=location.origin+location.pathname+'?room='+rid;
        listenAll();setupDC();notify('✅ تم!');
    });
};

window.joinRoom=function(){
    let n=document.getElementById('player-name').value.trim();if(!n)return notify('⚠️ اسمك!');
    mname=n;mid='p'+Date.now().toString(36);isHost=false;
    get(ref(db,'rooms/'+rid)).then(s=>{if(s.exists()&&s.val().active){addMe();showGame();document.getElementById('host-btns').style.display='none';document.getElementById('room-link').style.display='none';listenAll();notify('👋 '+n+'!')}else{notify('⚠️ غرفة مش موجودة')}});
};

function addMe(){let r=ref(db,'rooms/'+rid+'/players/'+mid);set(r,{id:mid,name:mname,isHost,eliminated:false});}
function setupDC(){if(isHost){onDisconnect(ref(db,'rooms/'+rid)).remove();}}
function listenAll(){listenPlayers();listenGame();listenOverlay();listenVoteLogs();}
function showGame(){document.getElementById('host-screen').style.display='none';document.getElementById('join-screen').style.display='none';document.getElementById('game-screen').style.display='block';}

function listenPlayers(){onValue(ref(db,'rooms/'+rid+'/players'),s=>{let p=s.val()||{};allPlayers=p;let h='';Object.keys(p).forEach(i=>{h+=`<li>${p[i].name}${p[i].isHost?' 👑':''}</li>`});document.getElementById('player-list').innerHTML=h;if(isHost&&phase==='waiting'){let k='';Object.keys(p).forEach(i=>{if(i!==mid)k+=`<button onclick="kick('${i}')" style="background:#ff6b6b;font-size:12px">❌ ${p[i].name}</button>`});document.getElementById('player-list').insertAdjacentHTML('afterend',k);}});}

function listenVoteLogs(){onValue(ref(db,'rooms/'+rid+'/voteLogs'),s=>{let logs=s.val()||{};let h='';Object.values(logs).forEach(l=>{h+=`<div class="vote-log-item">🗳️ ${l.voter} ➡️ ${l.target}</div>`});document.getElementById('vote-log').innerHTML=h||'لا تصويتات بعد';});}

window.kick=function(id){remove(ref(db,'rooms/'+rid+'/players/'+id));};
window.copyLink=function(){navigator.clipboard.writeText(document.getElementById('link-text').textContent);notify('📋 تم!');};

function listenGame(){onValue(ref(db,'rooms/'+rid),s=>{if(!s.exists()){if(!isHost){showBigMsg('<h2>👑 غادر الهوست</h2><p>تعطلت اللعبة</p>',4000);setTimeout(()=>{goHome()},4000);}return}let d=s.val();if(!d.active&&!isHost){showBigMsg('<h2>⚠️ انتهت اللعبة</h2>',3000);setTimeout(()=>{goHome()},3000);return}spyId=d.spyId;sword=d.sword;if(d.phase!==phase){phase=d.phase;handlePhase(d)}});}

function listenOverlay(){onValue(ref(db,'rooms/'+rid+'/overlay'),s=>{let msg=s.val();if(!msg)return;showBigMsg(msg.html,msg.auto||0);});}

function handlePhase(d){
    document.getElementById('vote-section').style.display='none';document.getElementById('waiting-votes').style.display='none';
    document.getElementById('vote-log-section').style.display='none';
    if(d.phase==='playing'){showWord(d);if(isHost){document.getElementById('btn-start').style.display='none';document.getElementById('btn-show-vote').style.display='inline-block'}}
    if(d.phase==='voting'){showVoteUI();if(isHost)document.getElementById('btn-show-vote').style.display='none';document.getElementById('vote-log-section').style.display='block';}
    if(d.phase==='spyGuess'){document.getElementById('vote-log-section').style.display='block';if(mid===d.spyId)showGuessInput();}
}

function showWord(d){let w=document.getElementById('word-display');w.style.display='block';w.style.background=mid===d.spyId?'rgba(200,0,0,.3)':'rgba(0,150,0,.3)';w.innerHTML=mid===d.spyId?'🕵️ أنت الجاسوس!':'🔑 '+d.sword;}

window.startGame=function(){
    get(ref(db,'rooms/'+rid+'/players')).then(s=>{let p=s.val(),ids=Object.keys(p);if(ids.length<2)return notify('⚠️ محتاج لاعبين!');
        let spy=ids[Math.floor(Math.random()*ids.length)],sw=words[Math.floor(Math.random()*words.length)];
        ids.forEach(i=>update(ref(db,'rooms/'+rid+'/players/'+i),{eliminated:false}));
        update(ref(db,'rooms/'+rid),{phase:'playing',spyId:spy,sword:sw,voteResults:{},voteLogs:{}});
        document.getElementById('btn-start').style.display='none';document.getElementById('btn-show-vote').style.display='inline-block';
    });
};

window.showVoting=function(){update(ref(db,'rooms/'+rid),{phase:'voting'});}

function showVoteUI(){
    document.getElementById('vote-section').style.display='block';
    let h='';Object.entries(allPlayers).forEach(([id,p])=>{if(id!==mid&&!p.eliminated)h+=`<button onclick="vote('${id}')">${p.name}</button>`});
    document.getElementById('vote-btns').innerHTML=h;
}

window.vote=function(id){
    set(ref(db,'rooms/'+rid+'/voteResults/'+mid),id);
    set(ref(db,'rooms/'+rid+'/voteLogs/'+mid),{voter:mname,target:allPlayers[id]?.name||'???'});
    document.getElementById('vote-section').style.display='none';document.getElementById('waiting-votes').style.display='block';
    setTimeout(()=>{
        get(ref(db,'rooms/'+rid+'/voteResults')).then(s=>{
            let v=s.val()||{},active=Object.values(allPlayers).filter(x=>!x.eliminated).length;
            if(Object.keys(v).length>=active)finalize(v);
        });
    },1500);
};

function finalize(v){
    let vc={};Object.values(v).forEach(x=>{vc[x]=(vc[x]||0)+1});
    let mv=Object.entries(vc).sort((a,b)=>b[1]-a[1])[0][0],ok=(mv===spyId),sn=allPlayers[spyId]?.name||'???';
    document.getElementById('waiting-votes').style.display='none';
    if(ok){update(ref(db,'rooms/'+rid+'/overlay'),{html:`✅ الجاسوس هو: <strong>${sn}</strong><br>عليه يخمن الكلمة!`,auto:0});}
    else{update(ref(db,'rooms/'+rid+'/overlay'),{html:`❌ مش هو الجاسوس!<br>🕵️ الجاسوس الحقيقي: <strong>${sn}</strong><br>عليه يخمن الكلمة!`,auto:0});}
    update(ref(db,'rooms/'+rid),{phase:'spyGuess'});
}

function showGuessInput(){
    let ov=document.createElement('div');ov.className='overlay';ov.id='overlay';
    ov.innerHTML=`<div class="overlay-box"><h3>🤔 خمن الكلمة:</h3><input id="guess-input" placeholder="اكتب الكلمة"><br><button onclick="submitGuess()">📨 إرسال</button></div>`;
    document.body.appendChild(ov);
}

window.submitGuess=function(){
    let g=document.getElementById('guess-input')?.value.trim();if(!g)return;
    document.getElementById('overlay').remove();
    update(ref(db,'rooms/'+rid+'/overlay'),{html:`✍️ الجاسوس خمّن: <strong>${g}</strong><br>🔑 الكلمة الصحيحة: <strong>${sword}</strong>`,auto:0});
    update(ref(db,'rooms/'+rid),{phase:'finished',active:false});
};

function showBigMsg(html,auto){
    let old=document.getElementById('big-msg');if(old)old.remove();
    let div=document.createElement('div');div.className='big-msg';div.id='big-msg';div.innerHTML=html;
    document.body.appendChild(div);
    if(auto>0)setTimeout(()=>div.remove(),auto);
}

// دالة الرجوع للصفحة الرئيسية بدون بارامترات
function goHome(){location.href=location.origin+location.pathname;}

function notify(msg){let n=document.createElement('div');n.className='notification';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);}

window.leaveRoom=function(){
    if(mid&&rid){if(isHost)remove(ref(db,'rooms/'+rid));else remove(ref(db,'rooms/'+rid+'/players/'+mid))}
    goHome(); // بيرجع للصفحة الرئيسية بدون ?room=
};
</script>
</body>
</html>
