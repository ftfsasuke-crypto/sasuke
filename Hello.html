<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الجاسوس - نسخة مستقرة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* منع تحديد النص بالصدأ */
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a1a;
            color: #eee;
            text-align: center;
            padding: 15px;
            min-height: 100vh;
            direction: rtl;
        }

        /* نجوم الخلفية */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: fall linear infinite;
            opacity: 0.8;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* التطبيق الرئيسي */
        #app {
            max-width: 550px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 28px;
            padding: 20px 15px;
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 1;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        button {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 6px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #c23152;
            transform: scale(1.02);
        }

        .btn-gold {
            background: #f39c12;
        }
        .btn-gold:hover {
            background: #e67e22;
        }

        input {
            padding: 12px;
            border-radius: 40px;
            border: none;
            margin: 8px;
            font-size: 16px;
            width: 80%;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            outline: none;
            backdrop-filter: blur(4px);
        }
        input::placeholder {
            color: #ccc;
        }

        li {
            background: rgba(255, 255, 255, 0.08);
            margin: 8px 0;
            padding: 12px;
            border-radius: 40px;
            list-style: none;
            font-weight: bold;
            backdrop-filter: blur(2px);
        }

        .game-select-btn {
            display: block;
            width: 90%;
            margin: 12px auto;
            font-size: 18px;
            padding: 14px;
        }

        .host-name-display {
            background: linear-gradient(135deg, #f093fb, #f5576c, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        .host-box {
            background: rgba(255, 255, 255, 0.08);
            padding: 16px;
            border-radius: 28px;
            border: 1px solid #e94560;
            margin-bottom: 20px;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .overlay-box {
            background: #1a1a3e;
            border: 2px solid #e94560;
            padding: 25px;
            border-radius: 32px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .vote-counter {
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 48px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .vote-log-item {
            background: rgba(255, 255, 255, 0.08);
            padding: 10px;
            margin: 5px 0;
            border-radius: 40px;
        }

        .guess-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .guess-btn {
            background: #2ecc71;
            padding: 10px 16px;
            margin: 4px;
        }
        .guess-btn:hover {
            background: #27ae60;
        }
        .close-btn {
            background: #555;
            margin-top: 16px;
            padding: 8px 20px;
        }
        .copy-btn {
            background: #2ecc71;
            padding: 4px 15px;
            font-size: 13px;
        }
        .spy-choice-btn {
            background: #3498db;
            margin: 6px;
        }
        #kick-section button {
            background: #ff4444;
            font-size: 12px;
            padding: 5px 12px;
        }
        .link-box {
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 28px;
            word-break: break-all;
        }
    </style>
</head>
<body>
<div class="stars-container" id="starsContainer"></div>
<div id="app">
    <!-- شاشة الهوست (المنشئ) -->
    <div id="host-screen">
        <h1 style="font-size: 32px;">🕵️ لعبة الجاسوس</h1>
        <div class="host-box">
            <p>👑 أنت الهوست</p>
            <p>اسمك: <span class="host-name-display">⚔️ SASUKE ⚔️</span></p>
        </div>
        <button class="game-select-btn" onclick="window.createRoom('normal')">🎮 لعبة الجاسوس ١</button>
        <button class="game-select-btn btn-gold" onclick="window.createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
    </div>

    <!-- شاشة الانضمام -->
    <div id="join-screen" style="display:none">
        <h1>🕵️ انضم للعبة</h1>
        <input type="text" id="player-name" placeholder="اكتب اسمك هنا" maxlength="18">
        <button onclick="window.joinRoom()">🚪 دخول الغرفة</button>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div id="game-screen" style="display:none">
        <h2>🕵️ لعبة الجاسوس <span id="mode-display"></span></h2>

        <div id="room-link" style="display:none; margin:10px 0;">
            <div class="link-box">
                <span id="link-text" style="font-size:12px;"></span><br>
                <button onclick="window.copyLink()" class="copy-btn">📋 نسخ الرابط</button>
            </div>
        </div>

        <div id="word-display" style="display:none; padding:20px; border-radius:24px; margin:10px 0; font-size:26px; font-weight:bold;"></div>

        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="window.startGame()">🚀 ابدأ اللعبة</button>
            <button id="btn-show-vote" onclick="window.showVoting()" style="display:none;">🗳️ إظهار التصويت</button>
        </div>

        <div id="vote-counter-container" class="vote-counter" style="display:none;">
            🗳️ عدد المصوتين: <span id="vote-count">0</span> / <span id="total-voters">0</span>
        </div>

        <h4>👥 اللاعبون :</h4>
        <ul id="player-list" style="max-height: 220px; overflow-y: auto; padding: 5px;"></ul>

        <div id="kick-section"></div>

        <div id="vote-log-section" style="display:none">
            <h4>📋 سجل التصويت</h4>
            <div id="vote-log"></div>
        </div>

        <div id="vote-section" style="display:none">
            <h4>🗳️ صوت على الجاسوس</h4>
            <div id="vote-btns"></div>
        </div>

        <div id="waiting-votes" style="display:none;">⏳ في انتظار باقي اللاعبين...</div>

        <button onclick="window.leaveRoom()" style="background:#555; margin-top:18px;">🚪 مغادرة</button>
    </div>
</div>

<script>
    // نجوم عشوائية
    (function(){
        let c = document.getElementById('starsContainer');
        for(let i=0;i<90;i++){
            let s = document.createElement('div');
            s.className = 'star';
            let z = Math.random() * 3 + 1;
            s.style.width = z+'px';
            s.style.height = z+'px';
            s.style.left = Math.random()*100+'%';
            s.style.animationDuration = (Math.random()*6+3)+'s';
            s.style.animationDelay = Math.random()*8+'s';
            s.style.opacity = Math.random()*0.7+0.2;
            c.appendChild(s);
        }
    })();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
        authDomain: "spy-game-1d774.firebaseapp.com",
        projectId: "spy-game-1d774",
        storageBucket: "spy-game-1d774.firebasestorage.app",
        messagingSenderId: "261865713515",
        appId: "1:261865713515:web:8868e0998ccd0d00aba62e",
        databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let mid, mn, rid, ih, gm = 'normal', si, sw, ap = {}, ph = 'waiting';
    let voteCounterInterval = null;

    // 500+ كلمة متنوعة (زي ما طلبت)
    const w = [
        'تفاحة','موز','برتقال','فراولة','عنب','مانجو','أناناس','بطيخ','شمام','كرز','خوخ','كمثرى','رمان','كيوي','جوز هند','افوكادو','توت','توت بري','ليمون','جريب فروت',
        'يوسفي','باباي','جاك فروت','ليتشي','تمر','زيتون','جزر','بطاطس','طماطم','خيار','فلفل','باذنجان','قرنبيط','بروكلي','سبانخ','خس','كرنب','بصل','ثوم','زنجبيل',
        'فجل','كرفس','كوسا','بامية','فاصوليا','بازلاء','ذرة','عدس','حمص','فول','أسد','نمر','فيل','زرافة','حمار وحشي','وحيد القرن','فرس النهر','تمساح','ثعبان','سلحفاة',
        'قرد','غوريلا','شمبانزي','دب','ذئب','ثعلب','كلب','قطة','حصان','بقرة','خروف','ماعز','دجاجة','بطة','أوزة','حمامة','نسر','بومة','ببغاء','نعامة','كنغر','كوالا',
        'مسجد','كنيسة','مستشفى','مدرسة','جامعة','روضة','مكتبة','متحف','حديقة','حمام سباحة','صالة رياضية','سوبر ماركت','بقالة','سوق','مول تجاري','مطعم'
    ];

    // التعامل مع رابط الغرفة
    const urlParams = new URLSearchParams(location.search);
    const roomFromUrl = urlParams.get('room');
    if(roomFromUrl) {
        rid = roomFromUrl;
        document.getElementById('host-screen').style.display = 'none';
        document.getElementById('join-screen').style.display = 'block';
        checkRoomExists();
    } else {
        document.getElementById('host-screen').style.display = 'block';
        document.getElementById('join-screen').style.display = 'none';
    }

    function checkRoomExists() {
        get(ref(db, 'rooms/' + rid)).then(snap => {
            if(!snap.exists() || !snap.val().active) {
                expiredRoom();
            }
        });
    }
    function expiredRoom() {
        document.getElementById('join-screen').style.display = 'none';
        showMessage('⚠️ الغرفة منتهية أو الرابط غير صالح', true);
        setTimeout(() => { location.href = location.origin + location.pathname; }, 2500);
    }

    // ---------- وظائف اللعبة الأساسية ----------
    window.createRoom = async function(mode) {
        gm = mode;
        mn = '⚔️ SASUKE ⚔️';
        rid = 'r' + Date.now() + Math.floor(Math.random()*10000);
        mid = 'h' + Date.now();
        ih = true;

        try {
            await set(ref(db, 'rooms/' + rid), {
                gm, phase:'waiting', active:true, si:null, sw:null, vr:{}, vl:{}, msg:null
            });
            await set(ref(db, 'rooms/' + rid + '/players/' + mid), { id:mid, name:mn, ih:true, eliminated:false });

            document.getElementById('mode-display').innerText = (gm === 'multi') ? '٢' : '١';
            document.getElementById('host-btns').style.display = 'block';
            document.getElementById('btn-start').style.display = 'inline-block';
            document.getElementById('room-link').style.display = 'block';
            const link = location.origin + location.pathname + '?room=' + rid;
            document.getElementById('link-text').innerText = link;

            document.getElementById('host-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            startListening();   // بدء الاستماع للاعبين
            showMessage('✅ الغرفة جاهزة، انسخ الرابط وشاركه', false);
        } catch(e) {
            alert("❌ خطأ في إنشاء الغرفة: " + e.message);
        }
    };

    window.joinRoom = async function() {
        let name = document.getElementById('player-name').value.trim();
        if(!name) return showMessage('⚠️ أدخل اسمك أولاً', false);
        mn = name;
        mid = 'p' + Date.now() + Math.floor(Math.random()*10000);
        ih = false;

        const roomSnap = await get(ref(db, 'rooms/' + rid));
        if(!roomSnap.exists() || !roomSnap.val().active) {
            expiredRoom();
            return;
        }
        await set(ref(db, 'rooms/' + rid + '/players/' + mid), { id:mid, name:mn, ih:false, eliminated:false });

        document.getElementById('host-screen').style.display = 'none';
        document.getElementById('join-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        startListening();
        showMessage('👋 مرحباً ' + mn, false);
    };

    // استماع live لكل تغييرات اللاعبين والغرفة
    function startListening() {
        listenPlayers();
        listenRoomState();
        listenMessages();
        listenVoteLog();
    }

    // 🌟 حل مشكلة ظهور الأسماء 🌟
    function listenPlayers() {
        const playersRef = ref(db, 'rooms/' + rid + '/players');
        onValue(playersRef, (snapshot) => {
            ap = snapshot.val() || {};
            const playerList = document.getElementById('player-list');
            if(playerList) {
                let html = '';
                for(let id in ap) {
                    let p = ap[id];
                    html += `<li>${p.name} ${p.ih ? '👑' : ''} ${p.eliminated ? '👀 مشاهدة' : ''}</li>`;
                }
                playerList.innerHTML = html || '<li>لا يوجد لاعبون</li>';
            }
            // إظهار خيارات الطرد للهوست
            const kickDiv = document.getElementById('kick-section');
            if(ih && ph === 'waiting') {
                let btns = '<strong>🚫 طرد لاعب:</strong><br>';
                let hasPlayers = false;
                for(let id in ap) {
                    if(id !== mid && !ap[id].eliminated) {
                        btns += `<button onclick="kickPlayer('${id}')">❌ ${ap[id].name}</button> `;
                        hasPlayers = true;
                    }
                }
                kickDiv.innerHTML = hasPlayers ? btns : '';
                kickDiv.style.display = hasPlayers ? 'block' : 'none';
            } else {
                kickDiv.innerHTML = '';
                kickDiv.style.display = 'none';
            }

            // حالة خاصة لجاسوس 2 : لو العدد قل للـ2 تنتهي تلقائياً
            if(gm === 'multi' && ph === 'playing') {
                const activeCount = Object.values(ap).filter(p => !p.eliminated).length;
                if(activeCount <= 2) {
                    endGameLowPlayers(ap[si]?.name || '???', sw);
                }
            }
        });
    }

    function listenRoomState() {
        onValue(ref(db, 'rooms/' + rid), (snap) => {
            if(!snap.exists()) {
                if(!ih) showMessage('❌ تم حذف الغرفة', true);
                setTimeout(()=> location.reload(), 2000);
                return;
            }
            const data = snap.val();
            if(!data.active && ph !== 'finished') {
                showMessage('⚠️ انتهت اللعبة', true);
                return;
            }
            si = data.si;
            sw = data.sw;
            if(data.phase !== ph) {
                ph = data.phase;
                handlePhaseChange(data);
            }
        });
    }

    function listenMessages() {
        onValue(ref(db, 'rooms/' + rid + '/msg'), (snap) => {
            const msg = snap.val();
            if(msg && msg.html) showMessage(msg.html, true);
        });
    }

    function listenVoteLog() {
        onValue(ref(db, 'rooms/' + rid + '/vl'), (snap) => {
            const votes = snap.val() || {};
            let logHtml = '';
            for(let v in votes) {
                logHtml += `<div class="vote-log-item">🗳️ ${votes[v].v} → ${votes[v].t}</div>`;
            }
            document.getElementById('vote-log').innerHTML = logHtml || 'لا توجد تصويتات';
        });
    }

    // تغيير المراحل
    function handlePhaseChange(data) {
        document.getElementById('vote-section').style.display = 'none';
        document.getElementById('waiting-votes').style.display = 'none';
        document.getElementById('vote-log-section').style.display = 'none';
        if(ph === 'playing') {
            showWord(data);
            if(ih) {
                document.getElementById('btn-start').style.display = 'none';
                document.getElementById('btn-show-vote').style.display = 'inline-block';
            }
        }
        else if(ph === 'voting') {
            startVotingUI();
            if(ih) document.getElementById('btn-show-vote').style.display = 'none';
            document.getElementById('vote-log-section').style.display = 'block';
            startVoteCounter();
        }
        else if(ph === 'spyGuess') {
            document.getElementById('vote-log-section').style.display = 'block';
            document.getElementById('vote-counter-container').style.display = 'none';
            if(mid === si) {
                if(gm === 'normal') showSpyGuessInput();
                else showSpyChoice();
            }
        }
    }

    function showWord(data) {
        const wordDiv = document.getElementById('word-display');
        wordDiv.style.display = 'block';
        if(ap[mid]?.eliminated) {
            wordDiv.innerHTML = '👀 أنت في وضع المشاهدة';
            wordDiv.style.background = '#444';
            return;
        }
        if(mid === data.si) {
            wordDiv.innerHTML = '🕵️ أنت الجاسوس! 🤫';
            wordDiv.style.background = '#8b0000';
        } else {
            wordDiv.innerHTML = '🔍 الكلمة: ' + data.sw;
            wordDiv.style.background = '#1e5631';
        }
    }

    function startVotingUI() {
        document.getElementById('vote-section').style.display = 'block';
        let btns = '';
        for(let id in ap) {
            if(id !== mid && !ap[id].eliminated) {
                btns += `<button onclick="voteFor('${id}')">${ap[id].name}</button>`;
            }
        }
        document.getElementById('vote-btns').innerHTML = btns || '<p>لا يوجد لاعبين للتصويت</p>';
    }

    // عداد التصويت
    function startVoteCounter() {
        if(voteCounterInterval) clearInterval(voteCounterInterval);
        voteCounterInterval = setInterval(async () => {
            if(ph !== 'voting') {
                document.getElementById('vote-counter-container').style.display = 'none';
                return;
            }
            const playersSnap = await get(ref(db, 'rooms/' + rid + '/players'));
            const players = playersSnap.val() || {};
            const activeCount = Object.values(players).filter(p => !p.eliminated).length;
            const votesSnap = await get(ref(db, 'rooms/' + rid + '/vr'));
            const votes = votesSnap.val() || {};
            const votedCount = Object.keys(votes).length;
            document.getElementById('vote-count').innerText = votedCount;
            document.getElementById('total-voters').innerText = activeCount;
            document.getElementById('vote-counter-container').style.display = 'block';
        }, 600);
    }

    window.voteFor = async function(votedId) {
        if(ap[mid]?.eliminated) {
            showMessage("⚠️ أنت في وضع المشاهدة، لا يمكنك التصويت", false);
            return;
        }
        await set(ref(db, 'rooms/' + rid + '/vr/' + mid), votedId);
        await set(ref(db, 'rooms/' + rid + '/vl/' + mid), { v: mn, t: ap[votedId]?.name || '???' });
        document.getElementById('vote-section').style.display = 'none';
        document.getElementById('waiting-votes').style.display = 'block';

        const playersSnap = await get(ref(db, 'rooms/' + rid + '/players'));
        const players = playersSnap.val() || {};
        const activeCount = Object.values(players).filter(p => !p.eliminated).length;
        const votesSnap = await get(ref(db, 'rooms/' + rid + '/vr'));
        if(Object.keys(votesSnap.val() || {}).length >= activeCount) {
            document.getElementById('waiting-votes').style.display = 'none';
            await computeVoteResult(votesSnap.val() || {});
        }
    };

    async function computeVoteResult(votes) {
        const count = {};
        for(let v of Object.values(votes)) count[v] = (count[v] || 0) + 1;
        const sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]);
        if(!sorted.length) return;
        const votedOutId = sorted[0][0];
        const isSpy = (votedOutId === si);
        const votedName = ap[votedOutId]?.name || '???';
        const spyName = ap[si]?.name || '???';

        if(isSpy) {
            // القبض على الجاسوس
            await update(ref(db, 'rooms/' + rid), { phase: 'spyGuess' });
            showMessage(`✅ تم اكتشاف الجاسوس: ${votedName}\n⏳ في انتظار تخمين الجاسوس...`, true);
        } else {
            // طرد مدني غلط
            await update(ref(db, 'rooms/' + rid + '/players/' + votedOutId), { eliminated: true });
            if(gm === 'normal') {
                showMessage(`❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n🕵️ الجاسوس الحقيقي هو: ${spyName}\n⏳ في انتظار تخمين الجاسوس...`, true);
                await update(ref(db, 'rooms/' + rid), { phase: 'spyGuess' });
            } else {
                // جاسوس 2
                showMessage(`❌ غلط! لم يكن الجاسوس\n🚫 تم طرد مدني: ${votedName}\n⏳ في انتظار قرار الجاسوس...`, true);
                if(mid === si) showSpyChoice();
                else await update(ref(db, 'rooms/' + rid), { phase: 'playing' });
            }
        }
        if(isSpy || (gm === 'normal' && !isSpy)) {
            if(mid === si && (isSpy || (!isSpy && gm==='normal'))) {
                if(gm === 'normal') showSpyGuessInput();
                else showSpyChoice();
            }
        }
    }

    // جاسوس 1 : كتابة يدوية
    function showSpyGuessInput() {
        const old = document.getElementById('guessOverlay');
        if(old) old.remove();
        const div = document.createElement('div');
        div.className = 'overlay';
        div.id = 'guessOverlay';
        div.innerHTML = `<div class="overlay-box"><h3>🤔 خمن الكلمة</h3><input id="spyGuessInput" type="text" placeholder="اكتب كلمتك" style="width:90%"><br><button onclick="submitTextGuess()">📨 إرسال</button><br><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
        document.getElementById('spyGuessInput')?.focus();
    }

    window.submitTextGuess = async function() {
        const guessInput = document.getElementById('spyGuessInput');
        const guess = guessInput?.value.trim();
        if(!guess) return;
        document.getElementById('guessOverlay')?.remove();
        await update(ref(db, 'rooms/' + rid), { phase: 'finished' });
        const finalMsg = `🔍 الجاسوس (${ap[si]?.name}) كتب: ${guess}\n🔑 الكلمة الصحيحة كانت: ${sw}\n🏆 انتهت اللعبة`;
        await set(ref(db, 'rooms/' + rid + '/msg'), { html: finalMsg, target: 'all' });
    };

    // جاسوس 2 : اختيار من 10
    function showSpyChoice() {
        const old = document.getElementById('choiceOverlay');
        if(old) old.remove();
        let otherWords = w.filter(word => word !== sw);
        let options = [];
        for(let i=0;i<9;i++) options.push(otherWords[Math.floor(Math.random()*otherWords.length)]);
        options.push(sw);
        options.sort(()=>Math.random()-0.5);
        let btns = '';
        options.forEach(opt => { btns += `<button class="guess-btn" onclick="submitChoiceGuess('${opt.replace(/'/g,"\\'")}')">${opt}</button>`; });
        const div = document.createElement('div');
        div.className = 'overlay';
        div.id = 'choiceOverlay';
        div.innerHTML = `<div class="overlay-box"><h3>🤔 اختر الكلمة الصحيحة</h3><div class="guess-buttons">${btns}</div><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
    }

    window.submitChoiceGuess = async function(guess) {
        document.getElementById('choiceOverlay')?.remove();
        await update(ref(db, 'rooms/' + rid), { phase: 'finished' });
        const finalMsg = `🔍 الجاسوس (${ap[si]?.name}) اختار: ${guess}\n🔑 الكلمة الصحيحة كانت: ${sw}\n🏆 انتهت اللعبة`;
        await set(ref(db, 'rooms/' + rid + '/msg'), { html: finalMsg, target: 'all' });
    };

    async function endGameLowPlayers(spyName, word) {
        if(ph === 'finished') return;
        ph = 'finished';
        const finalMsg = `⚠️ اكتمال اللعبة لتبقي لاعبين فقط\n🕵️ الجاسوس الحقيقي: ${spyName}\n🔑 الكلمة كانت: ${word}\n🎉 الجاسوس كسب تلقائياً! 🏆`;
        await set(ref(db, 'rooms/' + rid + '/msg'), { html: finalMsg, target: 'all' });
        await update(ref(db, 'rooms/' + rid), { phase: 'finished', active: false });
    }

    window.startGame = async function() {
        const playersSnap = await get(ref(db, 'rooms/' + rid + '/players'));
        const players = playersSnap.val() || {};
        const ids = Object.keys(players);
        if((gm === 'normal' && ids.length < 2) || (gm === 'multi' && ids.length < 3)) {
            showMessage(`⚠️ يحتاج على الأقل ${gm==='normal'?2:3} لاعبين`, false);
            return;
        }
        const spyId = ids[Math.floor(Math.random() * ids.length)];
        const secretWord = w[Math.floor(Math.random() * w.length)];
        await update(ref(db, 'rooms/' + rid), { phase: 'playing', si: spyId, sw: secretWord, vr: {}, vl: {} });
        for(let id of ids) await update(ref(db, 'rooms/' + rid + '/players/' + id), { eliminated: false });
        showMessage("🎮 بدأت اللعبة! حظاً موفقاً", false);
        document.getElementById('btn-start').style.display = 'none';
        document.getElementById('btn-show-vote').style.display = 'inline-block';
    };

    window.showVoting = function() {
        update(ref(db, 'rooms/' + rid), { phase: 'voting' });
    };

    window.copyLink = function() {
        const linkText = document.getElementById('link-text').innerText;
        navigator.clipboard.writeText(linkText);
        showMessage("📋 تم نسخ الرابط", false);
        document.getElementById('room-link').style.display = 'none';
    };

    window.kickPlayer = function(id) {
        remove(ref(db, 'rooms/' + rid + '/players/' + id));
        showMessage("✅ تم طرد اللاعب", false);
    };

    window.leaveRoom = function() {
        if(voteCounterInterval) clearInterval(voteCounterInterval);
        if(mid && rid) {
            if(ih) remove(ref(db, 'rooms/' + rid));
            else remove(ref(db, 'rooms/' + rid + '/players/' + mid));
        }
        location.href = location.origin + location.pathname;
    };

    function showMessage(msg, isPermanent = false) {
        const oldMsg = document.getElementById('dynamicMsg');
        if(oldMsg) oldMsg.remove();
        const div = document.createElement('div');
        div.className = 'overlay';
        div.id = 'dynamicMsg';
        div.innerHTML = `<div class="overlay-box"><div style="white-space:pre-line">${msg}</div><button class="close-btn" onclick="this.closest('.overlay').remove()">✖️ إغلاق</button></div>`;
        document.body.appendChild(div);
        if(!isPermanent) setTimeout(() => div.remove(), 4500);
    }
</script>
</body>
</html>
