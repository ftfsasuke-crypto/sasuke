<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a0a1a;color:#eee;text-align:center;padding:15px;min-height:100vh;direction:rtl}
        button{background:#e94560;color:white;border:none;padding:12px 24px;margin:6px;border-radius:30px;cursor:pointer}
        .btn-gold{background:#f39c12}
        input{padding:12px;border-radius:20px;border:none;margin:8px;font-size:16px;width:70%;text-align:center;background:rgba(255,255,255,.1);color:#fff}
        li{background:rgba(255,255,255,.05);margin:3px 0;padding:10px;border-radius:12px}
        .game-select-btn{display:block;width:90%;margin:10px auto;padding:16px;border-radius:20px}
        .host-box{background:rgba(255,255,255,.05);padding:12px;border-radius:12px;border:1px solid #e94560;margin-bottom:12px}
        .host-name-display{background:linear-gradient(135deg,#f093fb,#f5576c,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:999;display:flex;align-items:center;justify-content:center}
        .overlay-box{background:#1a1a3e;border:2px solid #e94560;padding:25px;border-radius:15px;text-align:center;max-width:450px}
        .vote-counter{background:rgba(0,0,0,.5);padding:10px;border-radius:12px;margin:10px 0}
        .vote-log-item{background:rgba(255,255,255,.05);padding:6px 12px;margin:3px 0;border-radius:8px}
        #kick-section{background:rgba(255,0,0,.1);padding:8px;border-radius:8px;margin-top:8px}
        .close-btn{background:#555;padding:8px 20px;margin-top:15px}
        .guess-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0}
        .guess-btn{background:#2ecc71;padding:10px 15px;margin:5px}
        .link-box{background:rgba(0,0,0,.3);padding:10px;border-radius:10px;margin:10px 0}
        .copy-btn{background:#2ecc71;padding:5px 15px}
        .spy-choice-btn{background:#3498db;padding:10px;margin:5px}
    </style>
</head>
<body>
<div id="app" style="max-width:550px;margin:0 auto;background:rgba(0,0,0,.5);border-radius:20px;padding:15px">

    <div id="host-screen">
        <h1 style="background:linear-gradient(135deg,#e94560,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent">🕵️ لعبة الجاسوس</h1>
        <div class="host-box"><p>👑 أنت الهوست</p><p>اسمك: <span class="host-name-display">⚔️ SASUKE ⚔️</span></p></div>
        <button class="game-select-btn" onclick="window.createRoom('normal')">🎮 لعبة الجاسوس ١</button>
        <button class="game-select-btn btn-gold" onclick="window.createRoom('multi')">🎯 لعبة الجاسوس ٢</button>
    </div>

    <div id="join-screen" style="display:none">
        <h1>🕵️ لعبة الجاسوس</h1>
        <input type="text" id="player-name" placeholder="اكتب اسمك"><br>
        <button onclick="window.joinRoom()">🚪 انضمام للغرفة</button>
    </div>

    <div id="game-screen" style="display:none">
        <h2>🕵️ لعبة الجاسوس <span id="mode-display"></span></h2>
        <div id="room-link" style="display:none;background:rgba(0,0,0,.3);padding:10px;border-radius:10px;margin:10px 0">
            <div>🔗 رابط دعوة الأصدقاء:</div>
            <div class="link-box"><span id="link-text"></span></div>
            <button onclick="window.copyLink()" class="copy-btn">📋 نسخ الرابط</button>
        </div>
        <div id="word-display" style="display:none;padding:20px;border-radius:15px;margin:10px 0;font-size:28px;font-weight:bold"></div>
        <div id="host-btns" style="display:none">
            <button id="btn-start" onclick="window.startGame()">🚀 ابدأ اللعبة</button>
            <button id="btn-show-vote" onclick="window.showVoting()" style="display:none">🗳️ إظهار التصويت</button>
        </div>
        <div id="vote-counter-container" class="vote-counter" style="display:none">
            🗳️ عدد المصوتين: <span id="vote-count">0</span> / <span id="total-voters">0</span>
        </div>
        <h4>👥 اللاعبون:</h4><ul id="player-list"></ul>
        <div id="kick-section"></div>
        <div id="vote-log-section" style="display:none"><h4>📋 التصويتات:</h4><div id="vote-log"></div></div>
        <div id="vote-section" style="display:none"><h4>🗳️ صوت على الجاسوس:</h4><div id="vote-btns"></div></div>
        <div id="waiting-votes" style="display:none">⏳ في انتظار باقي اللاعبين...</div>
        <button onclick="window.leaveRoom()">🚪 مغادرة</button>
    </div>
</div>

<script type="module">

import{getDatabase,ref,set,get,update,onValue,remove}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const fc={apiKey:"AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",authDomain:"spy-game-1d774.firebaseapp.com",projectId:"spy-game-1d774",storageBucket:"spy-game-1d774.firebasestorage.app",messagingSenderId:"261865713515",appId:"1:261865713515:web:8868e0998ccd0d00aba62e",databaseURL:"https://spy-game-1d774-default-rtdb.firebaseio.com/"};
const a=initializeApp(fc),db=getDatabase(a);

let mid,mn,rid,ih,gm='normal',si,sw,ap={},ph='waiting';
let voteCounterInterval=null;

const w = [
'تفاحة','موز','برتقال','فراولة','عنب','مانجو','أناناس','بطيخ','شمام','كرز','خوخ','كمثرى','رمان','كيوي','جوز هند','افوكادو','توت','توت بري','ليمون','جريب فروت',
'يوسفي','باباي','جاك فروت','ليتشي','تمر','زيتون','جزر','بطاطس','طماطم','خيار','فلفل','باذنجان','قرنبيط','بروكلي','سبانخ','خس','كرنب','بصل','ثوم','زنجبيل',
'فجل','كرفس','كوسا','بامية','فاصوليا','بازلاء','ذرة','عدس','حمص','فول','أسد','نمر','فيل','زرافة','حمار وحشي','وحيد القرن','فرس النهر','تمساح','ثعبان','سلحفاة',
'قرد','غوريلا','شمبانزي','دب','ذئب','ثعلب','كلب','قطة','حصان','بقرة','خروف','ماعز','دجاجة','بطة','أوزة','حمامة','نسر','بومة','ببغاء','نعامة','كنغر','كوالا','باندا','جمل','غزال','سنجاب','أرنب','فأر','قنفذ','حوت','دلفين','قرش','أخطبوط',
'مسجد','كنيسة','مستشفى','مدرسة','جامعة','روضة','مكتبة','متحف','حديقة','حمام سباحة','صالة رياضية','سوبر ماركت','بقالة','سوق','مول تجاري','مطعم','مقهى','فندق','منتجع','شاطئ','متنزه','مدينة ملاهي','حديقة حيوان','سينما','مسرح','استاد','مطار','محطة قطار','مركز شرطة','مخبز','صالون حلاقة','عيادة','صيدلية','نادي','حمام','مطبخ','غرفة نوم','جراج','معمل','استوديو',
'طبيب','مهندس','معلم','محامي','قاضي','شرطي','جندي','اطفائي','طيار','بحار','سائق','ميكانيكي','نجار','حداد','سباك','كهربائي','بناء','رسام','موسيقي','مغني','راقص','ممثل','مخرج','كاتب','شاعر','صحفي','مصور','طباخ','خباز','حلواني','صائغ','خياط','اسكافي','حلاق','عطار','بيطري','ممرض','صيدلي','عالم','باحث','محاسب','مدير','تاجر','بائع','مزارع','راعي','صياد','غواص','نجار','حداد',
'سرير','كرسي','طاولة','خزانة','رف','كنبة','ستارة','سجادة','وسادة','بطانية','مرآة','ساعة حائط','مصباح','ثلاجة','فرن','ميكروويف','غسالة','مكنسة','ممسحة','خلاط','غلاية','طنجرة','مقلاة','صحن','كأس','ملعقة','شوكة','سكين','مفتاح','هاتف','شاحن','كمبيوتر','تلفاز','ريموت','كتاب','قلم','دفتر','مقص','صمغ','شريط لاصق','مشط','فرشاة أسنان','معجون أسنان','شامبو','صابون',
'شمس','قمر','نجوم','سماء','سحاب','مطر','ثلج','برق','رعد','رياح','بحر','نهر','شلال','بحيرة','وادي','جبل','صحراء','رمال','عشب','شجر','زهرة','وردة','ياسمين','فل','نرجس','بابونج','نخلة','صنوبر','بلوط','صفصاف','غابة','كهف','جزيرة','بركان','زلزال','فيضان','عاصفة','اعصار','ضباب',
'كرة قدم','كرة سلة','كرة طائرة','كرة يد','تنس','سباحة','ملاكمة','جودو','كاراتيه','يوغا','جمباز','جري','دراجات','فروسية','رماية','شطرنج','داما','بوكر','أونو','الغاز','كمبيوتر','لابتوب','تابلت','ساعة ذكية','سماعات','كاميرا','ميكروفون','شاشة','فأرة','طابعة','راوتر','فلاشة','بطارية','شاحن','روبوت','انترنت','واي فاي','بلوتوث','تلسكوب','ميكروسكوب',
'بيتزا','برغر','شاورما','فلافل','حمص','فتوش','تبولة','كبة','باستا','رز','كبسة','مندي','سلطة','شوربة','جبنة','حليب','عسل','شوكولاتة','بقلاوة','كنافة','قطايف','عصير','شاي','قهوة','نسكافيه','كابتشينو','موكا','كوكتيل','لبن','حلاوة',
'ميكي ماوس','بندق','سبونج بوب','سنجوب','كابتن ماجد','شريك','توم','جيري','علاء الدين','سيمبا','ناروتو','ساسوكي','غوكو','لوفي','زورو','كونان','بي كاش','باباي','سندريلا','بياض الثلج'
];

const pr=new URLSearchParams(location.search),rf=pr.get('room');
if(rf){rid=rf;document.getElementById('host-screen').style.display='none';document.getElementById('join-screen').style.display='block';ck();}
else{document.getElementById('host-screen').style.display='block';document.getElementById('join-screen').style.display='none';}

function ck(){get(ref(db,'rooms/'+rid)).then(s=>{if(!s.exists()||!s.val().active){ex()}});}
function ex(){document.getElementById('join-screen').style.display='none';alert('⚠️ انتهت صلاحية الرابط!');setTimeout(()=>{location.href=location.origin+location.pathname},3000);}

window.createRoom=function(m){
    gm=m;mn='⚔️ SASUKE ⚔️';rid='r'+Date.now().toString(36);mid='h'+Date.now().toString(36);ih=true;
    set(ref(db,'rooms/'+rid),{gm,phase:'waiting',active:true,si:null,sw:null,vr:{},vl:{},msg:null}).then(()=>{
        set(ref(db,'rooms/'+rid+'/players/'+mid),{id:mid,name:mn,ih,eliminated:false});
        document.getElementById('mode-display').innerText=gm==='multi'?'٢':'١';
        document.getElementById('host-btns').style.display='block';
        document.getElementById('btn-start').style.display='inline-block';
        document.getElementById('room-link').style.display='block';
        document.getElementById('link-text').innerText=location.origin+location.pathname+'?room='+rid;
        document.getElementById('host-screen').style.display='none';
        document.getElementById('game-screen').style.display='block';
        alert('✅ تم إنشاء الغرفة!');
    }).catch(err=>alert('❌ خطأ: '+err.message));
};

window.joinRoom=function(){
    let n=document.getElementById('player-name').value.trim();
    if(!n) return alert('⚠️ اكتب اسمك!');
    mn=n;mid='p'+Date.now().toString(36);ih=false;
    get(ref(db,'rooms/'+rid)).then(s=>{
        if(s.exists()&&s.val().active){
            set(ref(db,'rooms/'+rid+'/players/'+mid),{id:mid,name:mn,ih,eliminated:false});
            document.getElementById('host-screen').style.display='none';
            document.getElementById('join-screen').style.display='none';
            document.getElementById('game-screen').style.display='block';
            alert('👋 مرحباً '+n+'!');
        } else { ex(); }
    });
};

window.copyLink=function(){navigator.clipboard.writeText(document.getElementById('link-text').innerText);alert('📋 تم نسخ الرابط!');document.getElementById('room-link').style.display='none';};
window.leaveRoom=function(){if(mid&&rid){if(ih)remove(ref(db,'rooms/'+rid));else remove(ref(db,'rooms/'+rid+'/players/'+mid));} location.reload();};
</script>
</body>
</html>
