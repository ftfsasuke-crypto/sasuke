<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MX_SASUKE | Multiplayer Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #ff0000; --bg: #0a0a0b; --card: #151517; --accent: #22c55e; --fail: #ef4444; }
        body { background: var(--bg); color: white; font-family: 'Cairo', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; margin: 20px 0; }
        
        h1 { color: white; margin-bottom: 25px; font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .game-btn { background: #111; border: 2px solid #333; color: white; padding: 15px; border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 12px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .game-btn:hover { border-color: var(--main); box-shadow: 0 0 15px rgba(255,0,0,0.3); }

        .input-field { width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #444; background: #000; color: white; font-size: 16px; text-align: center; font-family: 'Cairo'; margin-bottom: 15px; box-sizing: border-box; }
        .input-field:focus { outline: none; border-color: var(--accent); }

        .action-btn { background: var(--main); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .action-btn:hover { background: #cc0000; }
        .action-btn:disabled { background: #444; cursor: not-allowed; }

        .screen { display: none; animation: fadeIn 0.4s; }
        .active-screen { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .players-list { background: #000; border: 1px solid #333; border-radius: 10px; padding: 15px; max-height: 200px; overflow-y: auto; text-align: right; margin-bottom: 20px; }
        .player-item { padding: 8px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .player-item:last-child { border-bottom: none; }
        .online-dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--accent); }

        .secret-word-box { background: #111; border: 2px dashed var(--accent); border-radius: 15px; padding: 30px 15px; margin: 20px 0; font-size: 35px; font-weight: bold; color: white; text-shadow: 0 0 15px rgba(34,197,94,0.4); }
        .link-box { background: #000; padding: 12px; border-radius: 8px; border: 1px solid #444; color: #888; font-size: 12px; word-break: break-all; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu" class="screen active-screen">
        <h1>🎮 اختار الغرفة يا هوست</h1>
        <button class="game-btn" onclick="createRoom('naruto', 'أنمي ناروتو')">🍥 إنشاء غرفة (ناروتو)</button>
        <button class="game-btn" onclick="createRoom('aot', 'هجوم العمالقة')">⚔️ إنشاء غرفة (هجوم العمالقة)</button>
        <button class="game-btn" onclick="createRoom('dbz', 'دراجون بول')">🐉 إنشاء غرفة (دراجون بول)</button>
        <button class="game-btn" onclick="createRoom('ds', 'قاتل الشياطين')">🗡️ إنشاء غرفة (قاتل الشياطين)</button>
        <button class="game-btn" onclick="createRoom('monster', 'مونستر')">🧠 إنشاء غرفة (مونستر)</button>
        <button class="game-btn" onclick="createRoom('global', 'تخمين منوعات')">🌍 إنشاء غرفة (منوعات عالمية)</button>
    </div>

    <div id="host-lobby" class="screen">
        <h1 id="lobby-title">غرفة الانتظار ⏳</h1>
        <div class="link-box" id="invite-link">جاري إنشاء الرابط...</div>
        <button class="action-btn" onclick="copyLink()" style="font-size: 14px; margin-bottom: 20px; background: #333;">📋 نسخ الرابط لصحابك</button>
        <h3 style="text-align: right; color: var(--accent); margin-bottom: 10px;">المتصلين حالياً: <span id="host-count">1</span></h3>
        <div class="players-list" id="host-players"></div>
        <button class="action-btn" id="start-btn" onclick="startGame()" disabled>🚀 ابدأ اللعبة (لكل اللاعبين)</button>
    </div>

    <div id="guest-join" class="screen">
        <h1>👋 أهلاً بيك</h1>
        <input type="text" id="player-name" class="input-field" placeholder="اكتب اسمك عشان تدخل..." autocomplete="off">
        <button class="action-btn" id="join-btn" onclick="joinRoom()">دخول الغرفة 🚪</button>
        <p id="join-status" style="color: var(--accent); margin-top: 10px; display: none;">جاري الاتصال بصاحب الغرفة... ⏳</p>
    </div>

    <div id="guest-lobby" class="screen">
        <h1>⏳ مستنيين الهوست...</h1>
        <h3 style="text-align: right; color: var(--accent); margin-bottom: 10px;">المتصلين: <span id="guest-count">1</span></h3>
        <div class="players-list" id="guest-players"></div>
    </div>

    <div id="game-screen" class="screen">
        <h2 id="player-role-title">شخصيتك السرية هي:</h2>
        <div class="secret-word-box" id="my-secret-word">???</div>
        <p style="color: var(--fail); font-weight: bold; font-size: 13px;">ممنوع الغش أو عمل ريفريش 🤫</p>
        <h3 style="text-align: right; color: var(--accent); margin-top: 30px; margin-bottom: 10px;">قائمة اللاعبين (المراقبين):</h3>
        <div class="players-list" id="game-players"></div>
    </div>
</div>

<script>
    const DB = {
        naruto: ['ناروتو', 'ساسوكي', 'ساكورا', 'كاكاشي', 'ايتاشي', 'مادارا', 'جيرايا', 'تسونادي', 'اوروتشيمارو', 'شيكامارو', 'باين', 'اوبيتو', 'نيجي', 'جارا', 'هيناتا', 'روك لي', 'زابوزا', 'كابوتو'],
        aot: ['ايرين', 'ميكاسا', 'ارمين', 'ليفاي', 'ايروين', 'هانجي', 'راينر', 'زيك', 'ساشا', 'جان', 'هيستوريا', 'آني', 'بيك', 'فلوك'],
        dbz: ['غوكو', 'فيجيتا', 'غوهان', 'بيكولو', 'فريزا', 'سيل', 'ماجين بو', 'ترانكس', 'بيروس', 'ويز', 'اندرويد 18', 'مستر ساتان'],
        ds: ['تانجيرو', 'نيزوكو', 'زينيتسو', 'اينوسكي', 'غيو', 'رينجوكو', 'موزان', 'اكازا', 'شينوبو', 'تينغين', 'ميتسوري'],
        monster: ['دكتور تيما', 'يوهان ليبرت', 'نينّا فورتر', 'المفتش لونجي', 'غريمر', 'إيفا هاينمان', 'روبيرتو', 'ديتر'],
        global: ['بيتزا', 'تفاحة', 'أسد', 'موبايل', 'سيارة', 'مصر', 'دكتور', 'برجر', 'طيارة', 'كلب', 'كتاب', 'ساعة', 'قلم', 'كرسي']
    };

    // دوال التشفير السحرية لحل مشكلة اللغة العربية والـ undefined
    function safeEncode(str) { return encodeURIComponent(str); }
    function safeDecode(str) { try { return decodeURIComponent(str); } catch(e) { return str; } }

    const customConfig = {
        config: {
            'iceServers': [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };

    let peer = null;
    let connections = [];
    let playersList = []; // هتتخزن هنا بالشفرة
    let isHost = false;
    let roomCategory = '';
    let inviteUrl = '';

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('room')) {
            isHost = false;
            showScreen('guest-join');
        }
    };

    function updateUIList() {
        let listHTML = '';
        playersList.forEach(p => {
            // فك التشفير قبل العرض عشان يظهر عربي مظبوط
            let decodedName = safeDecode(p.name);
            listHTML += `<div class="player-item"><span>${decodedName}</span> <span class="online-dot"></span></div>`;
        });
        
        if (isHost) {
            document.getElementById('host-players').innerHTML = listHTML;
            document.getElementById('host-count').innerText = playersList.length;
            document.getElementById('start-btn').disabled = playersList.length < 2;
        } else {
            document.getElementById('guest-players').innerHTML = listHTML;
            document.getElementById('guest-count').innerText = playersList.length;
        }
        document.getElementById('game-players').innerHTML = listHTML;
    }

    function createRoom(category, catName) {
        roomCategory = category;
        document.getElementById('lobby-title').innerText = "غرفة: " + catName;
        showScreen('host-lobby');

        let roomId = Math.floor(10000 + Math.random() * 90000).toString();
        
        peer = new Peer('mx-sasuke-' + roomId, customConfig);
        
        peer.on('open', (id) => {
            let baseUrl = window.location.origin + window.location.pathname;
            inviteUrl = baseUrl + "?room=" + roomId;
            document.getElementById('invite-link').innerText = inviteUrl;
            
            // تشفير اسم الهوست
            playersList = [{id: 'host', name: safeEncode('أنت (الهوست) 👑')}];
            updateUIList();
        });

        peer.on('connection', (conn) => {
            conn.on('data', (data) => {
                if(data.type === 'join') {
                    connections.push(conn);
                    playersList.push({id: conn.peer, name: data.name}); // متخزن متشفّر جاهز
                    updateUIList();
                    broadcast({type: 'updateList', players: playersList});
                }
            });
            conn.on('close', () => {
                connections = connections.filter(c => c.peer !== conn.peer);
                playersList = playersList.filter(p => p.id !== conn.peer);
                updateUIList();
                broadcast({type: 'updateList', players: playersList});
            });
        });
    }

    function broadcast(data) {
        connections.forEach(c => c.send(data));
    }

    function copyLink() {
        navigator.clipboard.writeText(inviteUrl).then(() => { alert("تم النسخ! ابعته في الديسكورد 🚀"); });
    }

    function startGame() {
        let words = DB[roomCategory] || DB['global'];
        
        connections.forEach(conn => {
            let w = words[Math.floor(Math.random() * words.length)];
            // تشفير الكلمة السرية قبل الإرسال
            conn.send({type: 'gameStart', word: safeEncode(w)});
        });

        let hostWord = words[Math.floor(Math.random() * words.length)];
        document.getElementById('my-secret-word').innerText = hostWord;
        document.getElementById('player-role-title').innerText = "أنت الهوست.. شخصيتك هي:";
        
        showScreen('game-screen');
    }

    function joinRoom() {
        let name = document.getElementById('player-name').value.trim();
        if(name === "") return alert("اكتب اسمك الأول!");
        
        document.getElementById('join-btn').style.display = 'none';
        document.getElementById('join-status').style.display = 'block';

        let roomId = new URLSearchParams(window.location.search).get('room');
        peer = new Peer(customConfig);
        
        let connectionTimeout = setTimeout(() => {
            alert("فشل الاتصال بالهوست ❌\nالمشكلة من سرعة النت، حاول تدخل تاني.");
            document.getElementById('join-btn').style.display = 'block';
            document.getElementById('join-status').style.display = 'none';
            if(peer) peer.destroy();
        }, 10000);
        
        peer.on('open', () => {
            let guestConn = peer.connect('mx-sasuke-' + roomId, { reliable: true });
            
            peer.on('error', (err) => {
                clearTimeout(connectionTimeout);
                alert("الهوست مش متاح أو قفل الغرفة! خليه يعمل رابط جديد.");
                document.getElementById('join-btn').style.display = 'block';
                document.getElementById('join-status').style.display = 'none';
            });

            guestConn.on('open', () => {
                clearTimeout(connectionTimeout); 
                // تشفير اسم الضيف قبل إرساله للهوست
                guestConn.send({type: 'join', name: safeEncode(name)});
                showScreen('guest-lobby');
            });
            
            guestConn.on('data', (data) => {
                if(data.type === 'updateList') { 
                    playersList = data.players; 
                    updateUIList(); 
                }
                if(data.type === 'gameStart') {
                    // فك التشفير عن الكلمة السرية عشان تظهر صح
                    document.getElementById('my-secret-word').innerText = safeDecode(data.word);
                    showScreen('game-screen');
                }
            });
            
            guestConn.on('close', () => {
                alert("الهوست قفل الغرفة أو خرج من اللعبة!");
                window.location.href = window.location.href.split('?')[0];
            });
        });
    }
</script>

</body>
</html>
