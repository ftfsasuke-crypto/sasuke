<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الجاسوس</title>
<style>
    body {
        margin: 0; padding: 0;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: linear-gradient(135deg,#2c3e50,#4ca1af);
        display: flex; justify-content: center; align-items: center;
        min-height: 100vh; color: #fff;
    }
    .center-box {
        background: rgba(0,0,0,0.5);
        border-radius: 20px; padding: 30px;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        width: 90%; max-width: 500px;
        text-align: center;
    }
    h1 { margin-bottom: 25px; font-size: 28px; }
    input { padding: 12px; border-radius: 20px; border: none; width: 80%; margin-bottom: 15px; text-align:center; font-size:16px; }
    button {
        padding: 12px 25px; border-radius: 25px; border: none; cursor: pointer;
        background: linear-gradient(to right,#8e2de2,#4a00e0); color: #fff; font-size:16px; margin:8px 0;
    }
    button:disabled { background: #555; cursor: not-allowed; }
    .hidden { display:none; }
    ul { list-style:none; padding:0; width: 100%; text-align:center; }
    li { margin:5px 0; padding:10px; background: rgba(255,255,255,0.1); border-radius:10px; }
</style>
</head>
<body>

<div id="app" class="center-box">
    <h1>👑 SASUKE 👑</h1>

    <!-- شاشة الهوست -->
    <button id="start-game-btn">لعبة الجاسوس 1 🎮</button>
    <button id="copy-link-btn" class="hidden">نسخ الرابط 📋</button>

    <!-- شاشة الانضمام -->
    <div id="join-screen" class="hidden">
        <input type="text" id="player-name" placeholder="اكتب اسمك">
        <button id="join-btn">انضم 🚪</button>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-screen" class="hidden">
        <div id="category-screen" class="hidden">
            <h2>اختر تصنيف</h2>
            <div id="categories"></div>
        </div>
        <div id="word-display" class="hidden"></div>
        <button id="start-vote-btn" class="hidden">بدء التصويت 🗳️</button>
        <div id="vote-log-section" class="hidden">
            <ul id="player-list"></ul>
            <div id="vote-counter">0 / 0</div>
        </div>
        <button id="leave-btn">مغادرة 🚪</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
    authDomain: "spy-game-1d774.firebaseapp.com",
    databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com",
    projectId: "spy-game-1d774"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let rid, mid = 'h' + Date.now(), mn = "SASUKE", gm = 'normal', players = {}, spyId, spyWord, phase = 'waiting';
let categories = {
    "أكلات": ["تفاح","موز","برتقال","فراولة","عنب","مانجو","اناناس","بطيخ","شمام","كرز"],
    "فواكه": ["تفاح","موز","برتقال","فراولة","عنب","مانجو","اناناس","بطيخ","شمام","كرز"],
    "خضروات": ["خس","طماطم","خيار","جزر","بطاطس","بصل","ثوم","فلفل","كوسة","سبانخ"],
    "حيوانات": ["أسد","نمر","فيل","زرافة","ذئب","ثعلب","كلب","قط","حوت","دلفين"],
    "أجهزة": ["هاتف","كمبيوتر","لابتوب","تابلت","كاميرا","سماعات","ميكروفون","طابعة","راوتر","سماعة"],
    "رياضة": ["كرة قدم","تنس","سباحة","جري","جمباز","يوغا","كرة سلة","كرة يد","دراجات","ملاكمة"],
    "منزل": ["سرير","كرسي","طاولة","خزانة","ستارة","سجادة","وسادة","بطانية","مصباح","ثلاجة"],
    "دول": ["مصر","السعودية","الإمارات","قطر","الكويت","عمان","البحرين","الأردن","لبنان","سوريا"],
    "كرتون وأنمي": ["ناروتو","ساسوكي","غوكو","لوفي","سبونج بوب","ميكي ماوس","توم","جيري","شريك","كابتن ماجد"]
};

const startBtn = document.getElementById('start-game-btn');
const copyBtn = document.getElementById('copy-link-btn');
const joinScreen = document.getElementById('join-screen');
const joinBtn = document.getElementById('join-btn');
const playerNameInput = document.getElementById('player-name');
const categoryScreen = document.getElementById('category-screen');
const categoriesDiv = document.getElementById('categories');
const gameScreen = document.getElementById('game-screen');
const wordDisplay = document.getElementById('word-display');
const startVoteBtn = document.getElementById('start-vote-btn');
const leaveBtn = document.getElementById('leave-btn');
const playerList = document.getElementById('player-list');
const voteCounter = document.getElementById('vote-counter');

function show(el){el.classList.remove('hidden');}
function hide(el){el.classList.add('hidden');}

function createRoom(){
    rid = 'r'+Date.now();
    set(ref(db, 'rooms/'+rid), {gm, phase:'waiting', players:{[mid]:{name:mn, ih:true, eliminated:false}}});
    hide(startBtn); show(copyBtn);
    copyBtn.onclick = ()=>{
        navigator.clipboard.writeText(location.href+"?room="+rid);
        hide(copyBtn);
        show(joinScreen);
    };
}

function joinRoom(name){
    mid = 'p'+Date.now(); mn = name;
    get(ref(db,'rooms/'+rid)).then(snap=>{
        if(!snap.exists()||snap.val().phase!=='waiting'){ alert('⚠️ اللعبة قد بدأت بالفعل'); return; }
        set(ref(db,'rooms/'+rid+'/players/'+mid), {name:mn, ih:false, eliminated:false});
        hide(joinScreen); show(gameScreen); showCategorySelection();
    });
}

function showCategorySelection(){
    categoriesDiv.innerHTML='';
    Object.keys(categories).forEach(cat=>{
        let btn=document.createElement('button');
        btn.textContent = cat;
        btn.onclick = ()=>startGame(cat);
        categoriesDiv.appendChild(btn);
    });
    show(categoryScreen);
}

function startGame(cat){
    hide(categoryScreen);
    get(ref(db,'rooms/'+rid+'/players')).then(snap=>{
        players = snap.val();
        let ids = Object.keys(players);
        spyId = ids[Math.floor(Math.random()*ids.length)];
        let words = categories[cat];
        spyWord = words[Math.floor(Math.random()*words.length)];
        ids.forEach(id=>{
            update(ref(db,'rooms/'+rid+'/players/'+id), {word: (id===spyId)?null:spyWord});
        });
        update(ref(db,'rooms/'+rid), {phase:'playing', spyId, spyWord});
        showWord();
    });
}

function showWord(){
    let p = players[mid];
    wordDisplay.textContent = (mid===spyId) ? "أنت الجاسوس!" : "كلمتك: "+p.word;
    show(wordDisplay);
}

startBtn.onclick = createRoom;
joinBtn.onclick = ()=>joinRoom(playerNameInput.value.trim());

</script>

</body>
</html>
