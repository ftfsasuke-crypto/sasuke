<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Tajawal;
    background:linear-gradient(135deg,#1e2a78,#3c4fa3);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    color:white;
}

.box{
    background:rgba(0,0,0,0.35);
    padding:25px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:400px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:20px;
    font-size:18px;
    color:white;
    cursor:pointer;
    margin-top:12px;
}

.main-btn{background:linear-gradient(to right,#8e2de2,#4a00e0);}
.copy-btn{background:linear-gradient(to right,#00c6ff,#0072ff);}
.join-btn{background:linear-gradient(to right,#ff7e5f,#feb47b);}
.start-btn{background:linear-gradient(to right,#00ff87,#60efff);}

.player{
    background:rgba(255,255,255,0.1);
    padding:10px;
    border-radius:12px;
    margin-top:6px;
}

.host{
    border:2px solid gold;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="box" id="home">
<h1>👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑</h1>
<button class="main-btn" onclick="startGame()">🎮 لعبة الجاسوس</button>
</div>

<div class="box hidden" id="room">
<h2>🔥 تم إنشاء الغرفة</h2>

<button class="copy-btn" onclick="copyLink()">📋 نسخ الرابط</button>

<h3>اللاعبين:</h3>
<div id="players"></div>

<button id="startBtn" class="start-btn hidden" onclick="beginGame()">🚀 بدء اللعبة</button>
</div>

<div class="box hidden" id="join">
<h2>✍️ اكتب اسمك</h2>
<input id="nameInput" placeholder="اسمك">
<button class="join-btn" onclick="joinGame()">🚪 انضمام</button>
</div>

<script>

let roomId = null;

const params = new URLSearchParams(window.location.search);
if(params.get("room")){
    roomId = params.get("room");
    show("join");
}

function startGame(){
    roomId = Math.floor(Math.random()*100000);

    let players = [{
        name: "👑 𝐒𝐀𝐒𝐔𝐊𝐄",
        host: true
    }];

    localStorage.setItem("room_"+roomId, JSON.stringify(players));

    show("room");
    updatePlayers();
}

function copyLink(){
    let link = location.href.split("?")[0] + "?room=" + roomId;
    navigator.clipboard.writeText(link);
    alert("تم نسخ الرابط ✅");
}

function joinGame(){
    let name = document.getElementById("nameInput").value.trim();
    if(!name) return alert("اكتب اسمك");

    let players = JSON.parse(localStorage.getItem("room_"+roomId)) || [];

    players.push({
        name: name,
        host: false
    });

    localStorage.setItem("room_"+roomId, JSON.stringify(players));

    alert("تم الانضمام ✅");
}

function updatePlayers(){
    setInterval(()=>{
        let players = JSON.parse(localStorage.getItem("room_"+roomId)) || [];
        let div = document.getElementById("players");
        div.innerHTML = "";

        players.forEach(p=>{
            if(p.host){
                div.innerHTML += `<div class="player host">${p.name}</div>`;
            }else{
                div.innerHTML += `<div class="player">${p.name}</div>`;
            }
        });

        // إظهار زرار البدء
        if(players.length >= 3){
            document.getElementById("startBtn").classList.remove("hidden");
        }

    },1000);
}

// بدء اللعبة
function beginGame(){
    alert("🔥 بدأت اللعبة!");
}

function show(id){
    document.getElementById("home").classList.add("hidden");
    document.getElementById("room").classList.add("hidden");
    document.getElementById("join").classList.add("hidden");

    document.getElementById(id).classList.remove("hidden");
}

</script>

</body>
</html>
