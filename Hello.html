<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<title>🕵️ لعبة الجاسوس</title>

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background: linear-gradient(135deg,#1e3c72,#2a5298);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

#app{
width:90%;
max-width:500px;
background:rgba(255,255,255,0.08);
padding:25px;
border-radius:25px;
backdrop-filter:blur(20px);
text-align:center;
}

button{
background: linear-gradient(90deg,#667eea,#764ba2);
border:none;
padding:14px;
margin:8px;
border-radius:25px;
color:white;
font-size:16px;
cursor:pointer;
width:90%;
transition:.3s;
}

button:hover{transform:scale(1.05)}

input{
padding:14px;
width:85%;
border-radius:25px;
border:none;
margin:10px;
text-align:center;
}

ul{list-style:none;padding:0}
li{
background:rgba(255,255,255,.1);
margin:6px;
padding:12px;
border-radius:12px;
}

.overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.9);
display:flex;
justify-content:center;
align-items:center;
}

.popup{
background:#1a1a3e;
padding:25px;
border-radius:20px;
width:90%;
max-width:400px;
}

#word{
font-size:26px;
margin-top:20px;
color:#fff;
}

#linkBox{margin:10px 0;}

#startBtn{display:none;}
</style>
</head>

<body>

<div id="app">

<div id="home">
<h2>🕵️ لعبة الجاسوس</h2>
<button onclick="createRoom()">🎮 لعبة الجاسوس 1</button>
</div>

<div id="room" style="display:none;">
<div id="linkBox">
<p id="link"></p>
<button onclick="copyLink()">📋 نسخ الرابط</button>
</div>

<ul id="players"></ul>
<button id="startBtn" onclick="startGame()">
🚀 بدء اللعبة
</button>
</div>

<div id="game" style="display:none;">
<h2 id="word"></h2>
<button id="leaveBtn" onclick="leaveGame()">🚪 مغادرة</button>
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyDTyJqVntFqKe3I-zntb_rMx9Qcv7Nqi94",
databaseURL: "https://spy-game-1d774-default-rtdb.firebaseio.com"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let room="", playerId="", players={}, isHost=false, spyId="", word="";

// دخول من رابط
let params=new URLSearchParams(location.search);
if(params.get("room")){
room=params.get("room");
showJoin();
}

// عرض نافذة انضمام
function showJoin(){
let div=document.createElement("div");
div.className="overlay";
div.innerHTML=`
<div class="popup">
<h3>✍️ اكتب اسمك</h3>
<input id="name" placeholder="اسمك">
<button onclick="join()">🚪 انضمام</button>
</div>`;
document.body.appendChild(div);
}

function join(){
let name=document.getElementById("name").value.trim();
if(!name) return;

playerId="p"+Date.now();
isHost=false;

db.ref("rooms/"+room+"/players/"+playerId).set({name:name, active:true});

document.querySelector(".overlay").remove();
openRoom();
}

// إنشاء غرفة (هوست فقط)
function createRoom(){
room="r"+Date.now();
playerId="h"+Date.now();
isHost=true;

db.ref("rooms/"+room).set({
players:{
[playerId]:{name:"👑 𝐒𝐀𝐒𝐔𝐊𝐄 👑", active:true}
}
});

openRoom();

document.getElementById("link").innerText=
location.origin+location.pathname+"?room="+room;
}

// فتح الغرفة
function openRoom(){
document.getElementById("home").style.display="none";
document.getElementById("room").style.display="block";

// رابط الغرفة فقط للهوست
if(!isHost) document.getElementById("linkBox").style.display="none";

db.ref("rooms/"+room+"/players").on("value",snap=>{
players=snap.val()||{};
let html="";
for(let id in players){
html+=`<li>${players[id].name}</li>`;
}
document.getElementById("players").innerHTML=html;

// زر بدء اللعبة عند 3 لاعبين أو أكثر
if(isHost && Object.keys(players).length>=3){
document.getElementById("startBtn").style.display="block";
}
});

// تسجيل خروج اللاعب عند غلق التاب
window.addEventListener("beforeunload",()=>{
if(playerId && room){
db.ref("rooms/"+room+"/players/"+playerId).update({active:false});
}
});
}

// نسخ الرابط للهوست
function copyLink(){
navigator.clipboard.writeText(document.getElementById("link").innerText);
document.getElementById("linkBox").style.display="none";
}

// بدء اللعبة (اختيار جاسوس وكلمة)
function startGame(){
document.getElementById("startBtn").style.display="none";

// اختيار جاسوس عشوائي
let ids=Object.keys(players);
spyId=ids[Math.floor(Math.random()*ids.length)];

// اختيار كلمة عشوائية
let words=["تفاح","بيتزا","أسد","كمبيوتر","ناروتو"];
word=words[Math.floor(Math.random()*words.length)];

// حفظ في Firebase لكل اللاعبين
db.ref("rooms/"+room).update({spy:spyId, word:word, phase:"playing"});

// عرض الدور
showRole();
}

// عرض الدور لكل لاعب
function showRole(){
document.getElementById("room").style.display="none";
document.getElementById("game").style.display="block";

if(playerId===spyId){
document.getElementById("word").innerText="🕵️ أنت الجاسوس!";
}else{
document.getElementById("word").innerText="🔍 "+word;
}
}

// زر مغادرة
function leaveGame(){
db.ref("rooms/"+room+"/players/"+playerId).update({active:false});
alert("لقد غادرت المباراة");
document.getElementById("game").style.display="none";
document.getElementById("home").style.display="block";
}

</script>

</body>
</html>
